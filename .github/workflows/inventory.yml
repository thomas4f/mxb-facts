name: Update inventory
# Every Monday, or by hand. Two reads, one commit to main when anything changed, then the re-check issues:
# - tools/mxbmods_fetch.py re-reads each tied tool's mxb-mods.com or gpb-mods.com page into registry/mxb-mods.json
#   and registry/gpb-mods.json;
# - tools/releases_fetch.py finds each tool's newest release wherever it publishes (GitHub, the mods sites, Mega,
#   MediaFire, Google Drive, other links in its "downloads") into registry/releases.json, and lists in the run's
#   summary every tool whose newest release isn't the one its card covers;
# - tools/recheck_issues.py opens a re-check issue for each of those (once: not while one with its title is open).
# When a page no longer holds its tie, the page snapshots aren't committed (the build would refuse them), but the
# releases still are; when a release place can't be read, its last entry is kept. Either way the run fails, so it shows.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: update-inventory
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - id: pages
        continue-on-error: true
        run: python3 -I tools/mxbmods_fetch.py
      - id: releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEWER_OUT: ${{ runner.temp }}/newer.json
        run: python3 -I tools/releases_fetch.py
      - name: Commit if changed
        run: |
          if [ "${{ steps.pages.outcome }}" = success ]; then git add registry/mxb-mods.json registry/gpb-mods.json; fi
          git add registry/releases.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update inventory"
          git push
      - name: Open re-check issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/newer.json" ] || { echo "No release list (the release step didn't finish)."; exit 0; }
          python3 -I tools/recheck_issues.py "$RUNNER_TEMP/newer.json"
      - if: steps.pages.outcome == 'failure' || steps.releases.outcome == 'failure'
        run: |
          echo "::error::A page or release could not be read; see the step above and the run's summary."
          exit 1
