name: Check cards
# On every pull request and every push to main. A correction issue opened or closed is checked by issues.yml when it happens,
# and VirusTotal results reach main as a commit, so nothing changes on a schedule and there is no daily run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # "Analyse a tool" pushes its branch with the workflow's own token, which starts no other workflow, so it starts this
  # one by hand on that branch; the checks then show on its pull request.
  workflow_dispatch:
# A newer push to the same pull request or branch cancels the run it replaces.
concurrency: { group: "check-${{ github.ref }}", cancel-in-progress: true }
permissions:
  contents: read
  issues: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The whole history, so the build can compare the cards with the pull request's base branch.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # Mistakes in the Python (ruff.toml says which checks), before anything runs it.
      - run: ruff check
      - run: python3 -I tests/test_build.py
      # On a pull request the build also lists what the change does to each card's scores, marks and tags (in the run's summary).
      - run: python3 -I site/build.py
        env:
          CHANGES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
      # Every open correction issue is on its card, and every open correction on a card is an open issue.
      - run: python3 -I tools/check_corrections.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/repos
          key: repos-${{ hashFiles('cards/*.yaml') }}
          restore-keys: repos-
      - run: python3 -I tools/check_links.py
  # The built site, as players get it: every page is valid HTML (the W3C Nu validator), meets WCAG 2.2 AA in both themes (axe),
  # behaves and looks as its screenshots on a phone and a desktop (Playwright), keeps its Lighthouse budgets, and its script
  # passes ESLint. tests/site/README.md says how to run them and how to update a screenshot on purpose.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python3 -I site/build.py
      # The runner's own Node and Java; the versions of every checker are pinned in tests/site/package-lock.json.
      - run: npm ci
        working-directory: tests/site
      - run: npx playwright install --with-deps chromium
        working-directory: tests/site
      - run: npm run lint
        working-directory: tests/site
      - run: npm run validate
        working-directory: tests/site
      - run: npx playwright test
        working-directory: tests/site
      - run: npm run lighthouse
        working-directory: tests/site
      # On a failure, the screenshots that differ and the Lighthouse reports, to look at.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-checks
          path: |
            tests/site/test-results/
            tests/site/.lighthouseci/
          retention-days: 7
