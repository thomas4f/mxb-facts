name: Publish
on:
  push:
    branches: [main]
    # Files the site isn't made from: a push that changes only these doesn't publish again.
    paths-ignore: ["lab/**", "tests/**", "docs/**", ".claude/**", ".github/ISSUE_TEMPLATE/**", ".github/workflows/check.yml", ".github/workflows/issues.yml", ".github/workflows/inventory.yml", "registry/releases.json", ".github/workflows/virustotal.yml", ".github/workflows/analyse.yml"]
  # Update inventory and the VirusTotal lookup commit to main with the workflow's own token, and such a push starts no
  # other workflow, so the site is published again when either finishes.
  workflow_run:
    workflows: ["Update inventory", "VirusTotal lookup"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      held: ${{ steps.hold.outputs.held }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rule 9: the site isn't published while an item on MXBMRP3 is held back. The run then ends here, green, with a
      # notice, so a held item doesn't show as a failed run on every push.
      - id: hold
        run: |
          if grep -q "^  Held back:" cards/mxbmrp3-*.yaml; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Not published: an item on MXBMRP3 is held back (CLAUDE.md, rule 9)."
          fi
      - if: steps.hold.outputs.held != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - if: steps.hold.outputs.held != 'true'
        run: pip install -r requirements.txt
      # PUBLISH=1: the build itself also refuses to publish while an item on MXBMRP3 is held back.
      - if: steps.hold.outputs.held != 'true'
        run: python3 -I site/build.py
        env:
          PUBLISH: "1"
      - if: steps.hold.outputs.held != 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }
  deploy:
    needs: build
    if: needs.build.outputs.held != 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
