name: Publish
on:
  push:
    branches: [main]
    # Files the site isn't made from: a push that changes only these doesn't publish again.
    paths-ignore: ["lab/**", "tests/**", "docs/**", ".claude/**", ".github/ISSUE_TEMPLATE/**", ".github/workflows/check.yml", ".github/workflows/issues.yml", ".github/workflows/inventory.yml", "registry/releases.json", ".github/workflows/virustotal.yml", ".github/workflows/analyse.yml"]
  # Update inventory and the VirusTotal lookup commit to main with the workflow's own token, and such a push starts no
  # other workflow, so the site is published again when either finishes.
  workflow_run:
    workflows: ["Update inventory", "VirusTotal lookup"]
    types: [completed]
    branches: [main]
  # A tool's thread in Discussions and its comment count are read when the site is built (site/discussions.py), so a new
  # thread or comment publishes the site again.
  discussion:
    types: [created, edited, deleted, transferred, category_changed]
  discussion_comment:
    types: [created, deleted]
  workflow_dispatch:
permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write
# Never cancelled: a run of comments would otherwise keep stopping a push's deploy part way; a newer run waits its turn.
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    # Only a Tools thread changes what the site shows; talk under General publishes nothing.
    if: (github.event_name != 'discussion' && github.event_name != 'discussion_comment') || github.event.discussion.category.slug == 'tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python3 -I site/build.py
        env: { PUBLISH: "1", COUNT_VISITS: "1", GITHUB_TOKEN: "${{ github.token }}" }  # rule 9: refuses a card with a "Held back" row; the published site counts visits (GoatCounter)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
