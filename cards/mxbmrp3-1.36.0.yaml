files_note: >-
  No program file carries a Windows code signature, and the MSI has no signature stream
  (`lab/evidence/mxbmrp3-1.36.0/signature.txt`). The three plugins are the same in the zip, Setup.exe and the MSI
  (`lab/evidence/mxbmrp3-1.36.0/same-dlo.txt`). GitHub keeps a build attestation for each of the three downloads and the
  plugins, naming the release workflow, its run and the commit (`lab/evidence/mxbmrp3-1.36.0/release-api.txt`). The hashes
  match the files the Windows machine ran (`lab/results/mxbmrp3-1.36.0/ride-defaults-windows/machine.txt`,
  `lab/results/mxbmrp3-1.36.0/ride-defaults-windows/plugins.sha256`).
key:
  K1: No malware found. 3 of 68 engines flagged Setup.exe and 1 of 68 an NSIS plugin inside it; none flagged the zip, the MSI or the plugins.
  K2: 'No, it asks; it checks GitHub at game start, but the only check on the download is the hash GitHub lists beside it.'
  K3: 'Only its own files; listing the speech voices at load had Windows write its default voice to the registry, which stays.'
  K4: 'Yes, by Setup''s default; an anonymous usage survey with a random install ID, your OS, region format and features.'
  K5: No. It uses the plugin interface and draws its own HUD; it reads the game window's mouse wheel over its lists.
  K6: No. It doesn't unlock, copy or share other people's content.
  K7: Yes. The full source is public, under the MIT licence.
  K8: No. Its claims that were checked match the code.
  K9: Yes. The release is built from the tag's commit by GitHub Actions, with GitHub build attestations; not code-signed.
  K10: 'Yes. GitHub for updates at game start, and the usage survey when it is on; the rest only on your choice.'
areas:
  Your PC and files: >-
    Asks before installing updates from GitHub but checks them only against GitHub's own hash; touches only its own files,
    though Windows' speech library writes a default voice when it loads; not code-signed, but built by CI.
  Your data: >-
    An anonymous usage survey, on with Setup's default and off for a zip install, and the update check; both can be turned
    off, and every other connection is opt-in; aggregate survey results are published.
  Your game: >-
    A plugin that uses the plugin interface, catches the game's crashes and reads keys only while the game is in front; it
    takes mouse-wheel messages only over its own lists.
  Creators' content: Doesn't touch other people's content; it credits the libraries, fonts and icons it ships.
  Transparency: >-
    Full source public under the MIT licence; the release is built by GitHub Actions at the tagged commit, with build
    attestations, not rebuilt here; the public history is mostly one commit per release.
  Money: Free; the About page links to the author's Ko-fi.
sections:
  - title: Your PC and files
    blocks: []
  - title: Your data
    blocks:
      - table: [What, Where to, When, Switch]
        rows:
          - What: A request for the newest releases (user agent `MXBMRP3/1.36.0`); after you click Install, the zip
            Where to: '`api.github.com`, then `github.com`'
            When: At every game start once its settings file exists (not the very first start)
            Switch: '"Update" mode Off (Notify by default), under Updates'
          - What: >-
              Usage survey: random install ID, session ID, version, game, OS and version, Windows region format, which
              features, HUDs and themes are on, achievement tiers, launch count, days since install, session length, and a
              summary of the last crash (module, offset, code)
            Where to: '`eu.aptabase.com` or `us.aptabase.com` (by the key built in), and `mxbmrp3.goatcounter.com` (a launch count grouped by install ID)'
            When: At game start and at a clean exit, and on some clicks, while the survey is on
            Switch: '"Usage survey" (on with Setup''s default; off on the first start of a zip install), Settings > General'
          - What: A file that can only lower how much of the survey is sent
            Where to: '`raw.githubusercontent.com`'
            When: At game start, while the survey is on
            Switch: '"Usage survey"'
          - What: Your track, server, session, state and progress as Steam rich presence; your friends' presence back
            Where to: Your Steam friends, through the game's own Steam connection
            When: While "Steam" is on
            Switch: '"Steam" (off on a new install)'
          - What: Your status in the game
            Where to: The Discord app on your PC
            When: While Discord is on (MX Bikes)
            Switch: Discord (off)
          - What: The track name and bike category
            Where to: '`server.cbrservers.com` or `mxb-ranked.com`'
            When: When the Records HUD fetches records
            Switch: Records HUD, auto-fetch off
          - What: Reads your channel's chat (anonymous on Twitch)
            Where to: '`irc-ws.chat.twitch.tv`, `www.youtube.com`'
            When: While Stream Chat is on
            Switch: Stream Chat (off)
          - What: The HUD data, riders' names included, as web pages and JSON
            Where to: '`127.0.0.1:8080` (a server on your PC)'
            When: While the web overlay is on
            Switch: Web overlay (off)
  - title: Your game
    blocks: []
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks: []
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "Two go online by default: the update check, and the anonymous usage survey (the installer asks first; a ZIP
              install starts with it off)." (README)
            Verdict: Matches
            Evidence: >-
              [analytics_manager.cpp line 229](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/analytics_manager.cpp#L229),
              [settings_manager.cpp lines 930-974](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/settings_manager.cpp#L930-L974),
              [mxbmrp3.nsi lines 954-958](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/packaging/mxbmrp3.nsi#L954-L958).
              The update check doesn't run on the very first start, before a settings file exists (D1).
          - Claim: >-
              "Will an update install itself? No. ... The download is checked against the SHA-256 checksum GitHub publishes
              for it, and nothing is installed without one." (docs/what-it-does.md)
            Verdict: Matches
            Evidence: >-
              [update_checker.cpp lines 482-495](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_checker.cpp#L482-L495),
              [update_downloader.cpp lines 436-453](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_downloader.cpp#L436-L453); `lab/evidence/mxbmrp3-1.36.0/src-update.txt`.
          - Claim: >-
              "Settings menu, dragging, hotkeys: Reads mouse and keyboard state from Windows ... the keyboard only while the
              game is in front ... It never sends input." (docs/what-it-does.md)
            Verdict: Matches
            Evidence: >-
              [input_manager.cpp lines 351-361](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/input_manager.cpp#L351-L361);
              `lab/evidence/mxbmrp3-1.36.0/src-input.txt`, `lab/evidence/mxbmrp3-1.36.0/imports-dlo.txt`.
          - Claim: >-
              "Web overlay: A small web server on this PC (`127.0.0.1:8080`) ... Only the pages it serves can read its data, so
              other websites open in your browser cannot" (docs/what-it-does.md)
            Verdict: Matches
            Evidence: >-
              [http_server.cpp lines 355-366](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/http_server.cpp#L355-L366),
              [http_server_internal.h lines 140-144](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/http_server_internal.h#L140-L144). Not run.
          - Claim: >-
              "It never changes the game's files. ... Apart from its own files there, ... everything the plugin writes goes
              under `Documents\PiBoSo\[Game]\mxbmrp3\`." (docs/what-it-does.md)
            Verdict: Matches
            Evidence: >-
              Both rides wrote nothing in the game folder beyond the bare demo's two logs
              (`lab/evidence/mxbmrp3-1.36.0/runs.txt`); `lab/evidence/mxbmrp3-1.36.0/src-files.txt`.
          - Claim: >-
              "When the usage survey is on, the plugin may also fetch a small config file from this repository that can only
              ever reduce what's sent, never add to it." (README)
            Verdict: Matches
            Evidence: >-
              [analytics_remote_config.h lines 35-58](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/analytics_remote_config.h#L35-L58): it reads only a
              fraction from 0 to 1 of launches that send the full set.
          - Claim: >-
              "The uninstaller ... deletes the plugin DLO, the `mxbmrp3_data\` folder, and the registry entry. If you've ever
              updated from inside the plugin, also delete `plugins\mxbmrp3_update_backup\`; the uninstaller leaves it." (README)
            Verdict: Matches
            Evidence: >-
              [mxbmrp3.nsi lines 1768-1805](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/packaging/mxbmrp3.nsi#L1768-L1805). Not run.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX
              Bikes demo, offline.
            questions: []
          - text: >-
              The runs were the first start of a zip install, offline: the usage survey starts off on a zip install and the
              update check doesn't run before a settings file exists, so neither connection was seen; what they send rests
              on the source, which the release is built from by CI but wasn't rebuilt here.
            questions: [D1, D2, D3, D8]
          - text: >-
              Setup ran 90 s without being clicked through, so it installed nothing; the MSI and the uninstallers weren't run.
              What they write and remove rests on their NSIS and WiX sources.
            questions: [P4, P6, P8]
          - text: >-
              No setting was changed in the plugin: Steam, Discord, the Records HUD, Stream Chat, the web overlay, Now playing,
              the spotter, Direct GL and the in-game updater rest on the source.
            questions: [P3, D4, D5, D10, G2]
          - text: >-
              The GP Bikes plugin (`mxbmrp3_gpb.dlo`) wasn't run in the GP Bikes demo; it is built from the same source.
            questions: [G2, G5, G6]
          - text: >-
              No crash happened in the runs (the test host's crash case sets the bike's crash flag, not a program crash), so the
              crash handler wasn't seen at work; it rests on the source and the plugin's imports.
            questions: [G8]
          - text: >-
              Not rebuilt: the plugins are built with Visual Studio 2022 on Windows, which this setup doesn't have. GitHub's
              build attestations were read from its API, but their Sigstore signatures weren't checked here.
            questions: [T4]
          - text: >-
              The two MSI custom-action DLLs weren't looked up on VirusTotal, and only the first 40 of the release's files
              were looked up.
            questions: [P1]
answers:
  P1:
    verdict: Partly
    mark: note
    text: >-
      3 of 68 engines flagged `mxbmrp3-Setup.exe` (APEX, Google, Ikarus) and 1 of 68 its NSIS plugin `System.dll` (Cynet,
      last scanned 26 Jul 2026); 0 flagged `mxbmrp3-Setup.msi` (of 61), `mxbmrp3.zip` (66), the three plugins (68 each),
      `nsDialogs.dll` (71), `LangDLL.dll` (71) or `LICENSE` (62), on the hash lookup of 27 Nov 2026. The three downloads were
      already on VirusTotal and nothing was uploaded. `README.txt` and `THIRD_PARTY_LICENSES.md` from the zip aren't on
      VirusTotal (hash lookup on 27 Nov 2026); the MSI's two custom-action DLLs weren't looked up.
    evidence: >-
      [mxbmrp3-Setup.exe](https://www.virustotal.com/gui/file/7de7744fb563d075a1996ce4e3be71ee7e311f3ef059d5bbd3797ac9332d381d),
      [mxbmrp3-Setup.msi](https://www.virustotal.com/gui/file/87f81c9fc083b90bccbc4d04e24d33813223b8c9d09fdef1d9e077b6db20e4b1),
      [mxbmrp3.zip](https://www.virustotal.com/gui/file/3bd964d6d93a263be950c2719944a6543de21a8d996f01df4d310664bbee12e9),
      [mxbmrp3.dlo](https://www.virustotal.com/gui/file/f06929a2616d7183a5b19a6aa8f9a752cb488cbf7b66ec0af0fb5336a7bc1768),
      [mxbmrp3_gpb.dlo](https://www.virustotal.com/gui/file/4ac71f3bfea796070baa23a4a6a186c5a77c66867be7301ef14d8cfe820a81f2),
      [mxbmrp3_krp.dlo](https://www.virustotal.com/gui/file/156cd0537ded408fc4ed64dc59020ad804e7cf652763beada4a7c6c8e5f8295b),
      [LICENSE](https://www.virustotal.com/gui/file/7b458f0a37c5318168f4d82f9e786dea982e512a3d835b7affbc14fc2030f828),
      [System.dll](https://www.virustotal.com/gui/file/51815942c614424480d2e4f0e1fe0122b1b4201c4cfe0ef273c4bb22d14de24a),
      [nsDialogs.dll](https://www.virustotal.com/gui/file/86b26a9b93e4ba5fc59454228515d13b9b30593d3f194dc1d168e15a9be63ede),
      [LangDLL.dll](https://www.virustotal.com/gui/file/85a60644cd508ddc83c206b373f1bf7f07193df03268fd1a3842592c83de00b6),
      [README.txt](https://www.virustotal.com/gui/file/e1660f3e57b5bb4d4d9da398f4cd2f8435e519b2f87410009803ed4d6d0e7382),
      [THIRD_PARTY_LICENSES.md](https://www.virustotal.com/gui/file/4fde2138ff0f73b2c962a1074b0b20089957241b89b51480c6243d0712c3b067)
  P2:
    verdict: 'No'
    mark: good
    text: >-
      The update setting has only Off and Notify (Notify by default). With Notify it checks GitHub at game start and tells you
      a new version is there; it downloads and installs only when you click Install, and the new version loads at the next
      game start.
    evidence: >-
      [update_checker.h lines 28-31](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_checker.h#L28-L31),
      [update_checker.cpp line 27](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_checker.cpp#L27),
      [settings_manager.cpp lines 754-768](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/settings_manager.cpp#L754-L768);
      `lab/evidence/mxbmrp3-1.36.0/src-update.txt`.
  P3:
    verdict: Partly
    mark: concern
    text: >-
      The only check comes from the same place as the file: the zip's size and SHA-256 must equal what GitHub's API lists for
      that file in the same answer, and nothing is installed without a digest. Nothing is signed; GitHub's build attestations
      for the release aren't checked by the updater.
    evidence: >-
      [update_checker.cpp lines 482-495](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_checker.cpp#L482-L495),
      [update_downloader.cpp lines 416-453](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_downloader.cpp#L416-L453);
      `lab/evidence/mxbmrp3-1.36.0/src-update.txt`.
  P4:
    verdict: 'No'
    mark: good
    text: >-
      It deletes and overwrites only its own files: an update moves its plugin and `mxbmrp3_data` to
      `plugins\mxbmrp3_update_backup` before unpacking (rejecting names with `..`), Setup's fresh-install choice and the
      uninstaller's "remove data" option delete its own `Documents\PiBoSo\<game>\mxbmrp3` folder, and the uninstallers delete
      its plugin, data folder and uninstaller.
    evidence: >-
      [update_downloader_install.cpp lines 211-248](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_downloader_install.cpp#L211-L248),
      [update_downloader_install.cpp lines 425-432](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/mxbmrp3/core/update_downloader_install.cpp#L425-L432),
      [mxbmrp3.nsi lines 84-88](https://github.com/thomas4f/mxbmrp3/blob/bab7bfa6d547527b8f95af2dde654afdb9dea111/packaging/mxbmrp3.nsi#L84-L88),
