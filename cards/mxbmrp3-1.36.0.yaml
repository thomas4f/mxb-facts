tool: MXBMRP3
version: 1.36.0
by_maintainer: true
summary: >-
  A HUD plugin that draws standings, timing, a map, widgets and decks inside MX Bikes and GP Bikes through the plugin
  interface, with optional extras such as a local web overlay, Steam and Discord presence, stream chat and a spotter voice.
  Its source is on GitHub under the MIT licence and the release is built by GitHub Actions; with Setup's default it sends an
  anonymous usage survey, and it checks GitHub for updates, which it installs only when you click.
header:
  What it is: >-
    A game plugin (`mxbmrp3.dlo` for MX Bikes, `mxbmrp3_gpb.dlo` for GP Bikes, plus one for Kart Racing Pro) with its
    `mxbmrp3_data` folder, put in the game's `plugins` folder by Setup (`.exe` or `.msi`) or by hand from the zip. It draws
    its HUDs, widgets and menus through the plugin interface and keeps its settings, stats and logs in
    `Documents\PiBoSo\<game>\mxbmrp3`.
  In one line: An in-game HUD plugin with standings, timing, map, widgets and optional online extras
  Category: HUD
  Author: thomas4f (GitHub [thomas4f](https://github.com/thomas4f))
  Game: MX Bikes; GP Bikes
  mxb-mods.com: '[MXBMRP3](https://mxb-mods.com/mxbmrp3/)'
  gpb-mods.com: None found (a search of gpb-mods.com for MXBMRP3 found no post, 27 Nov 2026)
  Homepage: '[thomas4f.github.io/mxbmrp3](https://thomas4f.github.io/mxbmrp3/)'
  GitHub: '[thomas4f/mxbmrp3](https://github.com/thomas4f/mxbmrp3)'
  Version analysed: >-
    [v1.36.0](https://github.com/thomas4f/mxbmrp3/releases/tag/v1.36.0) (tag `v1.36.0`, published 27 Nov 2026), the tool's
    latest GitHub release when this run started.
  Source commit: >-
    [bab7bfa6d547527b8f95af2dde654afdb9dea111](https://github.com/thomas4f/mxbmrp3/tree/bab7bfa6d547527b8f95af2dde654afdb9dea111)
    ("Release v1.36.0", 27 Nov 2026), the commit tag `v1.36.0` points to.
  Analysed on: 27 Nov 2026
  Tested in: 'MX Bikes beta21f (demo), installer SHA-256 `76feb83746e785310e8858938dd50b5e0685d1b0004480d5d1c2d4fc21f11949`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The licence is MIT, which allows the analysis. The source was read at the commit (the updater, the usage survey, input,
    the crash handler, the web server, the online features, Setup's NSIS script and the MSI's WiX files); the plugins were
    found byte for byte the same in the zip, Setup.exe and the MSI; the MX Bikes plugin's imports, VirtualProtect call sites,
    code-signing entry and text were read with `objdump` and `strings`; the release's uploader and GitHub's build attestations
    were read from GitHub's API. The release wasn't rebuilt (T4). Every command is in `lab/evidence/mxbmrp3-1.36.0/run.sh`.
    A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys
    ran the zip's MX Bikes plugin in the MX Bikes demo (beta21f), offline behind a firewall block, under Process Monitor: the
    bare demo as baseline, a 90 s ride, and a 120 s ride with the backtick key, Page Down and Page Up pressed; all three
    reached the track. Then the plugin test host with the bystander plugin (keys and the crash flag, and the helmet view),
    and Setup.exe for 90 s without clicking through it. The GP Bikes plugin wasn't run. VirusTotal: hash lookups made
    before the analysis (27 Nov 2026); nothing was uploaded.
