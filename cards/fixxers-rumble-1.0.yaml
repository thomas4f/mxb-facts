tool: FIXXER's Controller Rumble
version: '1.0'
summary: >-
  A closed-source GP Bikes plugin that makes XInput controllers rumble from the game's bike telemetry, with a settings panel on Ctrl+R.
  Its files show no internet connection and no writes outside its own folder; it was read from its files only, not run.
header:
  What it is: >-
    A closed-source plugin (`FIXXER_RUMBLE_GPB64.dlo` and a `FIXXER_Rumble_Data` folder) that goes into GP Bikes' `plugins` folder.
    From the telemetry the game passes to plugins, it drives the two rumble motors of XInput controllers, and it draws a settings panel,
    opened with Ctrl+R, whose SAVE button writes `settings.txt` in its folder.
  In one line: GP Bikes plugin that rumbles XInput controllers from bike telemetry
  Category: Controllers
  Author: FIXXER 1001 (the name on its gpb-mods.com page and in its README)
  Game: GP Bikes
  gpb-mods.com: '[FIXXER’s Controller Vibration/Rumble](https://gpb-mods.com/fixxers-controller-vibration-rumble/)'
  Homepage: None found
  GitHub: None found
  Version analysed: >-
    V1.0 (the version its README and gpb-mods.com page give), the MEGA download linked from the gpb-mods.com page, updated 5 Jul 2026;
    no tag
  Source commit: None (closed source, no public repository)
  Analysed on: 22 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the release nor its page carries a licence or a clause against analysis, so the release files were
    examined: imports, exports and the code-signing entry (`objdump -p`), text (`strings`, `strings -el`) and chosen call sites
    (`objdump -d`); every command is in `lab/evidence/fixxers-rumble-1.0/run.sh`. The zip was downloaded from its MEGA link and decrypted
    as the MEGA web client does, with `tools/mega_fetch.py`, which checks MEGA's own MAC of the file. Not rebuilt (no public source).
    Not run: the throwaway Windows machine fetches release files by plain https links, and this release's only download is a MEGA link,
    so neither the real-game ride nor the test-host cases were made (see Limits). VirusTotal: the hash lookup made before the analysis
    also fetches by plain https links, so none of these files was looked up; nothing uploaded.
