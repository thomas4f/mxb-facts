tool: FIXXER's Controller Rumble
version: '1.0'
summary: >-
  A GP Bikes plugin that drives the two rumble motors of an XInput controller from the bike's telemetry, with a settings panel
  on Ctrl+R. It makes no internet connection and writes only its log and settings, in its own folder.
header:
  What it is: >-
    A closed-source plugin (`FIXXER_RUMBLE_GPB64.dlo` and a `FIXXER_Rumble_Data` folder) that goes into the game's `plugins`
    folder. On track it sets the rumble of XInput controllers from the telemetry the game passes to plugins, and Ctrl+R opens
    a panel where each rumble source can be switched and scaled, then saved to `settings.txt`.
  In one line: Plugin that rumbles an XInput controller from GP Bikes telemetry, set in a Ctrl+R panel
  Category: Controllers
  Author: FIXXER 1001 (the name on its gpb-mods.com page and in its READ ME)
  Game: GP Bikes
  gpb-mods.com: '[FIXXER''s Controller Vibration/Rumble](https://gpb-mods.com/fixxers-controller-vibration-rumble/)'
  Homepage: None found
  GitHub: None found
  Version analysed: >-
    V1.0, as its READ ME and gpb-mods.com page name it (the plugin's own panel shows "V1.1"): `FIXXER_s_Rumble.zip`, the
    [MEGA download](https://mega.nz/file/EPwQ2C7Y#h8ljtwB07QDbCWzQgLDRSv252Ti_6nYuzyFjnE2FiNw) linked from the gpb-mods.com page
    (page updated 5 Jul 2026). There are no tags or commits: the source isn't public.
  Analysed on: 23 Nov 2026
  Tested in: 'GP Bikes beta22b (demo), installer SHA-256 `82941f66e66e96bdce56b0652e89b973da817915c0f2af5536698ea2467d2ea3`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the release nor its gpb-mods.com page carries a licence or a clause against analysis, so the
    release files were examined: imports, exports and code-signing entry (`objdump -p`), text (`strings`, `strings -el`), and
    every call site of the imports that read keys, drive the controller, write files or change memory protection (`objdump -d`);
    every command is in `lab/evidence/fixxers-rumble-1.0/run.sh`. The release was not rebuilt (no public source). A throwaway
    Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no controller and no keys
    ran the plugin in the GP Bikes demo (beta22b), offline behind a firewall block, under Process Monitor: the bare demo as
    baseline, a 90 s ride with the shipped settings, and a ride pressing Ctrl+R twice; then the plugin test host (a crash case
    with the bystander plugin's checks, and a case that opens the panel with Ctrl+R and clicks SAVE). The real game online and
    a real controller were not used. VirusTotal: hash lookups only (made before the analysis, 22 Nov 2026), nothing uploaded.
