tool: ProjectGPB2
version: v2
summary: >-
  Three GP Bikes plugins that redraw the game's graphics, add a rider's-eye camera and add exhaust, dust and weather effects,
  set in a menu on F6. They make no internet connection; to do their work they redirect the game's OpenGL functions and
  replace its shader programs in memory.
header:
  What it is: >-
    A closed-source pack of three plugins (`ProjectGPB2_core64.dlo`, `ProjectGPB2_cam64.dlo`, `ProjectGPB2_fx64.dlo`) with
    shaders, rain sounds and graphics presets, copied into the game's `plugins` folder. They put their own code in front of
    the game's OpenGL drawing to add post-processing, weather, seasons, exhaust and dust effects and a helmet camera, and save
    screenshots on a key.
  In one line: Graphics overhaul, helmet camera and effects plugins that hook GP Bikes' OpenGL drawing
  Category: Gameplay and visuals
  Author: X1mk_Z3 (the name on its gpb-mods.com page)
  Game: GP Bikes
  gpb-mods.com: '[ProjectGPB2](https://gpb-mods.com/projectgpb2-2/) (published 10 Nov 2026, updated 12 Nov 2026)'
  Homepage: None found
  GitHub: None found
  Version analysed: >-
    v2 (its README: "PROJECTGPB2 V2 (build 4.2)"): `1794501261-projectgpb2-v2.zip`, the download on its
    [gpb-mods.com page](https://gpb-mods.com/projectgpb2-2/), given as the release to analyse (no card yet, no entry in
    `registry/releases.json`). There are no tags or commits: the source isn't public.
  Analysed on: 24 Nov 2026
  Tested in: 'GP Bikes beta22b (demo), installer SHA-256 `82941f66e66e96bdce56b0652e89b973da817915c0f2af5536698ea2467d2ea3`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the release nor its gpb-mods.com page carries a licence or a clause against analysis (the README
    only asks to link to the download page instead of re-uploading), so the release files were examined: imports, exports,
    sections and code-signing entry (`objdump -p`, `objdump -h`), text (`strings`, `strings -el`, also of the extra code
    section `.gpb2tx`), and the call sites of the imports that change memory protection, read memory and threads, catch
    exceptions, move files and read keys, with the function each sits in from the plugins' own symbol table (`objdump -d`);
    every command is in `lab/evidence/projectgpb2-v2/run.sh`. The release was not rebuilt (no public source). A throwaway Windows Server 2025 machine
    with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran the plugins in the GP Bikes demo
    (beta22b), offline behind a firewall block, under Process Monitor: the bare demo as baseline, a run with the shipped
    settings, one pressing F6, Tab, Down, Right, F9, Ctrl+F9 and F8, and one pressing F6, Tab and Enter on the Effects page.
    None of the four game runs got past the main menu, so the plugins ran in the menu, not on track. Then the plugin test host
    ran them with the bystander plugin's checks (all three; the core plugin alone; F6, Tab, F9 and F8; helmet view; a rider
    crash). The real game online was not used. VirusTotal: hash lookups only (made before the analysis, 24 Nov 2026), nothing
    uploaded, because no licence was found.
