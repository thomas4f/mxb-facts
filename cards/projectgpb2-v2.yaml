files_note: >-
  No plugin is code-signed (`lab/evidence/projectgpb2-v2/signature.txt`). The zip's hash matches the one the Windows machine ran
  (`lab/results/projectgpb2-v2/ride-defaults-windows/machine.txt`), and the plugins' the ones the game loaded
  (`lab/results/projectgpb2-v2/ride-defaults-windows/plugins.sha256`). Three preset files aren't on VirusTotal and four files weren't looked up (P1).
key:
  K1: 'No malware found. No engine flags the zip or any file in it that was looked up.'
  K2: 'No. It has no updater.'
  K3: 'No. It deletes no file; it writes its settings, logs, presets and screenshots.'
  K4: 'No. It makes no internet connection.'
  K5: 'Yes. It redirects the game''s OpenGL functions and replaces its shader programs in memory, by default; no game check is got around.'
  K6: 'No. It decrypts, copies and shares nothing; it reads each bike''s gfx.cfg and the game''s exhaust data for its effects.'
  K7: 'No. Only the compiled plugins (and the shaders as text) are published.'
  K8: 'Yes, as far as checked; nothing its README says on these questions differs from what was found.'
  K9: 'No. Not code-signed, and there is no public source to trace it to.'
  K10: 'No. It has no network code, and the runs tried no connection.'
areas:
  Your PC and files: >-
    No updater or installer and no file deleted; it writes its settings and logs in `plugins\ProjGPB2`, and screenshots, on
    F8, in a folder of its own in the game folder; not code-signed.
  Your data: No internet connection and no network code; it reads each bike's `gfx.cfg` and, on Ctrl+V, the clipboard.
  Your game: >-
    It redirects the game's OpenGL functions (and those another plugin keeps) to its own code, replaces the game's shader
    programs, reads the game's memory for exhaust data and logs every crash in the game; the screenshot key works in any window.
  Creators' content: It reads each bike's `gfx.cfg` and the game's exhaust data for its effects; it decrypts and copies nothing.
  Transparency: Closed source with no licence, published as a zip on gpb-mods.com.
  Money: Free; its gpb-mods.com page asks for donations.
sections:
  - title: Your PC and files
    blocks:
      - text: >-
          Also found: after the test host unloaded the plugins, the game's OpenGL pointers still pointed into them: they don't
          put back what they redirected (`lab/results/projectgpb2-v2/bystander-windows/host.log`, "host import table check (after unload)").
        mark: note
  - title: Your data
    blocks: []
  - title: Your game
    blocks:
      - text: >-
          Also found: the core plugin runs a watch thread that, when the game draws no new frame for two seconds, suspends the
          game's render thread, reads where it stopped and writes that to `ProjGPB2.log` ("FREEZE: no new frame for 2.2 s - render
          thread ... at gpbikes.exe+0x186955") (`lab/evidence/projectgpb2-v2/callsites.txt`, `hang_watch` and `watch_thread`;
          `lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-ProjGPB2.log`).
        mark: note
      - text: >-
          Also found: about a third of the core plugin's code, the plugin functions GetInterfaceVersion, RunTelemetry and EventInit
          included, sits in an extra code section, `.gpb2tx`, placed after the debug sections and without function names; it
          looks up the Windows functions it uses by name (`SetWindowLongPtrA`, `CallWindowProcA`, `CreateFileA`, `WriteFile`,
          `VirtualAlloc`, `SHBrowseForFolderA` and others) instead of importing them. The cam and fx plugins have smaller ones.
          Its text is readable and belongs to the menu, screenshots, folder picker and crash log (`lab/evidence/projectgpb2-v2/sections.txt`,
          `lab/evidence/projectgpb2-v2/exports-jump.txt`, `lab/evidence/projectgpb2-v2/gpb2tx-strings.txt`).
        mark: note
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks: []
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: '"plugins\ProjectGPB2_core64.dlo graphics + the menu, plugins\ProjectGPB2_cam64.dlo rider POV camera, plugins\ProjectGPB2_fx64.dlo backfires, smoke, heat haze, dust, weather" (README.txt)'
            Verdict: Matches
            Evidence: 'The GP Bikes demo loaded all three, and each logged its start: "Graphics Overhaul 2.2.0", "Helmet Camera 2.2.0", "GameFX+ 2.2.0" (`lab/results/projectgpb2-v2/ride-defaults-windows/loaded.txt`, `lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-ProjGPB2.log`, `lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-camera.log`, `lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-gamefx.log`).'
          - Claim: '"F9 graphics on / off (compare with the normal game)", "Ctrl+F9 reload settings" (README.txt)'
            Verdict: Matches
            Evidence: 'After F9, F9 and Ctrl+F9 the log reads "graphics off", "graphics on", "config + shaders reloaded" (`lab/results/projectgpb2-v2/menu-toggle-reload-windows/ProjGPB2-ProjGPB2.log`).'
          - Claim: '"Screenshots: a key of your choice (default F8) saves exactly what you see - every effect, no menu - as a PNG in a folder you pick (CAMERA > SCREENSHOTS)" (README.txt, v2.3)'
            Verdict: Partly
            Evidence: 'F8 saved PNGs without a folder being picked, into `ProjectGPB2 screenshots` in the game folder; picking a folder is optional (CHOOSE) (`lab/results/projectgpb2-v2/menu-toggle-reload-windows/files.diff`, `lab/evidence/projectgpb2-v2/gpb2tx-strings.txt`).'
          - Claim: '"Settings are saved to plugins\ProjGPB2\ProjGPB2.ini." (README.txt)'
            Verdict: Matches
            Evidence: 'Every run wrote `plugins\ProjGPB2\ProjGPB2.ini` (`lab/results/projectgpb2-v2/ride-defaults-windows/files.diff`).'
          - Claim: '"Exhaust effects, headlight and brake light are now off by default (turn them on under Effects)." (README.txt, v4.0)'
            Verdict: Not checked
            Evidence: 'With the shipped settings the fx plugin logged "roost off, exhaust effects on", and the settings template it holds has `exhaust=1`, but no run reached a track to show whether flames are drawn (`lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-gamefx.log`, `lab/evidence/projectgpb2-v2/strings-files.txt`; see Limits).'
          - Claim: '"Exact pipe positions on every bike (packed .pkz bikes and other riders too): read from the game''s own exhaust data." (README.txt)'
            Verdict: Not checked
            Evidence: 'The fx plugin reads exhaust tables only from a loaded game module of one exact size (0x673000 bytes), and otherwise uses each bike''s `gfx.cfg` or the menu''s sliders; no run logged either way (`lab/evidence/projectgpb2-v2/ProjectGPB2_fx64.dlo.1f1262910-1f12629a5.txt`, `lab/evidence/projectgpb2-v2/strings-exhaust.txt`).'
          - Claim: '"VR (-vrs): ProjectGPB2 switches itself off." (README.txt, v1.6)'
            Verdict: Matches
            Evidence: 'GetInterfaceVersion looks up GetCommandLineA and searches the command line for "-vr" (`lab/evidence/projectgpb2-v2/ProjectGPB2_core64.dlo.38c623910-38c623999.txt`); not run with -vrs.'
          - Claim: '"Diagnostic logging and GPU profiling removed." (README.txt, v4.0)'
            Verdict: Partly
            Evidence: '`ProjGPB2.log` still gets a status line every 10 to 20 s and, on a stall, the frozen render thread''s stack (`lab/results/projectgpb2-v2/ride-defaults-windows/ProjGPB2-ProjGPB2.log`).'
          - Claim: '"UNINSTALL: Delete the three ProjectGPB2_*.dlo files (and the ProjGPB2 folder)." (README.txt)'
            Verdict: Partly
            Evidence: 'That leaves `plugins\presets` (its three presets and any you saved) and the `ProjectGPB2 screenshots` folder (`lab/evidence/projectgpb2-v2/file.txt`, `lab/results/projectgpb2-v2/menu-toggle-reload-windows/files.diff`).'
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the GP
              Bikes demo, offline. Frame times and what the effects look like say nothing about a real PC.
            questions: []
          - text: >-
              None of the four real-game runs, the baseline included, got past the game's main menu (each screenshot shows it), so
              the plugins were never seen on track in the real game: the keys were pressed in the menu, and the exhaust, dust,
              weather and camera effects, the reads of the bikes' exhaust data and of `gfx.cfg` weren't seen there. The test host
              did call the on-track plugin functions. Which rows the Effects-page presses changed was guessed from the README.
            questions: [G4, C5, D6]
          - text: >-
              Closed source: the plugins were read from their imports, text, symbol names and the call sites named on the lines,
              not decompiled in full; the code in `.gpb2tx` has no names. A read or write of the game's memory through an address
              worked out at run time would not show in these.
            questions: [P9, G4, D10]
          - text: >-
              The real game on an online server can't be reached here (the demo has no online play). That the plugins change only
              what is drawn rests on their code and texts: no check for online sessions was found.
            questions: [G3]
          - text: >-
              No other ruts plugin was loaded, so the calls to another plugin's RutsDrive and RutsGetMap weren't seen.
            questions: [G3, G6]
          - text: >-
              No run had an older presets folder, so the move of preset files into `plugins\presets` wasn't seen; that it moves
              only `.ini` presets rests on its code.
