  G6:
    verdict: 'Yes'
    mark: concern
    text: >-
      The bystander plugin's own table of OpenGL pointers was redirected to the plugins in the test host: they swap the pointers
      other loaded modules keep, not only the game's. With another "overhaul" plugin loaded they chain onto its hooks
