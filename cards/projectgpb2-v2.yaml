    evidence: >-
      "bystander plugin (victim.dlo) pointer table: glOrtho REDIRECTED to ...ProjectGPB2_fx64.dlo" (`lab/results/projectgpb2-v2/bystander-windows/host.log`,
      also with the core plugin alone: `lab/results/projectgpb2-v2/core-alone-windows/host.log`); `lab/evidence/projectgpb2-v2/strings-hooks.txt`, `lab/evidence/projectgpb2-v2/strings-rutlink.txt`.
  G7:
    verdict: 'Yes'
    mark: note
    text: >-
      Every frame it reads the screenshot key (default F8, `shot_key`) with GetAsyncKeyState without checking which window is in
      front, so F8 pressed in another program saves a screenshot. Its menu and graphics keys are read only after a check that
