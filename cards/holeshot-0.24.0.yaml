tool: HoleShot HUD
version: 0.24.0
summary: >-
  A transparent HUD window (standings, relative, map, radar, lap times and more) that draws on top of MX Bikes from data its
  game plugin shares, with an installer that puts the plugin in the game. Its source is on GitHub without a licence, and the
  release is built from the tag by GitHub Actions.
header:
  What it is: >-
    Two parts: `Holeshot-HUD.dlo`, a plugin in the game's `plugins` folder that reads the game through the plugin interface and
    shares it in memory, and `Holeshot-HUD.exe`, a separate program that draws the HUD widgets in a transparent window over the
    game, with F8 settings, feedback, an updater and an optional local page for streaming. Setup (or the zip's `Install.bat`)
    installs the program to `%LOCALAPPDATA%\Holeshot HUD` and copies the plugin into the game.
  In one line: A HUD window drawn over MX Bikes from data its game plugin shares
  Category: HUD
  Author: LeadingTrendTechnologies (GitHub organisation [LeadingTrendTechnologies](https://github.com/LeadingTrendTechnologies))
  Game: MX Bikes
  mxb-mods.com: '[Holeshot HUD](https://mxb-mods.com/holeshot-hud/)'
  Homepage: None found
  GitHub: '[LeadingTrendTechnologies/HoleshotHUD](https://github.com/LeadingTrendTechnologies/HoleshotHUD)'
  Version analysed: >-
    [v0.24.0](https://github.com/LeadingTrendTechnologies/HoleshotHUD/releases/tag/v0.24.0) (tag `v0.24.0`, published 26 Oct
    2026), the newest release in `registry/releases.json`, found on GitHub; the mxb-mods.com page lists no file of its own.
  Source commit: >-
    [3ffdbf366023c19e1741178e39b5704a91728819](https://github.com/LeadingTrendTechnologies/HoleshotHUD/tree/3ffdbf366023c19e1741178e39b5704a91728819)
    ("Ship 0.24.0 so a practice fuel fill and a track guide stay behind Labs.", 26 Oct 2026), the commit tag `v0.24.0` points to.
  Analysed on: 23 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The repository has no licence file and its docs forbid no analysis. The source was read at the commit; the zip's scripts and
    README were compared with it (the same apart from line endings), the plugin was found byte for byte inside the program, and
    the imports, code-signing entries and text of both program files were read with `objdump` and `strings`. The release wasn't
    rebuilt (T4). Setup (Inno Setup 6.7.0) couldn't be unpacked here (innoextract 1.9 doesn't read that version). Every command
    is in `lab/evidence/holeshot-0.24.0/run.sh`. A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software
    OpenGL, not Windows on a real GPU) and no keys ran the plugin in the MX Bikes demo (beta21e), offline behind a firewall block,
    under Process Monitor: the bare demo as baseline and a 120 s ride, which didn't reach the track (see Limits); then the plugin
    test host with the bystander plugin, the program for 90 s on its own (no game), the program with `--wait-for-game`, and
    Setup for 60 s without clicking through it. No key was pressed in the program. VirusTotal: hash lookups only (made before the
    analysis, 23 Nov 2026), nothing uploaded.
