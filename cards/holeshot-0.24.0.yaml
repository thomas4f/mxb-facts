files_note: >-
  No file is code-signed (`lab/evidence/holeshot-0.24.0/signature.txt`). The scripts and README in the zip are the files of
  `installer/` at the commit apart from line endings (`lab/evidence/holeshot-0.24.0/same-as-source.txt`), and the program carries
  the plugin byte for byte (`lab/evidence/holeshot-0.24.0/embedded-dlo.txt`). Setup holds the same files, by its script
  ([holeshot.iss lines 46-52](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/holeshot.iss#L46-L52)); it wasn't unpacked (`lab/evidence/holeshot-0.24.0/setup.txt`).
  The hashes match the files the Windows machine ran (`lab/results/holeshot-0.24.0/ride-windows/machine.txt`,
  `lab/results/holeshot-0.24.0/ride-windows/plugins.sha256`).
key:
  K1: No malware found. 2 of 70 engines flagged Setup and 1 of 71 the plugin; the zip isn't on VirusTotal.
  K2: 'No by default; with "Update automatically on launch" on it installs without asking, checking only GitHub''s own hash.'
  K3: 'Yes; it sets a Windows compatibility flag for `mxbikes.exe` that uninstalling leaves; its optional menus rewrite game files, with a backup.'
  K4: 'Only on request; feedback sends your report and last race log, and two profile pages carry your Steam ID.'
  K5: 'No by default; it reads the game through the plugin interface, and two options change what you see in the game.'
  K6: No. It doesn't unlock, copy or share other people's content.
  K7: 'No; the program and plugin are built from the public source, but the repository holds a Python bytecode file whose source isn''t in it.'
  K8: Yes, as far as checked; one uninstall line is only partly right (see "What it says vs what it does").
  K9: Yes. The release is built from the tag by GitHub Actions; nothing is signed.
  K10: Yes. It asks GitHub for the newest release at every start; other connections only on your choice.
areas:
  Your PC and files: >-
    Its plugin and program set a Windows compatibility flag for `mxbikes.exe` that uninstalling leaves; an opt-in updater checks
    only GitHub's own hash; nothing is signed, but the release is built by CI.
  Your data: >-
    Asks GitHub for updates at every start; feedback and profile pages send your report or Steam ID only when you use them, and
    the plugin shares riders' names in memory any program of yours can read.
  Your game: >-
    A plugin that only uses the plugin interface and catches the game's crashes, plus a separate HUD window that reads F8 and
    the mouse; two options hide the game's pitboard or restyle its menus.
  Creators' content: Doesn't touch other people's content; it credits the icon font but not the Rust libraries built in.
  Transparency: >-
    Source public without a licence; the release is built from the tag by GitHub Actions, not rebuilt here; a Python bytecode
    file in the repository has no source in it.
  Money: Free; no shop and no donation request.
sections:
  - title: Your PC and files
    blocks: []
  - title: Your data
    blocks:
      - table: [What, Where to, When, Switch]
        rows:
          - What: A request for the newest release, with the user agent `mxbo-overlay`; then the zip, to update
            Where to: '`api.github.com`, then `github.com`'
            When: Every program start; the download with auto-update on, or when you click install
            Switch: None for the check; "Update automatically on launch" (off) for the download
          - What: Your feedback, version, first version, OS, and for a bug report the last race log; later, your ticket IDs to fetch replies
            Where to: '`holeshot-hud.vercel.app` (the author''s feedback service)'
            When: When you press Send in Feedback; replies while settings are open, after you have sent one
            Switch: Only sent when you press Send
          - What: The pages, in a window inside settings; the MXB-Ranked and CBR addresses carry your Steam ID
            Where to: '`mymxb.com`, `mxb-ranked.com`, `cbrservers.com`'
            When: When you open those Profile tabs
            Switch: Only when you open them
          - What: An ICMP ping every 2 s
            Where to: The game server you are on, or `1.1.1.1`
            When: While the Systems widget shows its meters
            Switch: The Systems widget (off)
          - What: The stream HUD as images, and its layout
            Where to: '`127.0.0.1`, ports 8765 to 8775 (a server on your PC)'
            When: While "Browser Source" is on
            Switch: '"Browser Source" (off)'
  - title: Your game
    blocks:
      - text: >-
          Also found: in the real-game run with the plugin, the demo stayed on its Testing screen after "To Track" was clicked
          three times, while the bare demo went to the track; the plugin wrote only its own `last-trail.txt` and the
          compatibility flag. One run on software OpenGL doesn't show whether the plugin caused it
          (`lab/evidence/holeshot-0.24.0/runs.txt`; `lab/results/holeshot-0.24.0/ride-windows/shot_ride.png`,
          `lab/results/holeshot-0.24.0/baseline-windows/shot_ride.png`).
        mark: note
  - title: Creators' content
    blocks:
      - text: >-
          Also found: the MyMXB tab shows mymxb.com inside the program and adds a script to that site that hides and removes its
          Google ad slots
          ([mymxb.rs lines 72-185](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/settings/mymxb.rs#L72-L185),
          [mymxb.rs line 414](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/settings/mymxb.rs#L414);
          `lab/evidence/holeshot-0.24.0/src-mymxb.txt`).
        mark: note
  - title: Transparency
    blocks:
      - text: >-
          Also found: the repository holds a presence service (`overlay/src/presence.rs`, `presence/`) that would post your race
          number and name to a Cloudflare worker, but the program doesn't build it: `main.rs` declares no such module and the
          program holds no `workers.dev` address
          ([main.rs lines 3-27](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/main.rs#L3-L27);
          `lab/evidence/holeshot-0.24.0/presence-absent.txt`).
        mark: note
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "Setup finds Steam MX Bikes (registry + Steam library folders) and copies `Holeshot-HUD.dlo` into the game `plugins`
              folder." (README)
            Verdict: Matches
            Evidence: >-
              [install-plugin.ps1 lines 9-35](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/install-plugin.ps1#L9-L35),
              [install-plugin.ps1 lines 78-86](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/install-plugin.ps1#L78-L86),
              [holeshot.iss lines 162-180](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/holeshot.iss#L162-L180). Setup wasn't clicked through in the run.
          - Claim: '"The overlay copies the plugin again on launch if it is missing or outdated." (README)'
            Verdict: Matches
            Evidence: >-
              It writes the plugin it carries when the game's copy is missing or differs
              ([plugin.rs lines 162-190](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/plugin.rs#L162-L190),
              [main.rs line 305](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/main.rs#L305)).
          - Claim: >-
              "Layout is saved to `Documents\PiBoSo\MX Bikes\Holeshot-HUD.ini`. Uninstall deletes that file and AppData leftovers
              so a reinstall is a fresh install." (README)
            Verdict: Partly
            Evidence: >-
              The uninstallers delete that file and the logs, reviews, track bests and game path under
              `%LOCALAPPDATA%\Holeshot HUD`
              ([uninstall.ps1 lines 86-109](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/uninstall.ps1#L86-L109),
              [holeshot.iss lines 67-77](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/installer/holeshot.iss#L67-L77)); they leave the copy of `boot.txt` it writes to
              `%TEMP%\Holeshot HUD\logs`, the `Documents\PiBoSo\MX Bikes\Holeshot-HUD` folder and the compatibility flag (P8)
              ([record.rs lines 748-760](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/record.rs#L748-L760);
              `lab/results/holeshot-0.24.0/overlay-windows/outside.txt`). Not run.
          - Claim: >-
              "In-app feedback (F8 → Feedback) posts to `/api/feedback` and stores **private gists**, not GitHub issues." (README)
            Verdict: Not checked
            Evidence: >-
              The program posts to `https://holeshot-hud.vercel.app/api/feedback`, and the service's source in the repository makes
              private gists ([feedback.rs line 16](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/feedback.rs#L16),
              [feedback.js line 84](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/api/feedback.js#L84)); what runs on that server can't be seen from here.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX
              Bikes demo, offline.
            questions: []
          - text: >-
              The real-game ride didn't reach the track (the demo stayed on its Testing screen), so the plugin ran only in the menus
              there, and the program never ran beside the game. What the plugin shares while riding, and what the program does
              when it finds the game (the compatibility flag, copying the plugin, the pitboard override), rest on the source.
            questions: [P7, D10, G3, G5, G7]
          - text: >-
              No key was pressed and no setting was changed in the program: the settings window, Feedback, the Profile tabs, the
              Systems widget, "Browser Source", "MX Bikes menus", the Pit Board widget and "Update automatically on launch" rest on
              the source, read at the commit, which the release is built from by CI but wasn't rebuilt here.
            questions: [P2, P3, P4, D2, D3, D4, D5, D6, G9]
          - text: >-
              Setup ran 60 s without being clicked through, so it installed nothing, and the zip's install and uninstall scripts
              weren't run; what they do rests on reading them (the zip's are the repository's files) and on Setup's script.
              Setup itself couldn't be unpacked here (innoextract 1.9 doesn't read Inno Setup 6.7.0).
            questions: [P8]
          - text: >-
              Not rebuilt: the plugin is a Visual Studio 2022 project and the program is built with Microsoft's toolchain on
              Windows, which this setup doesn't have; the Rust toolchain isn't pinned either (T6).
            questions: [T4]
          - text: >-
              The Rust libraries (315 packages in `overlay/Cargo.lock`, from crates.io) weren't read; they are named and pinned
              by checksum in the lock file.
            questions: [P9]
answers:
  P1:
    verdict: Partly
    mark: note
    text: >-
      2 of 70 engines flagged `HoleshotHUD-Setup.exe` (APEX, Skyhigh) and 1 of 71 flagged `Holeshot-HUD.dlo` (Rising); 0 flagged
      `Holeshot-HUD.exe` (of 70), `Install-Plugin.ps1` (61), `Uninstall.bat` (60), `Uninstall.ps1` (62) and `README.txt` (60),
      on the hash lookup of 23 Nov 2026. Not on VirusTotal: the zip, `Install.bat` and `Install.ps1`. Nothing uploaded.
    evidence: >-
      [HoleshotHUD-Setup.exe](https://www.virustotal.com/gui/file/8faa862dc2b081d6e56b223b06fefecee84e02adee00d3d96ffc9dbd785b2846),
      [Holeshot-HUD-0.24.0-windows-x64.zip](https://www.virustotal.com/gui/file/6fc20a6367a6bd5d6f27dbabec73978645615fe96bb36458b9272bc8ae7b728c),
      [Holeshot-HUD.exe](https://www.virustotal.com/gui/file/bf2a1d9ca2fc99ff4eafa369d04ffd02f1074aa7f3856741e3171dada2b46cfb),
      [Holeshot-HUD.dlo](https://www.virustotal.com/gui/file/f33c16d76d343902ed6d5ca02649cb007519977491518104ef62a313b839a9c1),
      [Install.bat](https://www.virustotal.com/gui/file/4640ea10b04ff0ccfa138b36f41bf39020235ce813a71e92971b93b821258b1a),
      [Install.ps1](https://www.virustotal.com/gui/file/2bcd5adf57843c6fb3f35122f0ccadb9f0ca7a614e2d16c8fe50afbc71e7a1a0),
      [Install-Plugin.ps1](https://www.virustotal.com/gui/file/24b9f5d087c8cf64ab5eee830a26693b4ebc9e4be2b591f8eb70c46c37d50de6),
      [Uninstall.bat](https://www.virustotal.com/gui/file/2d0e85e92f493825293373b2a79023e7a94149bc5d00df79b58e1f3e206adfe7),
      [Uninstall.ps1](https://www.virustotal.com/gui/file/1c167c607b276fbbac24005f01474ccb159b6ff2f333a38ccc31599aabf7ac61),
      [README.txt](https://www.virustotal.com/gui/file/34c19f948a3086a32c03fcdb463d4ed0a7966d062b5f39b7992e8b56923062dc)
  P2:
    verdict: Yes, not by default
    mark: concern
    text: >-
      With "Update automatically on launch" on (off by default), each program start downloads the newest GitHub release's zip
      and, if it is newer, replaces the program and the plugin beside it without asking, then restarts; the program then copies
      the new plugin into the game. By default it only checks GitHub at start and shows that an update is there; installing
      takes a click.
    evidence: >-
      [main.rs lines 284-290](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/main.rs#L284-L290),
      [update.rs lines 138-152](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L138-L152),
      [update.rs lines 181-202](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L181-L202),
      [update.rs lines 434-438](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L434-L438),
      [config.rs line 2803](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/hud/src/config.rs#L2803);
      `lab/evidence/holeshot-0.24.0/src-update.txt`, `lab/evidence/holeshot-0.24.0/src-defaults.txt`.
  P3:
    verdict: Partly
    mark: concern
    text: >-
      The only check comes from the same place as the file: the zip's SHA-256 must equal the `digest` GitHub's API gives for
      that file of the same release, and its address must be this repository's GitHub download over HTTPS; nothing is signed,
      so anyone who can publish a release there passes the check.
    evidence: >-
      [update.rs lines 230-245](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L230-L245),
      [update.rs lines 304-308](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L304-L308),
      [update.rs lines 329-340](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/update.rs#L329-L340);
      `lab/evidence/holeshot-0.24.0/src-update.txt`.
  P4:
    verdict: Partly
    mark: note
    text: >-
      It only backs up and rewrites such files, keeping the originals, and only with an option that is off by default. With "MX Bikes menus" on (off by default), it rewrites the game's `ui\english.str` (two menu labels) and writes its menu
      files over the game's in `ui`, after copying the stock files (and the game's `ui.pkz` contents) to `ui.holeshot-bak` in the
      game folder; turning it off deletes its files and copies the backup back. By default it deletes only its own files: its
      earlier plugin name `plugins\mxbo.dlo`, and its settings and logs when you uninstall.
    evidence: >-
      [pack.rs lines 177-210](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/game_ui/pack.rs#L177-L210),
      [pack.rs lines 314-334](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/game_ui/pack.rs#L314-L334),
      [io.rs lines 11-27](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/game_ui/io.rs#L11-L27),
      [plugin.rs lines 192-194](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/overlay/src/plugin.rs#L192-L194);
      `lab/evidence/holeshot-0.24.0/src-gamefiles.txt`, `lab/evidence/holeshot-0.24.0/src-defaults.txt`.
  P5:
    verdict: 'No'
    mark: note
    text: >-
      No file is code-signed: not Setup, the program or the plugin. They are built from the public tag by GitHub Actions (T3).
    evidence: Empty Security Directory (`lab/evidence/holeshot-0.24.0/signature.txt`); `lab/evidence/holeshot-0.24.0/release-api.txt`.
  P6:
    verdict: 'Yes'
    mark: concern
    text: >-
      By default, the plugin at every game start, and the program when it finds the game, add `~ DISABLEDXMAXIMIZEDWINDOWEDMODE`
      (Windows' "Disable fullscreen optimisations" compatibility setting) for `mxbikes.exe` under `HKCU\Software\Microsoft\Windows
      NT\CurrentVersion\AppCompatFlags\Layers`; the real-game run shows the game process writing it, which the bare demo doesn't.
      "Open when Windows starts" and "Open when MX Bikes opens" add its own Run values (G9).
    evidence: >-
      [plugin.cpp lines 67-122](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/3ffdbf366023c19e1741178e39b5704a91728819/src/plugin.cpp#L67-L122),
