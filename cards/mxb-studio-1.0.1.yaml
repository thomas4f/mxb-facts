  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: '"Official signed MXB Studio downloads." (README)'
            Verdict: Partly
            Evidence: >-
              The installer carries a valid Authenticode signature (`lab/evidence/mxb-studio-1.0.1/signature.txt`); the two
              `.nupkg` update packages have no package signature (`lab/evidence/mxb-studio-1.0.1/nupkg-signature.txt`), and
              whether the files inside them are signed can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/readme.txt`.
          - Claim: >-
              "Save your project, open the main menu, and choose Check for updates. Once the update is downloaded, close
              Studio normally and reopen it." (Help)
            Verdict: Not allowed
            Evidence: >-
              The update feed on its site names the full package with its SHA-256 (`lab/evidence/mxb-studio-1.0.1/feed.txt`);
              what the app does with it can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/help.txt`.
          - Claim: >-
              "Update requests/downloads contact the site and release hosts including GitHub. Optional Discord activity
              shares generic “Building a track” status without project names/paths." (Privacy Policy)
            Verdict: Not allowed
            Evidence: Its connections can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/privacy.txt`.
          - Claim: >-
              "wyDay’s LimeLM/TurboActivate receives license/product and hardware-derived activation information." (Privacy
              Policy, for Pro)
            Verdict: Not allowed
            Evidence: What it sends can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/privacy.txt`.
          - Claim: '"Free download. No account required." (homepage)'
            Verdict: Not allowed
            Evidence: >-
              Whether the app asks for an account can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/home.txt`,
              `lab/evidence/mxb-studio-1.0.1/terms.txt`.
          - Claim: '"Install in MX Bikes installs a Player track in your chosen game folder." (Export guide)'
            Verdict: Not allowed
            Evidence: What it writes into the game's folders can't be looked at (licence). `lab/evidence/mxb-studio-1.0.1/help.txt`.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              Its Software License Terms forbid reverse engineering and decompiling the software (Licence clause), so nothing
              in the release was run, installed, unpacked or disassembled, and every answer that would need it is "Not
              allowed".
            questions: []
          - text: >-
              Only the installer was looked up on VirusTotal, before the analysis; the two `.nupkg` update packages weren't.
              Nothing was uploaded.
            questions: [P1]
          - text: >-
              Whether it asks for donations was read on its release page, README and website only; the app's own screens
              weren't seen.
            questions: [M3]
          - text: >-
              The public pages (Software License Terms, Privacy Policy, Terms of Service, plans, help) are quoted as they read
              on 26 Nov 2026; they aren't pinned to the release and can change.
            questions: [M1, M2]
          - text: >-
              Its mxb-mods.com page links a MediaFire download, which answered this run with a browser check, so that file
              wasn't fetched or compared with the GitHub release; the card covers the GitHub release, where the homepage's
              download button leads.
            questions: []
