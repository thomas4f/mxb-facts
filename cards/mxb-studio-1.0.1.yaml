  K1: 'Not on VirusTotal yet. No engine has scanned the installer, and looking inside it for malware is not allowed by its licence.'
  K2: 'Not allowed. Its licence forbids looking at how it updates; its help says you choose "Check for updates".'
  K3: 'Not allowed. Its licence forbids looking at what it writes or deletes.'
  K4: 'Not allowed. Its licence forbids looking at what it sends.'
  K5: 'Not allowed. Its licence forbids looking at what it does to the game.'
  K6: 'Not allowed. Its licence forbids looking at how it treats other people''s content.'
  K7: 'No. The repository holds only a README and the release files.'
  K8: 'Not allowed. Its licence forbids comparing its docs with its code.'
  K9: 'Partly. The installer is code-signed; the update packages carry no package signature, and there is no public source to trace them to.'
  K10: 'Not allowed. Its licence forbids looking at its connections.'
areas:
  Your PC and files: >-
    A code-signed Windows installer and two update packages without a package signature; what it installs, changes and
    updates is not allowed to be looked at.
  Your data: >-
    Not allowed to be looked at; its Privacy Policy describes update requests, an optional Discord status, and sign-in and
    licence activation for Pro.
  Your game: Not allowed to be looked at; a desktop app, not a game plugin, that its help says installs exported tracks into the game's track folder.
  Creators' content: Not allowed to be looked at.
  Transparency: Closed source under proprietary licence terms; the public repository holds only a README.
  Money: Free to use; Studio Pro, with more tools, costs $6 a month or $60 a year.
