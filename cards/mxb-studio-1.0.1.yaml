tool: MXB Studio
version: 1.0.1
summary: >-
  A closed-source track builder app for MX Bikes, free to use, with a Pro subscription that adds tools. Its Software License
  Terms forbid reverse engineering it, so this card covers public facts only.
header:
  What it is: >-
    A Windows desktop app for building MX Bikes tracks (terrain, track features, scenery) and exporting them for the game,
    released as a code-signed installer, `MXBStudio-win-Setup.exe`, with two update packages. It is not a game plugin. Its
    Software License Terms forbid reverse engineering, so nothing in the release was run or looked inside.
  In one line: Closed-source MX Bikes track builder app; its licence forbids looking inside it
  Category: Content creation
  Author: >-
    Tanner Smith (smithtan91-netizen on GitHub, TannyGlover on mxb-mods.com; the name on its Software License Terms and its
    code signature)
  Game: MX Bikes
  mxb-mods.com: '[MXB Studio](https://mxb-mods.com/mxb-studio-create-your-entire-mx-bikes-track-in-one-app/)'
  Homepage: '[mxbstudio.com](https://mxbstudio.com)'
  GitHub: '[smithtan91-netizen/mxb-studio-downloads](https://github.com/smithtan91-netizen/mxb-studio-downloads) (releases only)'
  Version analysed: >-
    [v1.0.1](https://github.com/smithtan91-netizen/mxb-studio-downloads/releases/tag/v1.0.1), published 24 Nov 2026: the
    tool's latest GitHub release when this run started. The homepage's download button leads to the same installer
    (`lab/evidence/mxb-studio-1.0.1/download.txt`).
  Source commit: >-
    No source is public. The tag v1.0.1 points to
    [9518e331eff3d27984be476363881ee65019d451](https://github.com/smithtan91-netizen/mxb-studio-downloads/tree/9518e331eff3d27984be476363881ee65019d451),
    which holds only `README.md` (`lab/evidence/mxb-studio-1.0.1/repo.txt`).
  Analysed on: 26 Nov 2026
  Licence clause: >-
    "Without our written permission, do not reverse engineer/decompile the proprietary software, bypass or falsify
    license/access controls, redistribute/sublicense/rent/resell it, share access beyond the permitted use, or remove
    proprietary notices." ([Software License Terms](https://mxbstudio.com/software-license.html), "Restrictions and
    third-party rights", effective 8 Nov 2026, covering "the proprietary software and its updates"; page SHA-256
    `08585c1bc64b89a4b93c6c403847a684e2b6b7fb1e9b49ee2caec1d6a37a51d8` as fetched on 26 Nov 2026;
    `lab/evidence/mxb-studio-1.0.1/licence.txt`). The repository has no licence file.
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Its Software License Terms forbid reverse engineering and decompiling, so only public facts are covered (rule 6): the
    release files' SHA-256 and types, the installer's code signature (checked with `osslsigncode`), whether the update
    packages carry a package signature, the update feed on its site, the release page, the GitHub repository, and the tool's
    licence, privacy, terms, plans and help pages; every command is in `lab/evidence/mxb-studio-1.0.1/run.sh`. Nothing was
    run, installed, unpacked or disassembled, here or on the throwaway Windows machine (its plan ran nothing, for the same
    reason), so no answer comes from a run, and none from Windows on a real GPU. VirusTotal: a hash lookup of the installer,
    made before the analysis (26 Nov 2026); nothing was uploaded, as the licence forbids analysis.
