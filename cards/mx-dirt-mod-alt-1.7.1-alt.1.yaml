  G2:
    verdict: 'Yes'
    mark: concern
    text: >-
      On the one Steam build it accepts, by default, at each track load in Testing: the core plugin rewrites two instruction
      sequences in the game's terrain code (offsets 0x1f61e6 and 0x1f1f65, put back when the track closes), hooks the game's
