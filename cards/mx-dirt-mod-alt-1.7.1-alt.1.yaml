tool: MX Dirt Mod Alt
version: 1.7.1-alt.1
summary: >-
  Two MX Bikes plugins that simulate the soil under your tyres, wear ruts and bumps into the track while you ride and shade the
  worn ground, by patching and hooking fixed places in one Steam build of the game. Its source is public under GPL-3.0 and the
  release rebuilds from it; on any other game build both plugins switch themselves off, as they did in every run here.
header:
  What it is: >-
    A fork of kadenball's MX Dirt Mod: a core plugin (`mx_dirt.dlo`) that simulates the soil and writes the worn ground into the
    game's terrain, and a render plugin (`mx_dirt_render.dlo`) that shades it, both for `plugins`, with an in-game menu on F8.
    The zip also holds PowerShell scripts that install and remove it and a settings window (launcher).
  In one line: Plugins that wear ruts into the track by patching one MX Bikes build
  Category: Gameplay and visuals
  Author: Fran Milesi (GitHub [FMilesi-Cloud](https://github.com/FMilesi-Cloud)); based on MX Dirt Mod by kadenball
  Game: MX Bikes
  mxb-mods.com: None found (searched 19 Nov 2026)
  Homepage: None found
  GitHub: '[FMilesi-Cloud/mx-dirt-mod-alt](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt)'
  Version analysed: >-
    [v1.7.1-alt.1](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/releases/tag/v1.7.1-alt.1), the GitHub release of 19 Nov
    2026 (the newest in `registry/releases.json`): `MX-Dirt-Mod-Alt-1.7.1-alt.1.zip` and its `.sha256.txt`.
  Source commit: >-
    [c5ed04c72bdbab7b00fd594ce7525e7a1914f797](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/tree/c5ed04c72bdbab7b00fd594ce7525e7a1914f797)
    (tag v1.7.1-alt.1, "Docs (ES/EN): README, NOTICE, development log, diagrams", 19 Nov 2026).
  Analysed on: 23 Nov 2026
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Open source under GPL-3.0, so nothing forbids analysis: the source and scripts were read at the commit, the two plugins
    were rebuilt with Zig 0.13.0 and compared byte by byte with the release (they match apart from the link time stamp and build
    ID), every other file in the zip was compared with the repository, and the plugins' imports, text and code-signing entry were
    read (`objdump -p`, `strings`). Every command is in `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/run.sh`. A throwaway Windows Server 2025 machine with no GPU (Mesa
    llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran both plugins in the MX Bikes demo (beta21e), offline
    behind a firewall block, under Process Monitor: the bare demo as baseline, a 120 s ride, and a ride pressing F8 and the
    menu keys; then the plugin test host with the bystander plugin, with and without a crash and hotkeys. The demo is not the
    one Steam build the plugins accept, so in every run both switched themselves off at Startup and none of their game changes
    ran (see Limits). The install, uninstall and launcher scripts were read, not run. VirusTotal: hash lookups only (made
    before the analysis, 23 Nov 2026), nothing uploaded.
