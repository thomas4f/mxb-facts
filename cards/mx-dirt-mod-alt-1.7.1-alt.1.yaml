      [mxdirt_render_host.c lines 1-12](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/render/mxdirt_render_host.c#L1-L12),
      [lines 116-131](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/render/mxdirt_render_host.c#L116-L131),
