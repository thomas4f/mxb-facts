files_note: >-
  Neither plugin is code-signed (`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/signature.txt`). Every file in the zip other than the plugins is the repository's file at
  the commit, three of them with other line endings (`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/zip-vs-source.txt`). The hashes match the zip the Windows machine ran
  (`lab/results/mx-dirt-mod-alt-1.7.1-alt.1/ride-windows/machine.txt`, `lab/results/mx-dirt-mod-alt-1.7.1-alt.1/ride-windows/plugins.sha256`).
key:
  K1: No malware found. No engine flagged the three files VirusTotal knows; the zip, both plugins and most scripts aren't on VirusTotal.
  K2: No. It has no updater.
  K3: 'Only on request; its installer moves other plugins'' files to a backup folder, and a menu row writes two settings in Graphics Overhaul''s file.'
  K4: No. It makes no connection and sends nothing.
  K5: 'Yes; on the one Steam build it accepts, it patches and hooks the game''s code and writes into its terrain. Online only if you turn on its experimental online wear.'
  K6: 'Reads, doesn''t copy; it reads bike and tyre files and the game''s loaded tyres and terrain. A debug setting, off by default, saves a track''s terrain to a file.'
  K7: Yes, GPL-3.0; the whole release is built from the public source.
  K8: 'Yes, as far as checked; its docs say openly that it patches the game, and its claims match the code and the runs.'
  K9: 'Yes; the plugins aren''t signed, but rebuilding them from the source gives the same files apart from the link time stamp.'
  K10: No. Neither plugin nor any script connects to the internet.
areas:
  Your PC and files: Writes its own files in `plugins`; its installer moves other dirt plugins out, and the game's saved track wear keeps its ruts after removal.
  Your data: Makes no connection; it reads bike and tyre files and, if present, Graphics Overhaul's settings and rain value.
  Your game: Patches and hooks one Steam build's code and writes the worn ground into its terrain; offline only unless you turn on online wear.
  Creators' content: Reads unpacked bikes' tyre files and the game's loaded tyre and terrain data; a debug option saves a track's terrain.
  Transparency: GPL-3.0 with the full source public, and the plugins rebuild to the release apart from the link time stamp; no CI build.
  Money: Free; no shop and no donation request.
sections:
  - title: Your PC and files
    blocks:
      - text: >-
          Also found: the installer clears Windows' "downloaded from the internet" mark from every file of the unpacked release before
          it copies them, and puts a desktop shortcut that starts the launcher with PowerShell's execution policy set to Bypass
          ([Install.ps1 line 21](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L21), [Install.ps1 lines 45-50](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L45-L50)).
        mark: note
      - text: >-
          Also found: the worn track is held in the game's own terrain, which the game saves as its track wear (`testing.dfm` in your
          profile); the launcher's "Reset" moves that file to a backup folder, and the uninstaller leaves it
          ([MXDirtLauncher.ps1 line 126](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/launcher/MXDirtLauncher.ps1#L126), [MXDirtLauncher.ps1 lines 215-221](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/launcher/MXDirtLauncher.ps1#L215-L221),
          [Uninstall.ps1 lines 1-4](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Uninstall.ps1#L1-L4)). Not seen here: the plugins never ran on the demo.
        mark: note
  - title: Your data
    blocks: []
  - title: Your game
    blocks:
      - text: >-
          Also found: both plugins hash `mxbikes.exe` at start and switch themselves off unless it is the one Steam build named in
          `SUPPORTED_EXE.txt`; in all four Windows runs the demo didn't match, and both returned -1 from Startup
          ([mx_dirt.c line 1024](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mx_dirt.c#L1024), [mxdirt_render_host.c lines 352-365](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/render/mxdirt_render_host.c#L352-L365);
          `lab/results/mx-dirt-mod-alt-1.7.1-alt.1/plugins-windows/host.log`, `lab/results/mx-dirt-mod-alt-1.7.1-alt.1/ride-windows/mx_dirt_render.log`).
        mark: good
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks: []
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: '"The mod patches and reads fixed places in this exact mxbikes.exe. With any other version it stays inactive and the game runs normally" (SUPPORTED_EXE.txt)'
            Verdict: Matches
            Evidence: >-
              Both plugins check the SHA-256 and return -1 from Startup otherwise ([mx_dirt.c line 1024](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mx_dirt.c#L1024));
              on the demo both stayed off and the rides ran like the baseline (`lab/results/mx-dirt-mod-alt-1.7.1-alt.1/ride-windows/mx_dirt_render.log`, `lab/results/mx-dirt-mod-alt-1.7.1-alt.1/plugins-windows/host.log`).
          - Claim: '"Each tyre''s width read from the game''s memory (encrypted OEM bikes)" and "Official telemetry ... Official API data, no reverse engineering" (README)'
            Verdict: Matches
            Evidence: >-
              Telemetry comes from the plugin function RunTelemetry; the tyre width is read at fixed offsets of the game's wheel
              definition ([mxdirt_bike.inc lines 1-6](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mxdirt_bike.inc#L1-L6), [lines 121-133](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mxdirt_bike.inc#L121-L133)).
          - Claim: '"Everything it replaces is backed up to Documents\PiBoSo\MX Bikes\mx_dirt_mod_backups" (README, installing)'
            Verdict: Matches
            Evidence: '[Install.ps1 lines 29-43](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L29-L43); existing `.ini` files are kept, not replaced.'
          - Claim: '"In-game menu (F8): Replaces the PowerShell launcher" (README)'
            Verdict: Partly
            Evidence: >-
              The F8 menu has the settings, but the installer still installs the launcher and puts its desktop shortcut
              ([Install.ps1 lines 44-50](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L44-L50)). The menu draws only with a font the release doesn't ship
              ([mxdirt_menu.inc lines 352-366](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mxdirt_menu.inc#L352-L366)).
          - Claim: '"Online is still experimental"; `online_wear=0`: "offline Testing only (default)" (README, mx_dirt.ini)'
            Verdict: Matches
            Evidence: '[mx_dirt.c lines 1064-1067](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mx_dirt.c#L1064-L1067), [mx_dirt.ini lines 118-124](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mx_dirt.ini#L118-L124).'
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX
              Bikes demo, offline.
            questions: []
          - text: >-
              Both plugins accept only one Steam build of `mxbikes.exe`; the demo isn't it, so in every run they switched off at
              Startup and none of their patches, hooks, terrain writes, menu or files ran. What they do on that build rests on the
              source, which the release was rebuilt from. Running it would need the Steam game.
            questions: [P4, P7, P8, D6, G2, G4, G5, G6, G7, C2, C5]
          - text: >-
              The install, uninstall and launcher scripts (PowerShell) weren't run; what they do rests on reading them. The plan
              didn't press Enter on any menu row, set `launcher_key`, or turn on `online_wear` or `dump_terrain`.
            questions: [P4, P6, P8, G6, G10]
          - text: >-
              The game's own save of the worn track (`testing.dfm`) rests on the tool's own scripts and docs; the game wasn't seen
              saving it.
            questions: [P7, P8]
answers:
  P1:
    verdict: 'No'
    mark: note
    text: >-
      No engine flagged a file VirusTotal knows: `Install.cmd` 0 of 61, `Uninstall.cmd` 0 of 61, `LICENSE` 0 of 61. The zip,
      the `.sha256.txt`, both plugins and the other files in the zip are not on VirusTotal (hash lookup on 23 Nov 2026); nothing
      uploaded.
    evidence: '[MX-Dirt-Mod-Alt-1.7.1-alt.1.zip](https://www.virustotal.com/gui/file/519a65ac9c33457c916e59282411b1fcf14cb34ce08b4e78f03030193a64bea4), [MX-Dirt-Mod-Alt-1.7.1-alt.1.sha256.txt](https://www.virustotal.com/gui/file/18f90dbe6d1c95fbe23bd602089f8735e4c2c8a91afc9bbe952c15090af9f3e0), [mx_dirt.dlo](https://www.virustotal.com/gui/file/1cc95aab56cea10344adcf705464b5fcc3e3c81644e6f4d5a6f3f289e0004ce9), [mx_dirt_render.dlo](https://www.virustotal.com/gui/file/d83821b2e449f9580db8bc978eef735cfce7de412c7ad09c3a45cdb43dd07859), [Install.cmd](https://www.virustotal.com/gui/file/da31aa93ff73c5fdf20e0185dd8114972debee25fa8e5a659671f438b162c39f), [Uninstall.cmd](https://www.virustotal.com/gui/file/af75cec63f2b6a8a0aa392a36e32363170f8da136d5ae6d8ae033fedbf29afe5), [LICENSE](https://www.virustotal.com/gui/file/230184f60bae2feaf244f10a8bac053c8ff33a183bcc365b4d8b876d2b7f4809)'
  P2:
    verdict: 'No'
    mark: good
    text: It has no updater; nothing in the plugins or scripts goes online.
    evidence: '`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/src-network.txt`, `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/imports-absent.txt`, `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/strings-urls.txt`.'
  P3:
    verdict: Doesn't apply
    text: There is no updater.
    evidence: '`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/src-network.txt`, `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/imports-absent.txt`.'
  P4:
    verdict: Yes, on request
    mark: note
    text: >-
      Only after an action you start: the installer moves six other plugin files, among them `living_dirt.dlo` (the separate Living
      Dirt plugin) and earlier test builds, to a backup folder, and replaces `mx_dirt.dlo` and `mx_dirt_render.dlo` (also the
      original MX Dirt Mod's names) after copying them there; the F8 menu's Overhaul row writes `ruts=0` and `physical=0` into
      Graphics Overhaul's `overhaul.ini`; the launcher's "Reset" moves the game's `testing.dfm` to a backup. By default the
      plugins write only their own files.
    evidence: >-
      [Install.ps1 lines 29-43](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L29-L43), [mxdirt_menu.inc lines 208-211](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mxdirt_menu.inc#L208-L211),
      [MXDirtLauncher.ps1 lines 215-221](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/launcher/MXDirtLauncher.ps1#L215-L221); `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/src-files.txt`, `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/scripts.txt`.
  P5:
    verdict: 'No'
    mark: note
    text: Neither plugin is code-signed; they can be traced to the public source by a rebuild (T4).
    evidence: Empty Security Directory (`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/signature.txt`); `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/rebuild.txt`.
  P6:
    verdict: 'No'
    mark: good
    text: >-
      The plugins import no registry function. The installer and launcher only read Steam's folder from the registry; the
      installer adds a desktop shortcut and clears the download mark on the release's own files.
    evidence: '`lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/imports-absent.txt`, `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/scripts.txt`.'
  P7:
    verdict: Partly
    mark: note
    text: >-
      The plugins write only their own files in `plugins` (`mx_dirt.jsonl`, `mx_dirt_render.log`, and the folders
      `mx_dirt_laps`, `mx_dirt_soft`, `mx_dirt_presets`, `mx_dirt_tracks`); but the worn ground they write into the game's terrain
      is what the game saves as its own track wear (`testing.dfm`), per the tool's scripts.
    evidence: >-
      `lab/evidence/mx-dirt-mod-alt-1.7.1-alt.1/src-files.txt`; [MXDirtLauncher.ps1 line 126](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/launcher/MXDirtLauncher.ps1#L126), [Uninstall.ps1 lines 1-4](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Uninstall.ps1#L1-L4).
  P8:
    verdict: 'Yes'
    mark: concern
    text: >-
      `Uninstall.cmd` moves the plugins, settings and data folders to a backup folder, but leaves your recorded laps
      (`plugins\mx_dirt_laps`), the backup folders in `Documents\PiBoSo\MX Bikes\mx_dirt_mod_backups`, and the game's saved
      track wear with the mod's ruts; plugins the installer moved out (such as `living_dirt.dlo`) aren't put back.
    evidence: '[Uninstall.ps1 lines 1-4](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Uninstall.ps1#L1-L4), [lines 24-27](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Uninstall.ps1#L24-L27); [Install.ps1 line 35](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/install/Install.ps1#L35).'
  P9:
    verdict: 'No'
    mark: good
    text: >-
      No malware found. The code that patches the game is in the public source, described in its docs, and the release is that
      source rebuilt; the plugins have no network code and start no program by default.
