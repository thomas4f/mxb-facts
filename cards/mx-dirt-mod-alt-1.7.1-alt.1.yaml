      [mx_dirt.ini lines 118-124](https://github.com/FMilesi-Cloud/mx-dirt-mod-alt/blob/c5ed04c72bdbab7b00fd594ce7525e7a1914f797/src/core/mx_dirt.ini#L118-L124).
