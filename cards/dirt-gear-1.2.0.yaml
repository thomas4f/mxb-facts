      the page, the fonts), README, CHANGELOG, VERSION, `LICENSE.txt` and `THIRD-PARTY-NOTICES.txt`. Every program file
      in it, with its SHA-256 and type, is in `lab/evidence/dirt-gear-1.2.0/bundled.txt`.
  - name: Dirt Gear.exe
    sha256: c5da4586c536b28c2219de2c60720b5f0efe58fe66bf9ead9710bd7d7061ae34
