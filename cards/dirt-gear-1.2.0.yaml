tool: Dirt Gear
version: 1.2.0
summary: >-
  A Windows editor that turns a creator's rider-gear PSD template into a paint (`.pnt`) for MX Bikes, with your colours,
  logos, name and number. Its public source matches the release, under an "All rights reserved" licence; it checks GitHub
  for a new version when its window opens and installs one only when you click, after checking its signature.
header:
  What it is: >-
    A Windows app (Python, packed with PyInstaller) that opens a gear PSD, lets you add logos, a name and a number under
    the template's shading, and packs a `.pnt` paint, which it can put into the game's rider paints folder. Its window is
    a page from its own server on `127.0.0.1`, drawn by Microsoft's WebView2. It comes as one setup file that installs it
    for your Windows account, with an uninstaller; it is not a plugin.
  In one line: Windows editor that makes MX Bikes rider-gear paints from creators' PSD templates
  Category: Content creation
  Author: Dirt Graphic Studios (GitHub organisation)
  Game: MX Bikes
  mxb-mods.com: '[DIRT GEAR](https://mxb-mods.com/dirt-gear-2/), published 13 Nov 2026, updated 17 Nov 2026'
  Homepage: None found
  GitHub: '[Dirt-Graphic-Studios/Dirt-Gear](https://github.com/Dirt-Graphic-Studios/Dirt-Gear)'
  Version analysed: >-
    1.2.0: the GitHub release [v1.2.0](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/releases/tag/v1.2.0) (24 Nov
    2026), `Dirt-Gear-Setup-1.2.0.exe`, with `update.json` and `update.json.sig`, the signed feed its updater reads. It was
    the tool's latest GitHub release when this analysis started (24 Nov 2026).
  Source commit: >-
    [0433b042c553d0cdac6558b747807248964e41e8](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/tree/0433b042c553d0cdac6558b747807248964e41e8)
    ("Uninstall: retry removing the program folder and log what happened; rebuild v1.2.0", 24 Nov 2026), the commit tag
    `v1.2.0` points to.
  Analysed on: 24 Nov 2026
  Earlier reports: '[1.1.1](https://thomas4f.github.io/mxb-facts/dirt-gear/1.1.1/) (24 Nov 2026)'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The licence (`LICENSE.txt`, "All rights reserved") lets anyone read the source and build it to check it matches a
    release, and forbids copying the code; it doesn't forbid the analysis, so the evidence quotes only the lines its
    searches look for. The source was read at the commit. The setup's and the program's PyInstaller archives were
    unpacked with `tools/carchive.py`, without running them, and the tool's seven Python files, compiled with Python 3.12,
    were compared with the code packed in the release (`lab/evidence/pycmp.py`); the data files, the bootloader's code and
    pywebview's DLLs were compared with the source and with the published PyInstaller and pywebview packages. The whole
    release was not rebuilt (T4). Every command is in `lab/evidence/dirt-gear-1.2.0/run.sh`. A throwaway Windows Server
    2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no game, no Steam and no keys ran
    the setup three ways under Process Monitor, with the run folder's programs blocked by the firewall: with no options for
    30 s (its Yes/No box, not clicked), with `--quiet` (install), and with `--update` (install, then start Dirt Gear), and
    clicked nothing; the uninstaller wasn't run. VirusTotal: hash lookups made before the analysis (24 Nov 2026); that run
    uploaded the three release files, which VirusTotal had no record of.
