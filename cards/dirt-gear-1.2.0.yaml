files_note: >-
  Neither the setup nor the program is code-signed (`lab/evidence/dirt-gear-1.2.0/signature.txt`). The release files'
  hashes match the ones the Windows machine ran (`lab/results/dirt-gear-1.2.0/setup-quiet-windows/machine.txt`), and
  `update.json.sig` verifies with the public key in the source (`lab/evidence/dirt-gear-1.2.0/update-manifest.txt`).
key:
  K1: 'No; no malware found. 1 of 65 engines flagged the setup on VirusTotal.'
  K2: >-
    No. It installs a new version only when you click Download and install, and only after the signature and the file's
    SHA-256 check out.
  K3: >-
    Only when you confirm. Pack & install replaces a paint of the same name in the game's paints folder after asking;
    otherwise it writes only its own files and the paints you pack.
  K4: 'No. The only thing it sends off your PC is the update check to GitHub.'
  K5: 'No. It doesn''t run in or touch the game; it writes paint files the game loads.'
  K6: >-
    On request. Save for later keeps a copy of the creator's PSD in your library on your PC; Portable project leaves it
    out. It unlocks and shares nothing.
  K7: 'Yes. The full source is public, and the release''s code matches it; its licence isn''t open source.'
  K8: >-
    Not quite. Its README says its local server answers only requests with its token; it also serves its page's own
    files without one.
  K9: >-
    Yes. Not code-signed, but GitHub Actions built the release from the public commit, and its Python code matches the
    source.
  K10: 'Yes. When its window opens it asks GitHub for the latest release; a switch turns that off.'
areas:
  Your PC and files: >-
    Installs for your account with two shortcuts and an Installed apps entry, and uninstalls; updates only when you click,
    after a signature and hash check; not code-signed, and 1 of 65 engines flagged the setup.
  Your data: >-
    An update check to GitHub when its window opens, with a switch; its local server's functions answer only its own
    window.
  Your game: A separate program that writes the paints you pack into the game's paints folder; it doesn't touch the game.
  Creators' content: >-
    Opens the gear PSDs you pick and keeps a copy in projects you save for later, not in portable ones; credits the code
    and fonts it ships.
  Transparency: >-
    Full source public and built by GitHub Actions from the commit; the release's Python code matches it; its licence is
    "All rights reserved"; one README line doesn't match the code.
  Money: Free; the code for a paid Premium plan is in it but switched off; no donation links.
sections:
  - title: Your PC and files
    blocks: []
  - title: Your data
    blocks:
      - table: [What, Where to, When, Switch]
        rows:
          - What: >-
              A request for the latest release (`/repos/Dirt-Graphic-Studios/Dirt-Gear/releases/latest`), with the
              User-Agent `Dirt-Gear-Updater`; when a newer version is out, also its `update.json` and `update.json.sig`
            Where to: '`api.github.com` and GitHub''s release downloads, HTTPS'
            When: 4 s after its window opens, and each time you click Check for updates
            Switch: Check for updates when Dirt Gear starts (About box, opened by the version button)
          - What: The new setup file
            Where to: GitHub's release downloads, HTTPS
            When: Only when you click Download and install
            Switch: Don't click it
          - What: Your browser opens the release page
            Where to: '`github.com`'
            When: Only when you click Open download page (a release without a signature)
            Switch: Don't click it
          - What: Its window's requests to its own server
            Where to: '`127.0.0.1`, a random port, with a random token made at each start'
            When: While it is open
            Switch: None needed; nothing leaves your PC
      - text: >-
          Also found: the release carries code for a paid Premium plan that would send a licence key you enter and your
          PC's name to Lemon Squeezy (`api.lemonsqueezy.com`), re-check it once a day and keep the buyer's email. It is
          switched off: the release's `premium_config.json` has `"enabled": false` and no store, so a licence key is
          refused before any request
          ([premium.py lines 183-227](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/premium.py#L183-L227);
          `lab/evidence/dirt-gear-1.2.0/src-premium.txt`, `lab/evidence/dirt-gear-1.2.0/same-as-source.txt`).
        mark: note
  - title: Your game
    blocks: []
  - title: Creators' content
    blocks:
      - text: >-
          Also found: of the 47 fonts it ships in `_internal\fonts` for names and numbers, one (Racing Sans One) comes with
          its licence; the 46 BYD and MxFont files name no maker or licence, and its `FONTS.md` lists them as community
          fonts "included with the permission Dirt Graphic Studios holds for them", which the analysis can't check. The
          fonts that named a maker's copyright in 1.1.1 are gone
          (`lab/evidence/dirt-gear-1.2.0/fonts.txt`, `lab/evidence/dirt-gear-1.2.0/same-as-source.txt`).
        mark: note
  - title: Transparency
    blocks: []
  - title: Money
    blocks:
      - text: >-
          Also found: the Premium code in the release would limit free use to 5 gear sets a day and sell unlimited use for
          "$5 USD / month", or unlock it with a friend code. In this release it is switched off: the limit never applies,
          the Premium button stays hidden and there is no checkout address
          ([premium.py lines 337-359](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/premium.py#L337-L359);
          `lab/evidence/dirt-gear-1.2.0/src-premium.txt`).
        mark: note
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "The window is a page served by Dirt Gear itself on `127.0.0.1` (a random port), and it answers only
              requests that carry a random token made at each start."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L30))
            Verdict: Doesn't match
            Evidence: >-
              Its functions (`/api/`) need the token, but the page (`/`) and its files (`/static/`) are answered without
              it, to any request that names `127.0.0.1` or `localhost`
              ([app.py lines 81-92](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L81-L92),
              [app.py lines 624-626](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L624-L626);
              `lab/evidence/dirt-gear-1.2.0/src-server.txt`).
          - Claim: >-
              "Registry: one key, `HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\DirtGear`, for the Installed
              apps entry. Uninstalling deletes it."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L29))
            Verdict: Matches
            Evidence: >-
              It is the only key its code writes, and the uninstaller deletes it; the runs show the setup writing it
              (`lab/evidence/dirt-gear-1.2.0/src-absent.txt`, `lab/evidence/dirt-gear-1.2.0/src-uninstall.txt`;
              `lab/results/dirt-gear-1.2.0/setup-quiet-windows/registry.txt`).
          - Claim: >-
              "Network: only the update check above (`api.github.com`, then GitHub's release downloads when you click
              Download and install). No account, no analytics, no ads."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L27))
            Verdict: Matches
            Evidence: >-
              The only other internet code, Premium's licence check, is switched off and refuses a key before any request
              (`lab/evidence/dirt-gear-1.2.0/src-network.txt`, `lab/evidence/dirt-gear-1.2.0/src-premium.txt`).
          - Claim: >-
              "To turn the check off, click the version label (top left) and untick Check for updates when Dirt Gear
              starts: opening that box doesn't contact GitHub, only Check for updates does."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L23))
            Verdict: Matches
            Evidence: >-
              [app.js lines 399-407](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/static/app.js#L399-L407),
              [app.py lines 671-678](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L671-L678);
              `lab/evidence/dirt-gear-1.2.0/src-update-ui.txt`.
          - Claim: >-
              "An update installs only if its `update.json` carries a valid Ed25519 signature from the key built into the
              app and the download matches the size and SHA-256 it lists."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L23))
            Verdict: Matches
            Evidence: >-
              [updater.py lines 82-166](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/updater.py#L82-L166),
              [app.py lines 759-770](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L759-L770);
              the release's feed verifies with that key (`lab/evidence/dirt-gear-1.2.0/update-manifest.txt`).
          - Claim: >-
              "Portable project saves a `.dirtgear` file you can move to another PC. It holds your design and artwork but
              never the creator's PSD"
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L42))
            Verdict: Matches
            Evidence: >-
              [app.py lines 1405-1419](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L1405-L1419),
              [app.py lines 1546-1551](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L1546-L1551).
          - Claim: >-
              "Paints you packed into MX Bikes are never removed."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L13))
            Verdict: Matches
            Evidence: >-
              The uninstaller removes only its shortcuts, its Installed apps entry, its program folder and, if you choose,
              its own data folder
              ([uninstall.py lines 95-116](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/uninstall.py#L95-L116);
              `lab/evidence/dirt-gear-1.2.0/src-uninstall.txt`).
          - Claim: >-
              "Each release is built by GitHub Actions from the public source, and its SHA-256 is in the release's signed
              `update.json`."
              ([README.md](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/README.md#L9))
            Verdict: Matches
            Evidence: >-
              [release.yml lines 1-60](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/.github/workflows/release.yml#L1-L60);
              the release was published by `github-actions` from the commit (`lab/evidence/dirt-gear-1.2.0/release-page.txt`,
              `lab/evidence/dirt-gear-1.2.0/update-manifest.txt`).
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with no GPU and software OpenGL (Mesa llvmpipe), not Windows on a real
              GPU, without the game or Steam, and nothing was clicked: no PSD was opened, and Pack & install, the exports,
              saving and opening projects, pasting, the in-app update and the uninstaller weren't run. What they do rests
              on the source, which the release's code matches.
            questions: [P4, P7, P8, D6, C2, C5]
          - text: >-
              The run that installed and started Dirt Gear recorded only its first 5 s (3:44:12 to 3:44:17 PM on the
              machine), while WebView2 was starting, so its window, the update check (made 4 s after the window's page
              loads) and any connection of Microsoft's WebView2 runtime weren't seen. The update check rests on the source.
            questions: [D1, D8]
          - text: >-
              Process Monitor records the registry values that were written, not the ones they replaced, so whether the
              values Windows' `ie4uinit.exe` wrote during the install differed from what was there before wasn't seen.
            questions: [P6]
          - text: >-
              The release wasn't rebuilt (it needs Windows): the comparison covers the tool's own Python code and data
              files, the bootloader's code and pywebview's DLLs; the other packed packages' compiled files weren't tied to
              their builds.
            questions: [T4]
          - text: >-
              `payload.zip` and `Dirt Gear.exe` weren't among the VirusTotal lookups (the lookups took what 7-Zip unpacks,
              and it doesn't unpack PyInstaller archives).
            questions: [P1]
answers:
  P1:
    verdict: Partly
    mark: note
    text: >-
      1 of 65 engines flagged `Dirt-Gear-Setup-1.2.0.exe` on 24 Nov 2026 (Bkav). 0 of 60 flagged `update.json` and
      `update.json.sig` on 24 Nov 2026. The analysis run uploaded all three on 24 Nov 2026, because VirusTotal had no record
      of them. `payload.zip` and `Dirt Gear.exe` inside the setup weren't looked up (Limits).
    evidence: >-
      [Dirt-Gear-Setup-1.2.0.exe](https://www.virustotal.com/gui/file/beb61dc284d92e3ecf9b8027f310aba9fa99d1d4c7d909e5d37325e1e44ddfe4),
      [update.json](https://www.virustotal.com/gui/file/2dfd76e04fe3ebfc44695f4c549b71cce5c7951e338c77c58d0c2bb498609330),
      [update.json.sig](https://www.virustotal.com/gui/file/754f1956d12005f417d55213bfa474c284c0188eafd6ca46828c7f9cdfc20ab2),
      [payload.zip](https://www.virustotal.com/gui/file/06e005379ac3a7e2eed38bb99cd3cecd631b72170177283c204fd5581931847a),
      [Dirt Gear.exe](https://www.virustotal.com/gui/file/c5da4586c536b28c2219de2c60720b5f0efe58fe66bf9ead9710bd7d7061ae34)
  P2:
    verdict: 'No'
    mark: good
    text: >-
      A newer version shows a bar with Download and install (Open download page for a release without a signature) and
      Skip this version; nothing is downloaded or installed until you click. It then warns that unsaved changes will be lost,
      downloads the setup, closes, and the setup replaces the program folder and starts Dirt Gear again.
    evidence: >-
      [app.js lines 386-392](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/static/app.js#L386-L392),
      [app.py lines 759-770](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L759-L770),
      [installer.py lines 224-238](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/build/installer.py#L224-L238).
  P3:
    verdict: 'Yes'
    mark: good
    text: >-
      Before it offers to install, it checks the release's `update.json` against its Ed25519 signature (`update.json.sig`)
      with the public key built into the program, and that the feed names this version, a setup in the release and its
      SHA-256; the download must then match that size and SHA-256 or it is deleted. The signing key isn't in the release,
      so a changed file on GitHub alone fails the check. The v1.2.0 feed verifies with the key at the commit.
    evidence: >-
      [updater.py lines 82-166](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/updater.py#L82-L166);
      `lab/evidence/dirt-gear-1.2.0/update-manifest.txt`, `lab/evidence/dirt-gear-1.2.0/same-as-source.txt`.
  P4:
    verdict: Yes, on request
    mark: note
    text: >-
      Pack & install replaces a paint of the same name in the rider model's paints folder only after you confirm
      "… already exists for … Replace it?", and Export and Save write the file you pick in Windows' save box. The setup's
      `--target <folder>` option (in its README, not in its window) replaces the folder you name, with whatever is in it.
      Everything else it writes, replaces or deletes is its own: its program folder (the setup replaces it on an update),
      its `Dirt Gear.lnk` shortcuts, its folder in `%LOCALAPPDATA%\Dirt Gear` (it empties `updates\` at each start, and
      Uninstall deletes the folder only if you say Yes) and its temporary folder. Moto Gear's library is copied, not moved.
    evidence: >-
      [app.py lines 1493-1519](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/app.py#L1493-L1519),
      [installer.py lines 127-185](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/build/installer.py#L127-L185),
      [uninstall.py lines 95-116](https://github.com/Dirt-Graphic-Studios/Dirt-Gear/blob/0433b042c553d0cdac6558b747807248964e41e8/source/uninstall.py#L95-L116);
      `lab/evidence/dirt-gear-1.2.0/src-files.txt`, `lab/evidence/dirt-gear-1.2.0/src-game.txt`.
  P5:
    verdict: 'No'
    mark: note
    text: >-
      Neither the setup nor the program is code-signed; GitHub Actions built them from the public commit (T3), and their
      Python code matches the source (T4).
    evidence: Empty Security Directory for each (`lab/evidence/dirt-gear-1.2.0/signature.txt`).
  P6:
    verdict: 'No'
    mark: good
    text: >-
      The only registry key its code writes is its own Installed apps entry, `HKCU\…\CurrentVersion\Uninstall\DirtGear`,
      which the runs show and Uninstall deletes. To refresh shortcut icons, the setup calls Windows' `SHChangeNotify`, which
      counts up Explorer's `GlobalAssocChangedCounter`, and starts Windows' `ie4uinit.exe -show`; in the runs that Windows
      tool wrote its own Internet Explorer and Active Setup values, and the other writes were Windows' own (the app-use
      record `bam`, the Internet zone values every program using Windows' web stack writes).
    evidence: >-
      `lab/evidence/dirt-gear-1.2.0/src-absent.txt`, `lab/evidence/dirt-gear-1.2.0/src-uninstall.txt`;
      `lab/results/dirt-gear-1.2.0/setup-quiet-windows/registry.txt`,
      `lab/results/dirt-gear-1.2.0/setup-update-windows/registry.txt`,
