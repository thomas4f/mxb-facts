files_note: >-
  No program file carries a Windows code signature (`lab/evidence/holeshot-0.24.2/signature.txt`); the zip has a minisign
  signature that checks out with the key in the program (`lab/evidence/holeshot-0.24.2/minisign.txt`). The scripts, README,
  `LICENSE` and `OFL.txt` in the zip are the repository's files at the commit apart from line endings, and `THIRD-PARTY.txt`
  is written by the build (`lab/evidence/holeshot-0.24.2/same-as-source.txt`); the program carries the plugin byte for byte
  (`lab/evidence/holeshot-0.24.2/embedded-dlo.txt`). Setup holds the same files, by its script
  ([holeshot.iss lines 46-55](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/holeshot.iss#L46-L55)); it wasn't unpacked (`lab/evidence/holeshot-0.24.2/setup.txt`).
  The hashes match the files the Windows machine ran (`lab/results/holeshot-0.24.2/ride-windows/machine.txt`,
  `lab/results/holeshot-0.24.2/ride-windows/plugins.sha256`).
key:
  K1: No malware found. 2 of 69 engines flagged Setup; no engine flagged any other file.
  K2: 'No by default; with "Update automatically on launch" on it installs without asking, after checking a signature.'
  K3: 'Only on your choice; its optional menus rewrite game files, with a backup, and uninstalling clears a Windows compatibility flag.'
  K4: 'Only on request; feedback sends your report and last race log, and two profile pages carry your Steam ID.'
  K5: 'No by default; it reads the game through the plugin interface, and two options change what you see in the game.'
  K6: No. It doesn't unlock, copy or share other people's content.
  K7: Yes. The full source is public, under the MIT licence.
  K8: Yes, as far as checked; uninstalling clears the compatibility flag in more cases than the README says.
  K9: Yes. The release is built from the tag by GitHub Actions, and the zip is signed with minisign.
  K10: 'Yes. By default it asks GitHub for the newest release at every start; "Check for updates" turns that off.'
areas:
  Your PC and files: >-
    The updater checks a signature as well as GitHub's hash and installs without asking only if you turn that on; optional
    menus rewrite game files with a backup; no Windows code signature, but the release is built by CI.
  Your data: >-
    Asks GitHub for updates at every start unless you turn it off; feedback and profile pages send your report or Steam ID only
    when you use them, and the plugin shares riders' names in memory any program of yours can read.
  Your game: >-
    A plugin that only uses the plugin interface and catches the game's crashes, plus a separate HUD window that reads F8 and
    the mouse; two options hide the game's pitboard or restyle its menus.
  Creators' content: Doesn't touch other people's content; it credits the fonts, the icons and the Rust libraries built in.
  Transparency: >-
    Full source public under the MIT licence; the release is built from the tag by GitHub Actions, not rebuilt here.
  Money: Free; no shop and no donation request.
sections:
  - title: Your PC and files
    blocks: []
  - title: Your data
    blocks:
      - table: [What, Where to, When, Switch]
        rows:
          - What: A request for the newest release, with the user agent `mxbo-overlay`; then the zip and its signature, to update
            Where to: '`api.github.com`, then `github.com`'
            When: Every program start; the download with auto-update on, or when you click install
            Switch: '"Check for updates" (on) for the check; "Update automatically on launch" (off) for the download'
          - What: Your feedback, version, first version, OS, and for a bug report the last race log; later, your ticket IDs to fetch replies
            Where to: '`holeshot-hud.vercel.app` (the author''s feedback service)'
            When: When you press Send in Feedback; replies while settings are open, after you have sent one
            Switch: Only sent when you press Send
          - What: The pages, in a window inside settings; the MXB-Ranked and CBR addresses carry your Steam ID
            Where to: '`mymxb.com`, `mxb-ranked.com`, `cbrservers.com`'
            When: When you open those Profile tabs
            Switch: Only when you open them
          - What: An ICMP ping every 2 s
            Where to: The game server you are on, or `1.1.1.1`
            When: While the Systems widget shows its meters
            Switch: The Systems widget (off)
          - What: The stream HUD as images, and its layout
            Where to: '`127.0.0.1`, ports 8765 to 8775 (a server on your PC)'
            When: While "Browser Source" is on
            Switch: '"Browser Source" (off)'
  - title: Your game
    blocks: []
  - title: Creators' content
    blocks:
      - text: >-
          Also found: the MyMXB tab shows mymxb.com inside the program and adds a script to that site that hides and removes its
          Google ad slots
          ([mymxb.rs lines 72-185](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/settings/mymxb.rs#L72-L185),
          [mymxb.rs line 414](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/settings/mymxb.rs#L414);
          `lab/evidence/holeshot-0.24.2/src-mymxb.txt`).
        mark: note
  - title: Transparency
    blocks:
      - text: >-
          Also found: the repository holds a presence service (`overlay/src/presence.rs`, `presence/`) that would post your race
          number and name to a Cloudflare worker, but the program doesn't build it: `main.rs` declares no such module and the
          program holds no `workers.dev` address
          ([main.rs lines 3-27](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/main.rs#L3-L27);
          `lab/evidence/holeshot-0.24.2/presence-absent.txt`).
        mark: note
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "Setup finds Steam MX Bikes (registry + Steam library folders) and copies `Holeshot-HUD.dlo` into the game `plugins`
              folder." (README)
            Verdict: Matches
            Evidence: >-
              [install-plugin.ps1 lines 9-35](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/install-plugin.ps1#L9-L35),
              [install-plugin.ps1 lines 78-86](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/install-plugin.ps1#L78-L86),
              [holeshot.iss lines 165-194](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/holeshot.iss#L165-L194). Setup wasn't clicked through in the run.
          - Claim: '"The overlay copies the plugin again on launch if it is missing or outdated." (README)'
            Verdict: Matches
            Evidence: >-
              It writes the plugin it carries when the game's copy is missing or differs
              ([plugin.rs lines 157-185](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/plugin.rs#L157-L185),
              [main.rs line 313](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/main.rs#L313)).
          - Claim: >-
              "Uninstall deletes that file, AppData leftovers, temp logs, the fullscreen-optimizations flag on `mxbikes.exe` if
              an older version set it, and any menu or pitboard overrides. Pit boards saved under
              `Documents\PiBoSo\MX Bikes\Holeshot-HUD` stay." (README)
            Verdict: Partly
            Evidence: >-
              Every uninstall path runs `Uninstall.ps1`, which has the program restore the menu files and the pitboard override
              and deletes the settings, logs, temp logs and Run values
              ([uninstall.ps1 lines 89-167](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/uninstall.ps1#L89-L167),
              [uninstall.rs lines 30-38](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/uninstall.rs#L30-L38),
              [holeshot.iss lines 65-80](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/installer/holeshot.iss#L65-L80)). It takes the flag out of every `mxbikes.exe`
              compatibility entry whoever set it, not only one an older version set (P6). Not run.
          - Claim: >-
              "Settings → Updates → Check for updates. It is on until you turn it off. Off, Holeshot HUD does not contact
              GitHub at startup." (CHANGELOG)
            Verdict: Matches
            Evidence: >-
              [main.rs lines 286-298](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/main.rs#L286-L298),
              [config.rs line 2805](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/hud/src/config.rs#L2805);
              `lab/evidence/holeshot-0.24.2/src-update.txt`.
          - Claim: >-
              "An update zip must match the signature from the key in the app, and the GitHub SHA-256, before it is
              installed." (CHANGELOG)
            Verdict: Matches
            Evidence: >-
              [update.rs lines 382-401](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/update.rs#L382-L401);
              `lab/evidence/holeshot-0.24.2/minisign.txt`.
          - Claim: '"Browser Source answers `127.0.0.1` and `localhost`. Another site''s Origin gets 403." (CHANGELOG)'
            Verdict: Matches
            Evidence: >-
              [stream/mod.rs lines 1601-1606](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/stream/mod.rs#L1601-L1606),
              [stream/mod.rs lines 1757-1793](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/stream/mod.rs#L1757-L1793). Not run.
          - Claim: '"This build does not set the fullscreen-optimizations flag." (CHANGELOG)'
            Verdict: Matches
            Evidence: >-
              No code sets it, and neither ride wrote to `AppCompatFlags` (`lab/evidence/holeshot-0.24.2/src-registry.txt`,
              `lab/evidence/holeshot-0.24.2/runs.txt`).
          - Claim: >-
              "In-app feedback (F8 → Feedback) posts to `/api/feedback` and stores **private gists**, not GitHub issues." (README)
            Verdict: Not checked
            Evidence: >-
              The program posts to `https://holeshot-hud.vercel.app/api/feedback`, and the service's source in the repository makes
              private gists ([feedback.rs line 16](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/overlay/src/feedback.rs#L16),
              [feedback.js line 84](https://github.com/LeadingTrendTechnologies/HoleshotHUD/blob/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7/api/feedback.js#L84)); what runs on that server can't be seen from here.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX
              Bikes demo, offline.
            questions: []
          - text: >-
              The program never ran beside the game: the real-game rides ran only the plugin, and the program ran on its own.
              What the plugin shares while the program reads it, and what the program does when it finds the game (copying the
              plugin, the pitboard override, the menu files), rest on the source.
            questions: [P7, D10, G3, G5, G7]
          - text: >-
              No key was pressed and no setting was changed in the program: the settings window, Feedback, the Profile tabs, the
              Systems widget, "Browser Source", "MX Bikes menus", the Pit Board widget, "Check for updates" and "Update
              automatically on launch" rest on the source, read at the commit, which the release is built from by CI but wasn't
              rebuilt here. The updater's signature check wasn't run; the signature was checked here with the same key.
            questions: [P2, P3, P4, D2, D3, D4, D5, D6, D8, G9]
          - text: >-
              Setup ran 60 s without being clicked through, so it installed nothing, and the zip's install and uninstall scripts
              weren't run; what they do rests on reading them (the zip's are the repository's files) and on Setup's script.
              Setup itself couldn't be unpacked here (innoextract 1.9 doesn't read Inno Setup 6.7.0).
            questions: [P6, P8]
          - text: >-
              In the test host, the case meant to make the game crash logged no crash and no key presses, so the crash handler
              wasn't seen at work; it rests on the source and the plugin's imports.
            questions: [G8]
          - text: >-
              Not rebuilt: the plugin is a Visual Studio 2022 project and the program is built with Microsoft's toolchain on
              Windows, which this setup doesn't have; the Rust toolchain isn't pinned either (T6). The website demo's
              WebAssembly file in the repository wasn't rebuilt from its source either.
            questions: [T1, T4]
          - text: >-
              The Rust libraries (331 packages in `overlay/Cargo.lock`, from crates.io) weren't read; they are named and pinned
              by checksum in the lock file.
            questions: [P9]
answers:
  P1:
    verdict: Partly
    mark: note
    text: >-
      2 of 69 engines flagged `HoleshotHUD-Setup.exe` (APEX, Skyhigh); 0 flagged the zip (of 67), its signature (60),
      `Holeshot-HUD.exe` (70), `Holeshot-HUD.dlo` (70), `Install.bat` (61), `Install.ps1` (60), `Install-Plugin.ps1` (61),
      `Uninstall.bat` (60), `Uninstall.ps1` (62), `README.txt` (60), `LICENSE` (60), `OFL.txt` (60) and `THIRD-PARTY.txt` (61),
      on the hash lookup of 24 Nov 2026. Every file was already on VirusTotal; nothing was uploaded.
    evidence: >-
      [HoleshotHUD-Setup.exe](https://www.virustotal.com/gui/file/3fd5b0fdfcaae246c9eea5b2ebbcb1595b7715e977dd12acec021dbcd42ea086),
      [Holeshot-HUD-0.24.2-windows-x64.zip](https://www.virustotal.com/gui/file/aeaadd66c9f2c0fe10ee09cabf5737b65cfda0182623b058d6c8ee5f9ee956cd),
      [Holeshot-HUD-0.24.2-windows-x64.zip.minisig](https://www.virustotal.com/gui/file/1ba7238bd00d49de8993a703f892a0bb2ff9dadbe293b33ddaac0bc39d6e2541),
      [Holeshot-HUD.exe](https://www.virustotal.com/gui/file/8e969f1506654bd62ba7f15352fbffa0da600af516d2aa301529a7dd6a7532f6),
      [Holeshot-HUD.dlo](https://www.virustotal.com/gui/file/a15c80625c415f8b8e5f89c7e7e32aeec15c4f2df408f2e445ceaa331fa70bce),
      [Install.bat](https://www.virustotal.com/gui/file/4640ea10b04ff0ccfa138b36f41bf39020235ce813a71e92971b93b821258b1a),
      [Install.ps1](https://www.virustotal.com/gui/file/2bcd5adf57843c6fb3f35122f0ccadb9f0ca7a614e2d16c8fe50afbc71e7a1a0),
      [Install-Plugin.ps1](https://www.virustotal.com/gui/file/24b9f5d087c8cf64ab5eee830a26693b4ebc9e4be2b591f8eb70c46c37d50de6),
      [Uninstall.bat](https://www.virustotal.com/gui/file/2d0e85e92f493825293373b2a79023e7a94149bc5d00df79b58e1f3e206adfe7),
      [Uninstall.ps1](https://www.virustotal.com/gui/file/967caf8601c802abaffc5bdf5c20466fa800d98c49b98d843ae10b94ca04dcf6),
      [README.txt](https://www.virustotal.com/gui/file/a19ebe4d928c564ca80f58dc506784b0acbe3271a83f67de443fdef952bbb336),
      [LICENSE](https://www.virustotal.com/gui/file/a18be22c4fc32edeff0acdc90ca51398c31a12a3ef52f1a6691c1983011423ec),
      [OFL.txt](https://www.virustotal.com/gui/file/d49343b4cadd0d55f2846f1cc46b7a1eb4df691516e5fff0f348fcc7e753af8d),
      [THIRD-PARTY.txt](https://www.virustotal.com/gui/file/33a99f01c2ba63efb8d96bea4ea5d37df8808ff165f1a9ecb4444c21665f691e)
  P2:
    verdict: Yes, not by default
    mark: concern
    text: >-
      With "Update automatically on launch" on (off by default), each program start downloads the newest GitHub release's zip
      and, if it is newer and passes the checks (P3), replaces the program and the plugin beside it without asking, then
      restarts; the program then copies the new plugin into the game. By default it only checks GitHub at start and shows that
      an update is there; installing takes a click. Turning "Check for updates" off also turns automatic updates off.
