tool: HoleShot HUD
version: 0.24.2
summary: >-
  A transparent HUD window (standings, relative, map, radar, lap times and more) that draws on top of MX Bikes from data its
  game plugin shares, with an installer that puts the plugin in the game. Its source is on GitHub under the MIT licence, the
  release is built from the tag by GitHub Actions, and its updater checks a signature before it installs.
header:
  What it is: >-
    Two parts: `Holeshot-HUD.dlo`, a plugin in the game's `plugins` folder that reads the game through the plugin interface and
    shares it in memory, and `Holeshot-HUD.exe`, a separate program that draws the HUD widgets in a transparent window over the
    game, with F8 settings, feedback, an updater and an optional local page for streaming. Setup (or the zip's `Install.bat`)
    installs the program to `%LOCALAPPDATA%\Holeshot HUD` and copies the plugin into the game.
  In one line: A HUD window drawn over MX Bikes from data its game plugin shares
  Category: HUD
  Author: LeadingTrendTechnologies (GitHub organisation [LeadingTrendTechnologies](https://github.com/LeadingTrendTechnologies))
  Game: MX Bikes
  mxb-mods.com: '[Holeshot HUD](https://mxb-mods.com/holeshot-hud/)'
  Homepage: None found
  GitHub: '[LeadingTrendTechnologies/HoleshotHUD](https://github.com/LeadingTrendTechnologies/HoleshotHUD)'
  Version analysed: >-
    [v0.24.2](https://github.com/LeadingTrendTechnologies/HoleshotHUD/releases/tag/v0.24.2) (tag `v0.24.2`, published 24 Nov
    2026), the tool's latest GitHub release when this run started; the mxb-mods.com page lists no file of its own.
  Source commit: >-
    [5f4905e94f2423cc67c79a4bf7b684c31dd13cf7](https://github.com/LeadingTrendTechnologies/HoleshotHUD/tree/5f4905e94f2423cc67c79a4bf7b684c31dd13cf7)
    ("Ship 0.24.2 so the startup update check can be turned off and the release carries its licences.", 24 Nov 2026), the
    commit tag `v0.24.2` points to.
  Analysed on: 24 Nov 2026
  Earlier reports: '[0.24.0](https://thomas4f.github.io/mxb-facts/holeshot/0.24.0/) (23 Nov 2026)'
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The licence is MIT, which allows the analysis. The source was read at the commit, with the changes since v0.24.0; the
    zip's scripts, README and licences were compared with it (the same apart from line endings), the plugin was found byte for
    byte inside the program, the zip's minisign signature was checked with the key in the program, and the imports,
    code-signing entries and text of both program files were read with `objdump` and `strings`. The release wasn't rebuilt
    (T4). Setup (Inno Setup 6.7.0) couldn't be unpacked here (innoextract 1.9 doesn't read that version). Every command is in
    `lab/evidence/holeshot-0.24.2/run.sh`. A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software
    OpenGL, not Windows on a real GPU) and no keys ran the plugin in the MX Bikes demo (beta21e), offline behind a firewall
    block, under Process Monitor: the bare demo as baseline, a 90 s ride, and a 90 s ride with F8, F8, F9 and Ctrl pressed;
    all three reached the track. Then the plugin test host with the bystander plugin, the program for 60 s and for 240 s on
    its own (no game), and Setup for 60 s without clicking through it. No key was pressed in the program. VirusTotal: hash
    lookups made before the analysis (24 Nov 2026); every file was already on VirusTotal, so nothing was uploaded.
