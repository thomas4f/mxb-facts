    mark: concern
    text: >-
      The setup's main screen says "Nothing outside MX Bikes\plugins is touched", but the setup writes its log to your Temp folder as soon
      as it starts (P8). The README's "Off on servers by default" holds for the ragdoll, not for its patches (G3); see "What it says vs
      what it does".
    evidence: '`lab/evidence/mxb-ragdoll-1.0/strings-setup.txt`; `lab/results/mxb-ragdoll-1.0/setup-windows/outside.txt`.'
  T3:
    verdict: 'No'
    mark: concern
    text: There is no public repository or build workflow; the zip is a MediaFire download.
    evidence: '`lab/evidence/mxb-ragdoll-1.0/file.txt`; its [mxb-mods.com page](https://mxb-mods.com/mx-bikes-ragdoll-v1-0-2/) links only the download.'
