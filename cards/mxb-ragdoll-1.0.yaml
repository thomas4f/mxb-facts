tool: MXB Ragdoll
version: '1.0'
summary: >-
  An MX Bikes plugin that replaces your rider's crash with a physics ragdoll and lets you get up and walk back to the bike, by
  patching the game's code and writing into its physics. It makes no internet connection; by default it takes over the game's
  respawn key after a crash, offline, and keeps its patches in place on servers, where the ragdoll itself is off unless you turn it on.
header:
  What it is: >-
    A closed-source plugin (`mxb_ragdoll.dlo`, with its settings `mxb_ragdoll.ini` and 13 crash sounds in `mxb_ragdoll_sfx`) for the
    game's `plugins` folder, in a zip with a setup program (`MXB-Ragdoll-Setup.exe`, which carries the same files) and PowerShell install
    scripts. In the game it throws your rider off the bike as a physics ragdoll when you crash, lets you get up, walk and climb back on,
    and has a menu on F8.
  In one line: Plugin that turns crashes into a physics ragdoll by patching the game's code
  Category: Gameplay and visuals
  Author: BoredDev / mxbikesmods (the name in its README)
  Game: MX Bikes
  mxb-mods.com: '[MX Bikes Ragdoll v1.0](https://mxb-mods.com/mx-bikes-ragdoll-v1-0-2/), published 29 Oct 2026'
  Homepage: None found
  GitHub: None found
  Version analysed: >-
    MX Bikes Ragdoll v1.0: `MXB-Ragdoll-v1.0.zip`, the download on its mxb-mods.com page, through
    [MediaFire](https://www.mediafire.com/file/k34umlk5ta5n39g/MXB-Ragdoll-v1.0.zip/file); the newest release in the inventory
    (`registry/releases.json`, from that page, dated 29 Oct 2026). There are no tags or commits: the source isn't public.
  Analysed on: 25 Nov 2026
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and the release carries no licence or clause against analysis, so the release files were examined without running
    them here: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`), the plugin's own function
    names (it ships with them) and chosen call sites (`objdump -d`), and the setup's payload listed file by file against the zip
    (`lab/evidence/mxbp.py`); every command is in `lab/evidence/mxb-ragdoll-1.0/run.sh`. The release was not rebuilt (no public source).
    A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran the
    plugin in the MX Bikes demo (beta21e), offline behind a firewall block, under Process Monitor: the bare demo as baseline, a 120 s
    ride pressing B, X, W, Shift+W, A and D, and a 90 s ride opening the F8 menu; then the plugin test host (a crash case, a
    helmet-camera case and a hotkey case, with the bystander plugin's checks) and the setup started alone for 60 s with no clicks. The
    real game online, the Steam build it is made for, and the install scripts were not run. VirusTotal: hash lookups made before the
    analysis (25 Nov 2026), nothing uploaded (no licence was found, so the run uploads nothing).
