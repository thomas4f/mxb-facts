tool: Knee Down
version: 0.1.8
summary: >-
  A GP Bikes launcher that lists your installed bikes, tracks, riders and paints, keeps presets, and starts a practice
  session through Steam. At each start it writes its own files into the game's mods folder, and it checks GitHub for a
  newer version every hour, with a random install ID; updates install after you click "New Update".
header:
  What it is: >-
    A closed-source Windows app built with Electron (a web page in its own window) that finds GP Bikes through Steam,
    lists the mods in `Documents\PiBoSo\GP Bikes\mods`, draws a 3D preview of each bike paint, and saves presets of bike,
    paint, rider, track, layout and weather. Its launch button writes `practice.ini` into the game folder and starts the
    game through Steam in a practice session. It is installed with an NSIS installer; it is not a plugin.
  In one line: GP Bikes launcher that lists your mods, keeps presets and starts practice sessions
  Category: Mod managers
  Author: gsv-r (GitHub name)
  Game: GP Bikes
  gpb-mods.com: '[Knee Down](https://gpb-mods.com/knee-down-launcher/), published 9 Oct 2026, updated 19 Oct 2026'
  Homepage: None found
  GitHub: '[gsv-r/knee-down](https://github.com/gsv-r/knee-down)'
  Version analysed: >-
    0.1.8: the GitHub release [v0.1.8](https://github.com/gsv-r/knee-down/releases/tag/v0.1.8) (4 Nov 2026), its installer
    `KneeDown-preset.exe`, the tool's latest GitHub release when the analysis started. Its gpb-mods.com page links to the
    GitHub releases and lists no files of its own. The release's `latest.yml` and `.blockmap` are files for the updater,
    not for players.
  Source commit: >-
    [27abfcc757fcbc726678b50ea8c6240fa6863203](https://github.com/gsv-r/knee-down/tree/27abfcc757fcbc726678b50ea8c6240fa6863203)
    ("update readme", 4 Nov 2026), the commit tag `v0.1.8` points to. At that commit the repository holds only
    `README.md`: the source isn't public.
  Analysed on: 26 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    No licence was found (none in the repository, the installer or the app's `package.json`), so nothing forbids the
    analysis; closed source, so the release files were examined. The installer was unpacked with 7-Zip and the app's own
    code (`app.asar`) with `lab/evidence/asar.py`; it is JavaScript as built, read directly (the main process and preload
    unminified, the minified window code through searches), with the updater library it ships (electron-updater 6.8.9). Every
    program file was listed with its type, hash and code-signing entry. Every command is in
    `lab/evidence/knee-down-0.1.8/run.sh`. The release was not rebuilt (no public source). A throwaway Windows Server 2025
    machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no game, no Steam and no keys ran the
    installer silently under Process Monitor, with the run folder's programs blocked by the firewall; it installed, but the
    app itself didn't start in that run (Limits). No game plugin, so no run in the game. VirusTotal: hash lookups made
    before the analysis (26 Nov 2026), 40 files of the release; nothing uploaded, as no licence allows it.
