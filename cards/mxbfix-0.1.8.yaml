      game build 0x6A21833D with every original byte matching.'
    evidence: '`lab/evidence/mxbfix-0.1.8/src-patches.txt`; [fixes.c lines 48-138](https://github.com/xAmped/mxbfix/blob/90740b49b5486f64e2b48abccc86dd61d1ace200/src/fixes.c#L48-L138);
