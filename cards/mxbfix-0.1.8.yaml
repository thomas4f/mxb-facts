  G3:
    verdict: 'Yes'
    mark: concern
    text: 'The patches stay on when you ride on a server, and two of them change physics code: a NaN position takes the "off the map" path in the terrain
      lookups, and a fence contact with a NaN depth is dropped. Each swaps the two operands of one comparison and its jump (`ja` to `jb`), so a NaN
      now takes the exit an off-map position or a skipped contact already takes; for every other value, the patched bytes give the same result as the
      game''s. Not run on a server here (see Limits).'
    evidence: '[fix_ground_nan_guard.c lines 1-35](https://github.com/xAmped/mxbfix/blob/90740b49b5486f64e2b48abccc86dd61d1ace200/src/fixes/fix_ground_nan_guard.c#L1-L35),
