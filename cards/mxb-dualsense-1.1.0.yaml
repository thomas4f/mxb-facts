tool: MXB DualSense Support
version: 1.1.0
summary: >-
  A Windows app that reads the ride data MX Bikes' own proxy_udp plugin sends and turns it into PS5 DualSense
  adaptive-trigger effects through the separate program DSX, all over 127.0.0.1. On request it edits the game's
  `proxy_udp.ini` (after a backup) and installs an optional in-game HUD plugin.
header:
  What it is: >-
    A closed-source Windows program, `MXB-DualSense-Support.exe`, a Python app packed with PyInstaller, that you run beside
    the game. It listens for the game's proxy_udp data on your PC and sends trigger commands to DualSenseX (DSX), which you
    install separately; its window is drawn by Microsoft's WebView2. An optional HUD plugin, packed inside the program, is
    copied into the game's `plugins` folder only when you click Install.
  In one line: App that turns MX Bikes ride data into DualSense adaptive-trigger effects via DSX
  Category: Controllers
  Author: Slimerex (the name on its licence)
  Game: MX Bikes
  mxb-mods.com: >-
    [MXB DualSense Support – PS5 adaptive triggers](https://mxb-mods.com/mxb-dualsense-support-ps5-adaptive-triggers-2/),
    published 15 Nov 2026, updated 20 Nov 2026
  Homepage: None found
  GitHub: None found
  Version analysed: >-
    1.1.0: `1795198224-mxb-dualsense-support-1.1.0.zip`, the download on its mxb-mods.com page (20 Nov 2026); the newest
    release in the inventory (`registry/releases.json`, from that page). There are no tags or commits: the source isn't
    public.
  Analysed on: 24 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    MIT licence, so the analysis is allowed; closed source, so the release was examined without running it here: the
    program was unpacked with `tools/carchive.py` (PyInstaller), every packed program file listed with its type, hash and
    code-signing entry, and the tool's own Python code (the start script and the 18 modules of its `mxbds` package, Python
    3.15 bytecode) read in full with Python 3.15's `dis` (not decompiled to source). The packed HUD plugin
    (`mxbds_hud64.dlo`) was read with `objdump` (imports, exports, the code around its socket); every command is in
    `lab/evidence/mxb-dualsense-1.1.0/run.sh`. The release was not rebuilt (no public source). A throwaway Windows Server
    2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no game, no Steam, no DSX, no
    controller and no keys started the control center for 120 s and the `--console` version for 60 s, under Process Monitor,
    with the run folder's programs blocked by the firewall, and clicked nothing. The HUD plugin wasn't run, in the game or
    the test host: it isn't in the zip, and is installed only from the app. VirusTotal: hash lookups only, made before the
    analysis (24 Nov 2026), nothing uploaded.
