tool: MX Bikes Setup Duper
version: 0.1.8674.29660
summary: >-
  A small Windows app that copies one of your saved MX Bikes setups to another track, or to every track you have,
  inside your own profile. Its public source rebuilds to the same program; it asks GitHub for a newer version when it
  opens and installs nothing itself.
header:
  What it is: >-
    A Windows desktop app (C#, WPF, .NET 6, one framework-dependent `.exe`) that lists your MX Bikes profiles and their
    saved setups (`.stp`) and copies the setup you pick to one track's folder, or to every track's folder, in that
    profile. You start it yourself; it is not a plugin and needs neither the game running nor an installer.
  In one line: Windows app that copies a saved MX Bikes setup to one track or to all your tracks
  Category: Setup and coaching
  Author: dmkrtz (GitHub); the app's Info tab says "insane"
  Game: MX Bikes
  mxb-mods.com: '[MX Bikes Setup Duper](https://mxb-mods.com/mx-bikes-setup-duper/), published 1 Oct 2023'
  Homepage: None found
  GitHub: '[dmkrtz/MXBikesSetupDuperWPF](https://github.com/dmkrtz/MXBikesSetupDuperWPF)'
  Version analysed: >-
    0.1.8674.29660: the GitHub release
    [0.1.8674.29660](https://github.com/dmkrtz/MXBikesSetupDuperWPF/releases/tag/0.1.8674.29660) ("Release candidate 2",
    1 Oct 2023), `MX_Bikes_Setup_Duper.exe`. It is the newest release in the inventory (`registry/releases.json`, GitHub,
    seen 24 Nov 2026).
  Source commit: >-
    [2e030e0873b043e5eab485ce9902761f999b9edf](https://github.com/dmkrtz/MXBikesSetupDuperWPF/tree/2e030e0873b043e5eab485ce9902761f999b9edf)
    ("minor changes, added github link", 1 Oct 2023), the commit tag `0.1.8674.29660` points to.
  Analysed on: 24 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    No licence was found, so nothing forbids the analysis. The source was read at the commit. The program's .NET bundle
    was unpacked without running it (`lab/evidence/netbundle.py`); its libraries were compared with the NuGet packages and
    its host code with .NET 6.0.16's `apphost.exe`, and the source was rebuilt with the .NET SDK 7.0.302 (on Linux, for
    Windows) and compared byte for byte (T4). Every command is in `lab/evidence/setup-duper-0.1.8674.29660/run.sh`. A
    throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no game,
    no Steam and no keys started the program for 90 s under Process Monitor, with the run folder's programs blocked by the
    firewall; it had no .NET 6 runtime, so only .NET's host ran and the app's window never opened. VirusTotal: hash
    lookups made before the analysis (24 Nov 2026); nothing uploaded.
