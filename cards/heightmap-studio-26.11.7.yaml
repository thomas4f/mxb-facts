tool: Heightmap Studio
version: 26.11.7
summary: >-
  A closed-source terrain and track editor for MX Bikes and other games, free for personal use and sold as a yearly
  Commercial license for paid work. Its Terms of Use forbid reverse engineering it, so this card covers public facts only.
header:
  What it is: >-
    A desktop app for building tracks and terrain, released for Windows (`Heightmap-Studio-setup.exe`, a Nullsoft installer)
    and Linux. It is not a game plugin; its pages say it installs game plugins from inside the app. Its Terms of Use forbid
    reverse engineering, so nothing in the release was run or looked inside.
  In one line: Closed-source track and terrain editor app; its terms forbid looking inside it
  Category: Content creation
  Author: Braden Mackey (bradenmackey on GitHub; the name on its Terms of Use)
  Game: MX Bikes
  mxb-mods.com: '[Heightmap Studio](https://mxb-mods.com/heightmap-studio-build-your-own-tracks/)'
  Homepage: '[heightmapstudio.com](https://heightmapstudio.com)'
  GitHub: '[bradenmackey/hms-public](https://github.com/bradenmackey/hms-public) (releases only)'
  Version analysed: >-
    [v26.11.7](https://github.com/bradenmackey/hms-public/releases/tag/v26.11.7), published 19 Nov 2026: the tool's latest
    GitHub release when this run started, and the newest in the inventory (`registry/releases.json`).
  Source commit: >-
    No source is public. The tag v26.11.7 points to
    [dcafa91992d4e556abc9fcf1c7d28af32e69bec8](https://github.com/bradenmackey/hms-public/tree/dcafa91992d4e556abc9fcf1c7d28af32e69bec8),
    which holds only `README.md` (`lab/evidence/heightmap-studio-26.11.7/repo.txt`).
  Analysed on: 24 Nov 2026
  Licence clause: >-
    "You may not, and may not help anyone else to: [...] reverse engineer, decompile, disassemble, decrypt or otherwise try to
    get the source code of the app or of locked plugins (.hmp), except where the law gives you that right regardless of this
    agreement" ([Terms of Use](https://heightmapstudio.com/terms), section 4, effective 21 Oct 2026, covering "the Heightmap
    Studio desktop app, its installer and updates"; `lab/evidence/heightmap-studio-26.11.7/terms.txt`). The repository has no licence file.
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Its Terms of Use forbid reverse engineering, so only public facts are covered (rule 6): the release files' SHA-256, the
    code-signature entries of the release files, the update feed `latest.json`, the release page, the GitHub repository, and
    the tool's Terms of Use, Privacy Policy, pricing and third-party notices pages; every command is in
    `lab/evidence/heightmap-studio-26.11.7/run.sh`. Nothing was run, installed, unpacked or disassembled, here or on the
    throwaway Windows machine (its plan ran nothing, for the same reason), so no answer comes from a run, and none from Windows
    on a real GPU. VirusTotal: hash lookups of the Windows installer and its `.sig`, made before the analysis (24 Nov
    2026); nothing was uploaded, as the licence forbids analysis.
