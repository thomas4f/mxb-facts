key:
  K1: 'None flag it. 0 of 70 engines flag the Windows installer; looking inside it for malware is not allowed by its licence.'
  K2: 'Not allowed. Its licence forbids looking at how it updates; its README says "the app updates itself".'
  K3: 'Not allowed. Its licence forbids looking at what it writes or deletes.'
  K4: 'Not allowed. Its licence forbids looking at what it sends.'
  K5: 'Not allowed. Its licence forbids looking at what it does to the game.'
  K6: 'Not allowed. Its licence forbids looking at how it treats other people''s content.'
  K7: 'No. The repository holds only a README and the release files.'
  K8: 'Not allowed. Its licence forbids comparing its docs with its code.'
  K9: 'No. Not code-signed, and there is no public source to trace it to.'
  K10: 'Not allowed. Its licence forbids looking at its connections.'
areas:
  Your PC and files: >-
    A Windows installer, not code-signed, with signed entries in an update feed; what it installs, changes and updates is not
    allowed to be looked at.
  Your data: Not allowed to be looked at; its Privacy Policy describes update checks, a license server and map and texture services.
  Your game: Not allowed to be looked at; a desktop app, not a game plugin, that its pages say installs game plugins.
  Creators' content: Not allowed to be looked at; it publishes a third-party notices file.
  Transparency: Closed source under proprietary Terms of Use; the public repository holds only a README.
  Money: Free for personal use; a Commercial license for paid work costs $19.99 per user per year.
