  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: '"Once installed, the app updates itself." (README)'
            Verdict: Not allowed
            Evidence: >-
              The update feed `latest.json` names the installer and a signature for it (`lab/evidence/heightmap-studio-26.11.7/feed.txt`); what the app does
              with it can't be looked at (licence, section 4). `lab/evidence/heightmap-studio-26.11.7/readme.txt`.
          - Claim: >-
              "We do not track you. The app has no analytics, telemetry, advertising or crash reporting" (Privacy Policy)
            Verdict: Not allowed
            Evidence: Its connections can't be looked at (licence, section 4). `lab/evidence/heightmap-studio-26.11.7/privacy.txt`.
          - Claim: >-
              "The app checks heightmapstudio.com for a newer version [...] These requests contain no personal information"
              (Privacy Policy)
            Verdict: Not allowed
            Evidence: What its requests carry can't be looked at (licence, section 4). `lab/evidence/heightmap-studio-26.11.7/privacy.txt`.
          - Claim: >-
              "When you verify or refresh a license, or open Manage, the app sends the email you entered to our license server"
              (Privacy Policy)
            Verdict: Not allowed
            Evidence: What it sends can't be looked at (licence, section 4). `lab/evidence/heightmap-studio-26.11.7/privacy.txt`.
          - Claim: >-
              "Heightmap Studio includes open-source software under its own licenses. Those licenses are listed in the app
              (Preferences > Legal > Third-Party Notices) and on our website." (Terms of Use)
            Verdict: Not allowed
            Evidence: >-
              The website's notices file is published (`lab/evidence/heightmap-studio-26.11.7/notices.txt`); what the release ships can't be looked at to
              compare (licence, section 4). `lab/evidence/heightmap-studio-26.11.7/terms.txt`.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              Its Terms of Use forbid reverse engineering, decompiling and disassembling the app (Licence clause), so nothing in
              the release was run, installed, unpacked or disassembled, and every answer that would need it is "Not allowed".
            questions: []
          - text: >-
              Only the Windows installer and its `.sig` were looked up on VirusTotal, before the analysis; the AppImage, its
              `.sig`, the `.deb`, the `.rpm` and `latest.json` weren't. Nothing was uploaded.
            questions: [P1]
          - text: >-
              Whether it asks for donations was read on its release page, README and website only; the app's own screens
              weren't seen.
            questions: [M3]
          - text: >-
              The public pages (Terms of Use, Privacy Policy, pricing, third-party notices) are quoted as they read on 24 Nov
              2026; they aren't pinned to the release and can change.
            questions: [M1, M2]
