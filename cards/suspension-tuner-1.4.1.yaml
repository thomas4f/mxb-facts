files_note: >-
  None of the installer, the launcher or the app is code-signed (`lab/evidence/suspension-tuner-1.4.1/signature.txt`). The
  zip's and the installer's hashes match the ones the Windows machine ran
  (`lab/results/suspension-tuner-1.4.1/app-direct-windows/machine.txt`), and the launcher's and app's the ones it started
  (`lab/results/suspension-tuner-1.4.1/app-direct-windows/plugins.sha256`).
key:
  K1: 'No malware found; some engines flag it: 9 of 66 flag the launcher and 4 of 71 the installer; the zip isn''t on VirusTotal.'
  K2: 'No. It checks GitHub for a newer version and only tells you; it installs nothing.'
  K3: >-
    Yes. With its default settings, starting an analysis rewrites the game's `proxy_udp.ini` to switch the plugin on and
    point it at the tool; it keeps a copy only of the first version it changed, so a later edit by you or another tool is lost.
  K4: 'No. The only thing it sends off your PC is the update check to GitHub.'
  K5: 'No. It changes nothing in the game''s code or memory; it reads the data the game''s own proxy_udp plugin sends.'
  K6: 'No. It opens no one''s content.'
  K7: 'No. Only the compiled program is published, with no licence.'
  K8: 'Yes, as far as checked.'
  K9: 'No. Not code-signed, and there is no public source to trace it to.'
  K10: 'Yes. Each start it asks GitHub for the tool''s release list.'
areas:
  Your PC and files: >-
    No updater; with default settings it switches on the game's proxy_udp plugin by rewriting `proxy_udp.ini` (keeping
    only a first copy) and writes its setups into the game's setups folder; not code-signed, and 9 of 66 engines flag the launcher.
  Your data: >-
    Asks GitHub for its release list at each start, with no switch; the game's data comes in over UDP and stays on your PC.
  Your game: >-
    A separate program that reads the game's own proxy_udp output; it changes that plugin's settings file, and nothing
    in the game's code or memory.
  Creators' content: Opens no mods, paints, tracks or models; ships only Tk's licence terms for the code it packs.
  Transparency: Closed source with no licence; the GitHub repository holds only a README and the release files.
  Money: Free; a "Support on Gumroad" button links to an optional support page.
sections:
  - title: Your PC and files
    blocks:
      - text: >-
          Also found: its settings (`settings.json`) and session data (`raw_session.json`, `tuning_history.json`,
          `travel_by_bike.json` and others) are kept in `%APPDATA%\SuspensionTuner`; the app made that folder when it started
          in the run (`lab/evidence/suspension-tuner-1.4.1/defaults.txt`, `lab/evidence/suspension-tuner-1.4.1/file-writes.txt`,
          `lab/results/suspension-tuner-1.4.1/launcher-windows/outside.txt`).
        mark: note
  - title: Your data
    blocks:
      - table: [What, Where to, When, Switch]
        rows:
          - What: >-
              A request for the tool's release list (`/repos/Lilian1134/Suspension-Tuner/releases?per_page=20`), with the
              User-Agent `SuspensionTuner/1.4.1`
            Where to: '`api.github.com` (GitHub), HTTPS'
            When: >-
              At each start ("Checked automatically at startup"), and on Check now in Settings; seen about 4 s after the start
              in the app run
            Switch: None
          - What: Nothing sent; it listens for the game's proxy_udp data (speed, controls, suspension travel and more)
            Where to: 'UDP port 30001 (the UDP port setting), on every network interface (`0.0.0.0`)'
            When: From Start listening until you finish or stop
            Switch: Stop, or close it
          - What: Your browser opens the Discord invite, the Gumroad page or the release page
            Where to: '`discord.gg`, `gumroad.com`, `github.com`'
            When: Only when you click Join the Discord, Support on Gumroad or the update notice's Download
            Switch: Don't click them
      - text: >-
          Also found: it listens on every network interface (`0.0.0.0`), not only on your own PC (`127.0.0.1`), so while it
          listens, another device on your network could send it data that ends up in the analysis; the game's plugin sends to
          `127.0.0.1` (`lab/evidence/suspension-tuner-1.4.1/udp.txt`, `lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`).
        mark: note
  - title: Your game
    blocks: []
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks:
      - text: >-
          Also found: the repository's history shows a `SuspensionTuner.exe` uploaded on 14 Oct 2026 and deleted on 16 Oct
          2026 ([bc338e4](https://github.com/Lilian1134/Suspension-Tuner/commit/bc338e4a6076b8b5af82ecab9940be77a03f8874),
          [252738a](https://github.com/Lilian1134/Suspension-Tuner/commit/252738ad3961e6463bbba887d51b93b70189b769)); no
          source file was ever added.
        mark: note
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "It's free, no account, no key, no paid features, just open it and use it." (its mxb-mods.com page)
            Verdict: Matches
            Evidence: >-
              Its code has no account, licence key or payment step; the only money link is the optional "Support on
              Gumroad" button, and its window says "No account, no license key, nothing to unlock."
              (`lab/evidence/suspension-tuner-1.4.1/strings-money.txt`, `lab/evidence/suspension-tuner-1.4.1/absent.txt`).
          - Claim: >-
              "On first launch the tool enables the game's UDP plugin (proxy_udp.ini). If it has just done so, restart MX
              Bikes once." (its Settings, Configure MX Bikes automatically)
            Verdict: Partly
            Evidence: >-
              The switch is on by default and its code holds the rewrite of `proxy_udp.ini`
              (`lab/evidence/suspension-tuner-1.4.1/defaults.txt`,
              `lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`). It isn't done at the first start: in the 90 s app run it
              didn't look for the game or `proxy_udp.ini`
              (`lab/results/suspension-tuner-1.4.1/app-direct-windows/raw/procmon.csv.gz`); it comes with Start listening, at
              every analysis where the file doesn't already have `enable = 1` and the tool's address (`lab/results/suspension-tuner-1.4.1/backup-wine/log.txt`).
          - Claim: >-
              "Put the newly generated .stp file into your bike's setup folder and load it in the garage."
              ([README.md](https://github.com/Lilian1134/Suspension-Tuner/blob/895a62d8dfdaba844a85878c4eae0cd2295fa3dc/README.md#L10))
            Verdict: Partly
            Evidence: >-
              The app writes `ST_<track>_<bike>.stp` into the setups folder itself (by default the bike's folder under
              `Documents\PiBoSo\MX Bikes\profiles\unnamedProfile\setups`); you only load it
              (`lab/evidence/suspension-tuner-1.4.1/file-writes.txt`, `lab/evidence/suspension-tuner-1.4.1/telemetry.txt`).
          - Claim: '"Your .stp files are untouched." (its window, on Reset history)'
            Verdict: Not checked
            Evidence: >-
              Reset history wasn't clicked in the runs, and which files it removes can't be read from the constants alone
              (`lab/evidence/suspension-tuner-1.4.1/ui-claims.txt`).
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with no GPU and software OpenGL (Mesa llvmpipe), not Windows on a real
              GPU, without the game or Steam, so no game data was received, and nothing was clicked. A later run under Wine 9
              (not Windows) with a test game folder and no network clicked only Start listening (`lab/results/suspension-tuner-1.4.1/backup-wine/log.txt`); Finish &
              analyze, the settings, Reset history, the Discord and Gumroad buttons and the update notice weren't run. What
              they do rests on the app's constants.
            questions: [P4, P7, P8, G6, D6]
          - text: >-
              The app is compiled to machine code by Nuitka; the analysis read the names, texts and defaults each module keeps,
              not the order its code runs them in. That the Download button opens the release page rather than fetching a file
              rests on those constants: the update module's only internet call reads the release list, and no module holds a
              download or write of a fetched file. What it does to `proxy_udp.ini` and its `.bak` was seen in the Wine run, in
              a test folder at `C:\MX Bikes`, one of the four fixed folders it looks in; finding the game through Steam wasn't run.
            questions: [P2, P4, G6]
          - text: >-
              The installer, `SuspensionTuner_Setup.exe` (Inno Setup 6.7), couldn't be unpacked (innoextract 1.9 doesn't read
              that version) and wasn't run, so what it installs, any licence page in it, its shortcuts and its uninstaller
              weren't seen. The card covers the zip's files.
            questions: [P6, P8, G9, T7]
          - text: >-
              The launcher run ended about 5 s after the launcher started the app (the launcher exits at once), before the
              app's update check; the app's own 90 s run is the one that shows its start.
            questions: []
answers:
  P1:
    verdict: 'Yes'
    mark: concern
    text: >-
      9 of 66 engines (APEX, DeepInstinct, Google, Kingsoft, Malwarebytes, Paloalto, SentinelOne, Trapmine, Varist) flag the
      launcher `SuspensionTuner.exe` (last scanned 22 Nov 2026); 4 of 71 (DeepInstinct, Google, Skyhigh, Varist) flag
      `SuspensionTuner_Setup.exe` (21 Nov 2026); 1 of 71 (Cynet) flags `app\PIL\_imagingtk.pyd` (11 Nov 2026); 0 of 63 flag
      the app `app\SuspensionTuner.exe` (7 Nov 2026). `SuspensionTuner.zip` is not on VirusTotal (hash lookup on 24 Nov 2026).
      All 31 program files of the release are on VirusTotal, and no engine flags the others; the zip's Tcl/Tk scripts weren't
      looked up (over 40 files). Nothing uploaded.
    evidence: >-
      [SuspensionTuner.zip](https://www.virustotal.com/gui/file/58b8463c7e49f8e30268df4b78d7200668a721eb170b51c571f7962bb66af525),
      [SuspensionTuner_Setup.exe](https://www.virustotal.com/gui/file/5cbc4f49e300bb7b5daaa2497404749444878caef499abcd52439b90e860989a),
      [SuspensionTuner.exe](https://www.virustotal.com/gui/file/0e30010abc3af54ae71947612f9dea4e4e0bbefac52b5fb57d73419f270e15be),
      [app\SuspensionTuner.exe](https://www.virustotal.com/gui/file/8edf41c3bf2705f5dab19ff5351d9bc0dc72deb4645ebfd5565bcc00e0a7e72f),
      [app\PIL\_imagingtk.pyd](https://www.virustotal.com/gui/file/8ccd6128481d5a3a15993c2f8a69585694ff972652a6b06dcaee276fc65633a7)
  P2:
    verdict: 'No'
    mark: good
    text: >-
      It installs no updates. The update check reads GitHub's release list and keeps the newest version's number, notes and
      page; a newer version shows an "Update available" notice with a Download button. No module of the tool downloads or
      writes a fetched file.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/update-ui.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`, `lab/evidence/suspension-tuner-1.4.1/absent.txt`.'
  P3:
    verdict: Doesn't apply
    text: There is no updater that installs anything; the update check only tells you about a newer version (P2).
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/update-ui.txt`.'
  P4:
    verdict: 'Yes'
    mark: concern
    text: >-
      With Configure MX Bikes automatically on, as it is by default, starting an analysis looks for the game (Steam's folder
      from the registry, Steam's `libraryfolders.vdf`, four fixed folders) and rewrites its `proxy_udp.ini`, setting
      `enable = 1` and `ip = 127.0.0.1:<port>`. It copies the file to `proxy_udp.ini.bak` only when there is no `.bak` yet: in
      a run with a test game folder, after the file was edited by hand to send the data to another address, the next
      analysis rewrote it and kept the first copy, so the edited version was lost. It writes its own `ST_*.stp` setups and
      calibration test files; no delete of other programs' files was found in its constants. A program that got the proxy_udp
      data at another address gets none until you put the backup back.
    evidence: '`lab/results/suspension-tuner-1.4.1/backup-wine/log.txt` (runs 1 to 4, made by `run.sh` beside it); `lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`, `lab/evidence/suspension-tuner-1.4.1/defaults.txt`, `lab/evidence/suspension-tuner-1.4.1/auto-plugin.txt`, `lab/evidence/suspension-tuner-1.4.1/file-writes.txt`, `lab/evidence/suspension-tuner-1.4.1/absent.txt`.'
  P5:
    verdict: 'No'
    mark: concern
    text: >-
      Neither the installer, the launcher nor the app is code-signed, and they can't be traced to public source.
    evidence: Empty Security Directory for each (`lab/evidence/suspension-tuner-1.4.1/signature.txt`).
  P6:
    verdict: 'No'
    mark: good
    text: >-
      Its code only reads the registry (Steam's folder) and writes nothing there; its other Windows calls set its own
      window's DPI and taskbar name. In the runs, the registry writes were Windows' own (WMI, the network stack, the app-use
      record `bam`).
    evidence: '`lab/evidence/suspension-tuner-1.4.1/registry.txt`, `lab/evidence/suspension-tuner-1.4.1/absent.txt`; `lab/results/suspension-tuner-1.4.1/app-direct-windows/registry.txt`, `lab/results/suspension-tuner-1.4.1/launcher-windows/registry.txt`.'
  P7:
    verdict: 'Yes'
    mark: note
    text: >-
      It writes `proxy_udp.ini` and `proxy_udp.ini.bak` in the game folder (P4) when an analysis starts, and its setups
      (`ST_<track>_<bike>.stp`, or `ST_general_<bike>.stp`) into the game's setups folder in Documents after Finish &
      analyze. Nothing else is added; nothing was written when the app only started.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`, `lab/evidence/suspension-tuner-1.4.1/file-writes.txt`, `lab/evidence/suspension-tuner-1.4.1/telemetry.txt`; `lab/results/suspension-tuner-1.4.1/app-direct-windows/files.diff`, `lab/results/suspension-tuner-1.4.1/app-direct-windows/outside.txt`.'
  P8:
    verdict: 'Yes'
    mark: concern
    text: >-
      The zip has no uninstaller; deleting its folder leaves the changed `proxy_udp.ini` (its first copy sits next to it, to put
      back by hand), the `.stp` files it wrote and `%APPDATA%\SuspensionTuner`. The installer's uninstaller wasn't examined
      (Limits).
    evidence: '`lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`, `lab/evidence/suspension-tuner-1.4.1/defaults.txt`, `lab/evidence/suspension-tuner-1.4.1/file.txt`.'
  P9:
    verdict: 'No'
    mark: good
    text: >-
      No malware found. The flagged launcher is a .NET program that starts `app\SuspensionTuner.exe` with the same arguments
      and exits. The app's own modules do what its window shows: listen for the game's data, analyse it, write setups and
      `proxy_udp.ini`, and check GitHub for a version; they hold no code to start programs, open other processes or press
      keys.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/launcher.txt`, `lab/evidence/suspension-tuner-1.4.1/absent.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`, `lab/evidence/suspension-tuner-1.4.1/blocks.txt`; `lab/results/suspension-tuner-1.4.1/launcher-windows/procmon.txt`.'
  P10:
    verdict: Yes, on request
    mark: note
    text: >-
      Only if you pick "Install for all users". The Inno Setup installer asks for no rights by default
      (`PrivilegesRequired=lowest`) and its first dialog lets you choose an install for all users instead
      (`PrivilegesRequiredOverridesAllowed=dialog`), which Windows asks administrator rights for. Both
      `SuspensionTuner.exe` files request `asInvoker`; nothing installs a service or driver.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/privileges.txt`, `lab/evidence/suspension-tuner-1.4.1/setup-rights.txt`.'
  D1:
    verdict: 'Yes'
    mark: note
    text: >-
      At each start it asks `api.github.com` for the tool's release list over HTTPS; the app run tried it about 4 s after the
      start (to 140.82.112.6, GitHub). The Discord, Gumroad and release-page buttons open your browser only when clicked.
    evidence: '`lab/results/suspension-tuner-1.4.1/app-direct-windows/network.txt`; `lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D2:
    verdict: 'No'
    mark: good
    text: >-
      Only the plain update check leaves your PC: a request for the release list, with the tool's version in its User-Agent.
      The game's data stays on your PC.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D3:
    verdict: 'No'
    mark: good
    text: The update check carries no identifier; the tool makes none.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D4:
    verdict: 'No'
    mark: good
    text: It reads only your own bike's data from the game and sends nothing about other players.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/telemetry.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D5:
    verdict: 'No'
    mark: good
    text: It runs no web server; its only listener is the UDP socket for the game's data (see "Also found").
    evidence: '`lab/evidence/suspension-tuner-1.4.1/udp.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D6:
    verdict: 'Yes'
    mark: note
    text: >-
      To find the game it reads Steam's folder from the registry and Steam's `libraryfolders.vdf`; it reads the game's
      `proxy_udp.ini` and your own `.stp` setups. None of it is other people's data.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/proxy-ini.txt`, `lab/evidence/suspension-tuner-1.4.1/registry.txt`, `lab/evidence/suspension-tuner-1.4.1/telemetry.txt`.'
  D7:
    verdict: 'No'
    mark: good
    text: It publishes nothing; the update check only reads.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update.txt`, `lab/evidence/suspension-tuner-1.4.1/network.txt`.'
  D8:
    verdict: 'No'
    mark: note
    text: >-
      The update check at start has no switch (Settings shows "Checked automatically at startup" and Check now). It carries
      nothing about you.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/update-ui.txt`, `lab/evidence/suspension-tuner-1.4.1/defaults.txt`, `lab/evidence/suspension-tuner-1.4.1/update.txt`.'
  D9:
    verdict: 'No'
    mark: good
    text: No account; the download and the app need none.
    evidence: '`lab/evidence/suspension-tuner-1.4.1/strings-money.txt`, `lab/evidence/suspension-tuner-1.4.1/ui-claims.txt`.'
  D10:
    verdict: 'No'
    mark: good
    text: >-
