tool: Suspension Tuner
version: 1.4.1
summary: >-
  A Windows app that listens for the ride data MX Bikes' own proxy_udp plugin sends, analyses your laps and writes a new
  `.stp` suspension setup into the game's setups folder. With its default settings it switches the game's proxy_udp plugin
  on itself (keeping a copy of only the first version it changed) and checks GitHub for a newer version each time it starts.
header:
  What it is: >-
    A closed-source Windows app you run beside the game: a small .NET launcher, `SuspensionTuner.exe`, that starts the real
    program in `app\`, a Python app compiled with Nuitka. It receives the game's proxy_udp data over UDP, analyses the
    suspension and writes `ST_<track>_<bike>.stp` setup files. It is offered as a zip and as an Inno Setup installer; it is
    not a plugin.
  In one line: App that reads MX Bikes telemetry and writes suggested suspension setups (.stp)
  Category: Setup and coaching
  Author: Lilian1134 (GitHub name)
  Game: MX Bikes
  mxb-mods.com: '[Suspension Tuner](https://mxb-mods.com/suspension-tuner/), published 9 Oct 2026, updated 21 Oct 2026'
  Homepage: None found
  GitHub: '[Lilian1134/Suspension-Tuner](https://github.com/Lilian1134/Suspension-Tuner)'
  Version analysed: >-
    1.4.1: the GitHub release [1.4.1](https://github.com/Lilian1134/Suspension-Tuner/releases/tag/1.4.1) (20 Oct 2026),
    `SuspensionTuner.zip` and `SuspensionTuner_Setup.exe`; the newest release in the inventory (`registry/releases.json`,
    from GitHub; its mxb-mods.com page lists no files of its own).
  Source commit: >-
    [895a62d8dfdaba844a85878c4eae0cd2295fa3dc](https://github.com/Lilian1134/Suspension-Tuner/tree/895a62d8dfdaba844a85878c4eae0cd2295fa3dc)
    ("Update README.md", 16 Oct 2026), the commit tag `1.4.1` points to. At that commit the repository holds only
    `README.md`: the source isn't public.
  Analysed on: 24 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    No licence was found (none in the repository, the zip or on its pages), so nothing forbids the analysis; closed source,
    so the release was examined without running it here, except one run under Wine (Limits). The launcher (.NET) was decompiled with ILSpy (`ilspycmd`
    9.1.0). The app is compiled with Nuitka, so its Python code is machine code: it was read through the constants each of
    its nine own modules keeps (the names it calls, its texts, its defaults), listed with `lab/evidence/nuitka.py`, and
    through its imports; its control flow wasn't traced instruction by instruction. Every program file in the zip was listed
    with its type and hash, and the installer, launcher and app with their code-signing entry. The installer (Inno Setup 6.7) could not be unpacked: innoextract 1.9 can't
    read that version. Every command is in `lab/evidence/suspension-tuner-1.4.1/run.sh`. The release was not rebuilt (no
    public source). A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a
    real GPU), no game, no Steam and no keys started the launcher and, separately, the app for 90 s, under Process Monitor,
    with the run folder's programs blocked by the firewall, and clicked nothing; the installer wasn't run. VirusTotal: hash
    lookups only, made before the analysis (24 Nov 2026), nothing uploaded.
