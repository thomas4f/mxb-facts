tool: MXB Damage
version: 1.3.0
summary: >-
  An MX Bikes plugin that draws crash damage and dirt on your bike by redirecting the game's OpenGL draw pointers to its own code.
  By default it updates itself from GitHub when the game closes, after checking a signed manifest, and saves a copy of each new bike's
  model buffers and textures into its folder to find the bike's parts.
header:
  What it is: >-
    A closed-source plugin (`mxb_damage.dlo` and an `mxb_damage` folder) that goes into the game's `plugins` folder, with a helper
    program (`mxb_damage_updater.exe`) that finds a bike's parts and installs updates, and an installer (`MXB-Damage-Setup.exe`) that
    downloads the release from GitHub. In the game it bends, breaks and dirties the bike you ride as it is drawn, with an in-game menu on Q.
  In one line: Plugin that draws crash damage and dirt on your bike by hooking the game's drawing
  Category: Gameplay and visuals
  Author: GitHub user [FroxyMXB](https://github.com/FroxyMXB)
  Game: MX Bikes
  mxb-mods.com: '[MXB Damage](https://mxb-mods.com/mxb-damage-plugin-2/)'
  Homepage: None found
  GitHub: '[FroxyMXB/MXB-Damage-Plugin](https://github.com/FroxyMXB/MXB-Damage-Plugin)'
  Version analysed: 'MXB Damage 1.3.0, tag [v1.3.0](https://github.com/FroxyMXB/MXB-Damage-Plugin/releases/tag/v1.3.0)'
  Source commit: >-
    [7e92011d3c4653af579beb4588416359b572bf53](https://github.com/FroxyMXB/MXB-Damage-Plugin/tree/7e92011d3c4653af579beb4588416359b572bf53)
    (the commit tag v1.3.0 points at; the repository holds only `README.md`, so it isn't the source of the release files)
  Analysed on: 22 Nov 2026
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the repository nor the release carries a licence or a clause against analysis, so the release files were
    examined: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`), chosen call sites (`objdump -d`),
    the update package listed against the signed manifest, and the manifest's signature checked with the key found in the programs; every
    command is in `lab/evidence/mxb-damage-1.3.0/run.sh`. The release was not rebuilt (no public source). A throwaway Windows Server 2025
    machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran the plugin in the MX Bikes demo
    (beta21e), offline behind a firewall block, under Process Monitor: the bare demo as baseline, a 180 s ride with default settings, and a
    ride pressing Q four times; then the plugin test host (a crash case and a helmet-camera case, with the bystander plugin's checks) and the
    installer and the updater started alone. The real game online, other bikes and other plugins beside it were not run. VirusTotal: hash
    lookups only (`tools/vt_lookup.py`, 22 Nov 2026), nothing uploaded.
