tool: MXRP Ragdoll
version: '3.2'
summary: >-
  An MX Bikes plugin that turns your crash into a physics ragdoll and lets you walk back to the bike, place cones, bales and FMX ramps,
  and play this online with other users of the plugin, by patching the game's code and its network calls. By default it checks GitHub
  for updates at every start and asks before installing one, broadcasts on your local network every second, and its installer deletes
  every `mxb_ragdoll*.dlo` in `plugins`, the name of another ragdoll plugin.
header:
  What it is: >-
    A closed-source plugin (`MXRP_Ragdoll.dlo`, with its settings `MXRP_Ragdoll.ini`) for the game's `plugins` folder, released on
    GitHub as a manual zip, an installer (`MXRP Beta 3.2.exe`, which carries the same plugin, settings and guide) and the plugin and
    installer as single files for its own updates. In the game it throws your rider off as a ragdoll when you crash, lets you get up,
    walk, crouch and jump, lift the bike and ride again, place cones, hay bales and FMX ramps, and shares all of it with other riders
    who have the plugin, on a local network or on servers named RAGDOLL; it has a settings menu on P.
  In one line: Plugin that adds a crash ragdoll, walking and track objects by patching the game
  Category: Gameplay and visuals
  Author: GitHub user [avare795](https://github.com/avare795)
  Game: MX Bikes
  mxb-mods.com: >-
    None found (no post for it on 26 Nov 2026; the one ragdoll post there is MXB Ragdoll, another tool)
  Homepage: None found
  GitHub: '[avare795/MXRP-ragdoll](https://github.com/avare795/MXRP-ragdoll)'
  Version analysed: >-
    MXRP Beta 3.2 (plugin version 1.8.177), tag [v3.2](https://github.com/avare795/MXRP-ragdoll/releases/tag/v3.2), published
    25 Nov 2026: the tool's latest GitHub release when this analysis started (it wasn't yet in the inventory, `registry/releases.json`).
  Source commit: >-
    [cb32fcf292de965de5d9f492fa371bcbdf015646](https://github.com/avare795/MXRP-ragdoll/tree/cb32fcf292de965de5d9f492fa371bcbdf015646)
    (the commit tag v3.2 points at, whose message names Beta 3.1; the repository holds only `README.md` and `ROADMAP.md`, so it isn't
    the source of the release files)
  Analysed on: 26 Nov 2026
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the repository nor the release carries a licence or a clause against analysis, so the release files were
    examined: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`), the plugin's settings table and
    the code that sets its defaults, and chosen call sites (`objdump -d`), and the installer's payload and removal loop; every command is
    in `lab/evidence/mxrp-ragdoll-3.2/run.sh`. The release was not rebuilt (no public source). A throwaway Windows Server 2025 machine
    with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran the plugin in the MX Bikes demo (beta21e),
    offline behind a firewall block, under Process Monitor: the bare demo as baseline, a 180 s ride, a 120 s ride pressing F, E, W,
    Ctrl, V, Shift, Space, B and Escape, and a 60 s ride pressing P, Enter, Backspace, Escape, F7 and F8; then the plugin test host (a
    crash case, a crash case with the on-foot keys, a menu-keys case and a helmet-camera case, with the bystander plugin's checks) and
    the installer started alone for 90 s with no clicks. The real game online, a server, another rider with the plugin and an update
    were not run. VirusTotal: hash lookups made before the analysis (26 Nov 2026); nothing uploaded (no licence was found, so the run
    uploads nothing).
