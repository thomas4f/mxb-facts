tool: TrackRelief
version: 1.2.2
summary: >-
  A Windows app that downloads elevation data for an area you draw on a map and turns it into a 16-bit heightmap, a
  surface mask and game files, among them an MX Bikes `.tht` file. It loads its map from the internet as it opens and
  checks GitHub for a newer version at each start, which a setting switches off.
header:
  What it is: >-
    A closed-source Windows app for making terrain: a small .NET launcher, `TrackRelief.exe`, that starts the real program
    in `app\`, a Python app compiled with Nuitka. You search a place, draw a rectangle, and it downloads elevation data
    (national LiDAR services, or a global source) and writes a heightmap, masks, a satellite texture and files for MX
    Bikes, BeamNG or Assetto Corsa into a folder you choose. It is offered as a zip and as an Inno Setup installer; it is
    not a plugin.
  In one line: App that turns online elevation data into heightmaps and MX Bikes terrain files
  Category: Content creation
  Author: Lilian1134 (GitHub name)
  Game: MX Bikes
  mxb-mods.com: '[TrackRelief](https://mxb-mods.com/trackrelief/), published 14 Oct 2026, updated 21 Oct 2026'
  Homepage: None found
  GitHub: '[Lilian1134/TrackRelief](https://github.com/Lilian1134/TrackRelief)'
  Version analysed: >-
    1.2.2: the GitHub release [TrackRelief v1.2.2](https://github.com/Lilian1134/TrackRelief/releases/tag/1.2.2) (23 Oct
    2026), `TrackRelief.zip` and `TrackRelief_Setup.exe`; the newest release in the inventory (`registry/releases.json`,
    from GitHub; its mxb-mods.com page lists no files of its own).
  Source commit: >-
    [dd8f3ce4ba5e607f75849f6b330d5b9d5f647b21](https://github.com/Lilian1134/TrackRelief/tree/dd8f3ce4ba5e607f75849f6b330d5b9d5f647b21)
    ("Initial commit", 28 Sep 2026), the commit tag `1.2.2` points to. At that commit the repository holds only
    `README.md`: the source isn't public.
  Analysed on: 26 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    No licence was found (none in the repository, the zip or on its pages), so nothing forbids the analysis; closed source,
    so the release was examined without running it here. The launcher (.NET) was decompiled with ILSpy (`ilspycmd`
    11.2.0). The app is compiled with Nuitka, so its Python code is machine code: it was read through the constants each of
    its seven own modules keeps (the names it calls, its texts, its web addresses), listed with `lab/evidence/nuitka.py`, and
    through its imports; its control flow wasn't traced instruction by instruction. Every program file in the zip was listed
    with its type and hash, and the three main ones with their code-signing entry. The installer (Inno Setup 6.7) could not
    be unpacked: innoextract 1.9 can't read that version. Every command is in `lab/evidence/trackrelief-1.2.2/run.sh`. The
    release was not rebuilt (no public source). A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software
    OpenGL, not Windows on a real GPU), no game, no Steam and no keys started the launcher, the app on its own, and the
    installer, each under Process Monitor with the run folder's programs blocked by the firewall, and clicked nothing. No
    game plugin, so no run in the game. VirusTotal: hash lookups made before the analysis (26 Nov 2026), 40 files of the
    release; nothing uploaded, as no licence was found.
