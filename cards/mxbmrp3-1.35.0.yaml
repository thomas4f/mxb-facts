tool: MXBMRP3
version: 1.35.0
summary: A plugin that draws HUDs, a settings menu and many optional extras (spotter, rumble, web overlay, stream chat) in MX Bikes
  and GP Bikes through the game's plugin interface. Its source is public under the MIT licence and the release is built by GitHub Actions
  with signed build records; by default it sends a usage survey with a random install ID and, in a Steam copy, your track and server
  to your Steam friends.
header:
  What it is: 'A game plugin (`mxbmrp3.dlo` for MX Bikes, `mxbmrp3_gpb.dlo` for GP Bikes, and one for Kart Racing Pro) with its `mxbmrp3_data`
    folder, both in the game''s `plugins` folder. It draws standings, timing, a map, radar, a dash and other HUDs through the plugin
    interface, with a settings menu on the mouse and hotkeys, and optional extras: a spoken spotter, controller rumble, a local web
    overlay for streaming, Twitch and YouTube chat, online lap records, Discord and Steam presence. Setup (or the zip by hand) puts
    the files in each game it finds; an in-game updater replaces them when you click Install.'
  In one line: A plugin with HUDs, a settings menu and optional extras for MX Bikes and GP Bikes
  Category: HUD
  Author: thomas4f (GitHub user [thomas4f](https://github.com/thomas4f))
  Game: MX Bikes; GP Bikes
  mxb-mods.com: '[MXBMRP3](https://mxb-mods.com/mxbmrp3/)'
  gpb-mods.com: None found (a search of the site for MXBMRP3 on 27 Nov 2026 found no page)
  Homepage: '[thomas4f.github.io/mxbmrp3](https://thomas4f.github.io/mxbmrp3/)'
  GitHub: '[thomas4f/mxbmrp3](https://github.com/thomas4f/mxbmrp3)'
  Version analysed: '[v1.35.0](https://github.com/thomas4f/mxbmrp3/releases/tag/v1.35.0) (tag `v1.35.0`, published 8 Nov 2026), the
    tool''s latest GitHub release when this run started; the mxb-mods.com page lists no file of its own.'
  Source commit: '[64f3f33db2bb3e0df41649159bceae309a2a0b68](https://github.com/thomas4f/mxbmrp3/tree/64f3f33db2bb3e0df41649159bceae309a2a0b68)
    ("Release v1.35.0", 8 Nov 2026), the commit tag `v1.35.0` points to.'
  Analysed on: 27 Nov 2026
  Tested in: MX Bikes beta21f (demo), installer SHA-256 `76feb83746e785310e8858938dd50b5e0685d1b0004480d5d1c2d4fc21f11949`
  Method: '100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The licence is MIT, which allows the analysis. The source was read at the commit (plugin, Setup''s script, the release workflow,
    the usage survey files); the zip''s licence files were compared with it; Setup was unpacked with 7-Zip and holds the same three
    plugins as the zip; the GitHub build attestations of the zip and Setup were checked with sigstore; the MX Bikes plugin''s imports,
    VirtualProtect calls and text were read with `objdump` and `strings`. The release wasn''t rebuilt (T4). Every command is in `lab/evidence/mxbmrp3-1.35.0/run.sh`.
    A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no keys ran the
    MX Bikes plugin in the MX Bikes demo (beta21f), offline behind a firewall block, under Process Monitor: the bare demo as baseline,
    a 120 s ride, and a 120 s ride pressing the backtick key twice, Page Down twice and Page Up; all three reached the track. Then the
    plugin test host with the bystander plugin (600 frames with keys and a crash case, and 400 frames in the helmet view), and Setup
    for 120 s without clicking through it. The GP Bikes plugin wasn''t run. VirusTotal: hash lookups made before the analysis (27 Nov
    2026); nothing was uploaded.'
