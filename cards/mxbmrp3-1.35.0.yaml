files_note: No program file carries a Windows code signature (`lab/evidence/mxbmrp3-1.35.0/signature.txt`); the zip, its three plugins
  and Setup have GitHub build attestations that check out for the release workflow at the commit (`lab/evidence/mxbmrp3-1.35.0/attestation.txt`).
  Setup holds the same three plugins byte for byte and the same `mxbmrp3_data` folder apart from where the licence files sit (`lab/evidence/mxbmrp3-1.35.0/setup.txt`).
  The zip's other 739 files are fonts, images, themes, voice clips, language files and the web overlay's page (`lab/evidence/mxbmrp3-1.35.0/file.txt`);
  they aren't listed one by one. The hashes match the files the Windows machine ran (`lab/results/mxbmrp3-1.35.0/ride-defaults-windows/machine.txt`,
  `lab/results/mxbmrp3-1.35.0/ride-defaults-windows/plugins.sha256`).
key:
  K1: No malware found. 1 engine flagged Setup, 1 its uninstaller and 1 an NSIS plugin file; none flagged the plugins.
  K2: No. It installs an update only when you click Install, after checking the SHA-256 GitHub gives, which comes from the same place
    as the file.
  K3: No. It deletes and changes only its own files, and writes nothing to the registry beyond its own uninstall entry.
  K4: Yes. By default a usage survey with a random install ID, and in a Steam copy your track and server to your Steam friends.
  K5: No. It works through the plugin interface and changes nothing in the game.
  K6: No. It doesn't unlock, copy or share other people's content.
  K7: Yes. The full source is public, under the MIT licence.
  K8: Yes, as far as checked; its docs speak of aggregate survey results, and the repository also publishes them per install.
  K9: Yes. GitHub Actions builds the release from the commit and signs build attestations for its files.
  K10: Yes. By default the usage survey and the update check at each start; each has a switch.
areas:
  Your PC and files: Touches only its own files; updates install on your click after GitHub's hash check; not Windows-signed, but built
    by CI with signed attestations.
  Your data: Usage survey on by default with a random install ID, published per install in its repository; Steam presence to your friends;
    every connection can be switched off.
  Your game: A plugin that uses only the plugin interface, reads its own hotkeys and the mouse, and catches the game's crashes.
  Creators' content: Doesn't touch other people's content; credits the libraries, artwork and fonts it ships.
  Transparency: Full source public under the MIT licence; built from the commit by GitHub Actions; the public history is squashed releases.
  Money: Free; a Ko-fi link to thank the author, which unlocks nothing.
sections:
- title: Your PC and files
  blocks: []
- title: Your data
  blocks:
  - table:
    - What
    - Where to
    - When
    - Switch
    rows:
    - What: 'Usage survey: install ID, version, game, Windows version and regional format, features, achievements, session length, crash
        summary'
      Where to: Aptabase (`eu.aptabase.com` or `us.aptabase.com`) and GoatCounter (`mxbmrp3.goatcounter.com`, install ID as session)
      When: Each start and at exit; a crash summary at the next start
      Switch: '"Usage survey" (on; Setup''s box ticked)'
    - What: A request for the survey's settings file
      Where to: '`raw.githubusercontent.com`'
      When: Each start, while the survey is on
      Switch: '"Usage survey"'
    - What: A request for the latest releases; the zip when you click Install
      Where to: '`api.github.com`, then `github.com`'
      When: Each start
      Switch: Updates (Notify; Off stops it)
    - What: Your track, server name and session as Steam rich presence; your friends' presence back
      Where to: Your Steam friends, through the game's Steam connection
      When: While you play, in a Steam copy
      Switch: '"Steam" (on)'
    - What: Track and bike category, for lap records
      Where to: '`server.cbrservers.com` or `mxb-ranked.com`'
      When: While the Records HUD is shown
      Switch: Records HUD (off)
    - What: Your channel name, to read its chat
      Where to: '`irc-ws.chat.twitch.tv` or `www.youtube.com`'
      When: While Stream Chat is on
      Switch: Stream Chat (off)
    - What: Live race data for OBS or a browser
      Where to: '`127.0.0.1:8080` (a server on your PC)'
      When: While the web overlay is on
      Switch: Web overlay (off)
- title: Your game
  blocks: []
- title: Creators' content
  blocks: []
- title: Transparency
  blocks: []
- title: Money
  blocks: []
- title: What it says vs what it does
  blocks:
  - table:
    - Claim
    - Verdict
    - Evidence
    rows:
    - Claim: '"It never changes the game''s files. The installer puts the plugin in the game''s `plugins` folder." (docs/what-it-does.md)'
      Verdict: Matches
      Evidence: '[mxbmrp3.nsi lines 110-151](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/packaging/mxbmrp3.nsi#L110-L151);
        `lab/evidence/mxbmrp3-1.35.0/src-installer.txt`; `lab/results/mxbmrp3-1.35.0/ride-defaults-windows/files.diff`.'
    - Claim: '"It never sends input to the game and has no effect on physics, timing or anything else about how the game plays." (docs/what-it-does.md)'
      Verdict: Matches
      Evidence: '`lab/evidence/mxbmrp3-1.35.0/imports-dlo.txt`, `lab/evidence/mxbmrp3-1.35.0/src-memory.txt`.'
    - Claim: '"It tells you a new version exists and installs only when you click Install. When GitHub publishes a SHA-256 checksum
        for the download, it''s checked first." (docs/what-it-does.md)'
      Verdict: Matches
      Evidence: '[update_downloader.cpp lines 438-478](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader.cpp#L438-L478);
        `lab/evidence/mxbmrp3-1.35.0/src-update.txt`.'
    - Claim: '"It is on by default. The installer asks before anything is sent" (README, Privacy)'
      Verdict: Matches
      Evidence: '[analytics_manager.cpp line 226](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/analytics_manager.cpp#L226),
        [mxbmrp3.nsi lines 874-877](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/packaging/mxbmrp3.nsi#L874-L877);
        `lab/evidence/mxbmrp3-1.35.0/src-analytics.txt`.'
    - Claim: '"the aggregate results are published as an interactive page (also `usage_survey/REPORT.md` in the repo)" (README, Privacy)'
      Verdict: Partly
      Evidence: 'They are, and the same repository also publishes the data per install (D7): `lab/evidence/mxbmrp3-1.35.0/survey-published.txt`.'
    - Claim: '"If you''ve ever updated from inside the plugin, also delete `plugins\mxbmrp3_update_backup\`; the uninstaller leaves
        it." (README)'
      Verdict: Matches
      Evidence: '[mxbmrp3.nsi lines 1661-1696](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/packaging/mxbmrp3.nsi#L1661-L1696),
        [update_downloader_install.cpp line 461](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader_install.cpp#L461).
        Not run.'
- title: Limits of this analysis
  blocks:
  - limits:
    - text: The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX Bikes
        demo, offline.
      questions: []
    - text: The GP Bikes plugin wasn't run in the GP Bikes demo (the run covers one game); what it does rests on the same source and
        its imports, which match the MX Bikes plugin's.
      questions:
      - D1
      - P7
      - G6
    - text: 'The demo isn''t a Steam copy and the network was blocked: the Steam presence and friends list, what the survey and update
        requests carry, and the update check (not seen in the runs) rest on the source.'
      questions:
      - D1
      - D2
      - D3
      - D6
      - D10
    - text: 'No setting was changed and no menu button clicked: the web overlay, Discord, records, stream chat, Now Playing, the in-game
        update and the experimental Direct GL drawing rest on the source.'
      questions:
      - P2
      - P3
      - P4
      - D5
      - G2
      - G5
    - text: Setup ran 120 s without being clicked through, so it installed nothing, and the uninstaller wasn't run; what they do rests
        on Setup's script.
      questions:
      - P6
      - P7
      - P8
    - text: Whether Windows' speech component also writes its default-voice entry on a PC where one is already recorded wasn't checked.
      questions:
      - P6
      - P8
    - text: In the test host the crash case logged no crash, so the crash handler wasn't seen at work; it rests on the source and the
        plugin's imports.
      questions:
      - G8
    - text: 'Not rebuilt: Visual Studio 2022 on Windows isn''t part of this setup, and the official build carries secret survey keys.'
      questions:
      - T4
answers:
  P1:
    verdict: Partly
    mark: note
    text: 1 of 61 engines flagged `mxbmrp3-Setup.exe` (Trapmine), 1 of 55 its `mxbmrp3_uninstall.exe` (Trapmine) and 1 of 71 the NSIS
      `System.dll` (Cynet); 0 flagged `mxbmrp3.dlo`, `mxbmrp3_gpb.dlo` and `mxbmrp3_krp.dlo` (of 70 each), `nsDialogs.dll` (71), `LICENSE`
      (62) and `THIRD_PARTY_LICENSES.md` (61), on the hash lookup of 27 Nov 2026. `mxbmrp3.zip`, `mxbmrp3.cdx.json` and `README.txt`
      are not on VirusTotal (hash lookup on 27 Nov 2026); nothing was uploaded.
    evidence: '[mxbmrp3.zip](https://www.virustotal.com/gui/file/0b2d7654d3e830cc192fd3e1cc8eb71342b9ce3e03f73eb62b7918959abebe80),

      [mxbmrp3-Setup.exe](https://www.virustotal.com/gui/file/4a30fbd20b01b1c22b962c8ea16e6bc4617ac1e42447b668edc174dcb3324dc9),

      [mxbmrp3.cdx.json](https://www.virustotal.com/gui/file/107fa04299487cbd9e0259648759d67152769f6bbc61e5539eb790089744b90c),

      [mxbmrp3.dlo](https://www.virustotal.com/gui/file/2991d3733c981c83c4d1ce3312e55a0d4c3b383ded237be8f77c9f3e4cd07e90),

      [mxbmrp3_gpb.dlo](https://www.virustotal.com/gui/file/2c69dc59b8758d6c203079120022f3b1c4c530ab8906dfd729a972bf1553a466),

      [mxbmrp3_krp.dlo](https://www.virustotal.com/gui/file/5884ea41708910b86152f1f7818c98f2c8b8fb9e28168b5f8e09cc9bb8e11cb6),

      [README.txt](https://www.virustotal.com/gui/file/3d15d053bd5dced413c267f16dc873b17ede328d355715b2079e33589d72a6af),

      [LICENSE](https://www.virustotal.com/gui/file/7b458f0a37c5318168f4d82f9e786dea982e512a3d835b7affbc14fc2030f828),

      [THIRD_PARTY_LICENSES.md](https://www.virustotal.com/gui/file/ce7312be16492df1fb2e4c372795c918e0f5425c1d905eede55f8411fd8b00cb),

      [mxbmrp3_uninstall.exe](https://www.virustotal.com/gui/file/62807897d890110032e27036b27c3135a6a980d2953009a4555be0714bf182cb),

      [System.dll](https://www.virustotal.com/gui/file/54420efa0eb605bab7f691cb636380b9a566f7a7b735592631f1387984cb0718),

      [nsDialogs.dll](https://www.virustotal.com/gui/file/80a4a6980cbef7df15f973c10dd00a93b1d8cac7cae6687932073eafcfcd5714)'
  P2:
    verdict: 'No'
    mark: good
    text: 'It never installs an update on its own: at start it tells you a newer release exists (Updates set to Notify, its default),
      and downloads and installs it only when you click Install; the new version loads the next time you start the game.'
    evidence: '[update_checker.cpp line 27](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_checker.cpp#L27),
      [settings_manager.cpp lines 754-766](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/settings_manager.cpp#L754-L766);
      `lab/evidence/mxbmrp3-1.35.0/src-update.txt`.'
  P3:
    verdict: Partly
    mark: concern
    text: The download must come from a GitHub address and match the SHA-256 that GitHub's release API gives for it; that check comes
      from the same place as the file. A release without that digest is installed on the HTTPS connection alone. The updater checks
      no signature of its own.
    evidence: '[update_checker.cpp lines 483-487](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_checker.cpp#L483-L487),
      [update_downloader.cpp lines 438-478](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader.cpp#L438-L478),
      [update_downloader.cpp lines 574-581](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader.cpp#L574-L581);
      `lab/evidence/mxbmrp3-1.35.0/src-update.txt`.'
  P4:
    verdict: 'No'
    mark: good
    text: It deletes and overwrites only its own files. An update moves its own plugin and `mxbmrp3_data` to `plugins\mxbmrp3_update_backup\`
      (replacing the previous backup) and unpacks the new ones, refusing names with `..`; Setup's "fresh install" choice deletes its
      own settings folder after a warning, and the uninstaller deletes its own plugin, data folder and uninstaller.
    evidence: '[update_downloader_install.cpp lines 180-213](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader_install.cpp#L180-L213),
      [update_downloader_install.cpp line 393](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader_install.cpp#L393),
      [update_downloader_install.cpp line 461](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/mxbmrp3/core/update_downloader_install.cpp#L461),
      [mxbmrp3.nsi lines 1661-1696](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/packaging/mxbmrp3.nsi#L1661-L1696);
      `lab/evidence/mxbmrp3-1.35.0/src-update.txt`, `lab/evidence/mxbmrp3-1.35.0/src-installer.txt`.'
  P5:
    verdict: Partly
    mark: note
    text: No file carries a Windows code signature, so Windows warns about an unknown publisher. The zip (with its three plugins) and
      Setup have GitHub build attestations, signed for the release workflow of `thomas4f/mxbmrp3` at the commit; both check out with
      sigstore here, and a changed copy of the zip fails. Anyone can check them with `gh attestation verify`.
    evidence: '`lab/evidence/mxbmrp3-1.35.0/signature.txt`, `lab/evidence/mxbmrp3-1.35.0/attestation.txt`.'
  P6:
    verdict: 'No'
    mark: good
    text: The plugin's code writes nothing to the registry (it imports only registry reads), and Setup writes only its own uninstall
      entry and a test value under `HKLM\Software\MXBMRP3` that it deletes again. In the rides, the only registry writes beyond the
      bare demo's were Windows' speech component recording the default voice (`DefaultTokenId` under `HKCU\Software\Microsoft\Speech\Voices`
      and `Speech_OneCore\Voices`) while the plugin listed the installed voices at start, on a machine where none was recorded.
    evidence: '`lab/evidence/mxbmrp3-1.35.0/imports-dlo.txt`, `lab/evidence/mxbmrp3-1.35.0/src-memory.txt`, `lab/evidence/mxbmrp3-1.35.0/src-installer.txt`;
      `lab/results/mxbmrp3-1.35.0/ride-defaults-windows/registry.txt`, `lab/results/mxbmrp3-1.35.0/baseline-windows/registry.txt`, `lab/results/mxbmrp3-1.35.0/installer-windows/registry.txt`.'
  P7:
    verdict: 'No'
    mark: good
    text: 'In the game''s `plugins` folder it puts only its own files: the plugin, `mxbmrp3_data`, the uninstaller, Setup''s opt-out
      file inside `mxbmrp3_data`, and the update backup folder. Everything else it writes goes to `Documents\PiBoSo\<game>\mxbmrp3`;
      the rides wrote nothing else in the game folder.'
    evidence: '[mxbmrp3.nsi lines 110-151](https://github.com/thomas4f/mxbmrp3/blob/64f3f33db2bb3e0df41649159bceae309a2a0b68/packaging/mxbmrp3.nsi#L110-L151);
      `lab/evidence/mxbmrp3-1.35.0/src-installer.txt`; `lab/results/mxbmrp3-1.35.0/ride-defaults-windows/files.diff`, `lab/results/mxbmrp3-1.35.0/ride-defaults-windows/outside.txt`.'
  P8:
    verdict: 'Yes'
    mark: note
    text: Uninstalling removes the plugin, `mxbmrp3_data`, the uninstaller and its uninstall entry. It leaves its settings, stats and
      logs in `Documents\PiBoSo\<game>\mxbmrp3` unless you tick the option to remove them, and `plugins\mxbmrp3_update_backup\` if you
      ever updated in game; both are its own files.
