tool: MaXHUD
version: 2.2.7
summary: >-
  An MX Bikes plugin that draws a set of HUD widgets (timing, live gap, standings, map, radar, speed, inputs and more), set in a
  menu while Caps Lock is on. It makes no internet connection and writes only its settings and log, in the game's own save folder.
header:
  What it is: >-
    A closed-source plugin (`MaxHUD_MXB64.dlo` and a `MaxHUD_data` folder of fonts and images) that goes into the game's `plugins`
    folder. On track it draws widgets from the data the game passes to plugins, and can rumble an XInput controller. The same zip
    holds the plugins for GP Bikes, Kart Racing Pro and World Racing Series, and `MaxStopRumble.exe`, a small program that stops
    controller rumble.
  In one line: HUD plugin with timing, live gap, standings, map, radar and input widgets
  Category: HUD
  Author: HornetMaX (the name on the PiBoSo forum topic)
  Game: MX Bikes
  mxb-mods.com: >-
    [MaxHUD](https://mxb-mods.com/maxhud/), uploaded in 2021 by someone other than the author, with no download tied to 2.2.7; the
    author publishes MaXHUD on the PiBoSo forum
  Homepage: '[PiBoSo forum topic "MaxHUD plugin"](https://forum.piboso.com/index.php?topic=79.0)'
  GitHub: None found
  Version analysed: >-
    v2.2.7 (18 Aug 2023), the newest release on the author's PiBoSo forum topic (its first post, last edited 18 Aug 2023, links
    it): `MaXHUD - v2.2.7.zip` from the author's
    [MEGA folder](https://mega.nz/folder/dRsyARjI#ceFbX0UW01KgB93KY83hZA/file/QYlnVZwS). The inventory (`registry/releases.json`)
    lists only Microsoft's `vc_redist.x64.exe` from that topic, a prerequisite and not part of the tool. There are no tags or
    commits: the source isn't public.
  Analysed on: 23 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the release, its manual nor its forum topic carries a licence or a clause against analysis, so the
    release files were examined: imports, exports and code-signing entry (`objdump -p`), text (`strings`, `strings -el`, and
    `pdftotext` for the manual), and every call site of the imports that read keys and the mouse, drive controllers, read the
    registry, delete or rename files or set a crash handler (`objdump -d`); every command is in
    `lab/evidence/maxhud-2.2.7/run.sh`. Only the MX Bikes plugin and `MaxStopRumble.exe` were read in depth; the three plugins
    for other games were checked by type, hash, signature and VirusTotal. The release was not rebuilt (no public source). A
    throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU), no controller
    and no keys ran the plugin in the MX Bikes demo (beta21e), offline behind a firewall block, under Process Monitor: the bare
    demo as baseline, a 90 s ride, and a ride pressing Caps Lock four times; then the plugin test host (a default case, a case
    with Caps Lock twice and a crash with the bystander plugin's checks, and a helmet-view case), and `MaxStopRumble.exe` for
    20 s. The real game online and a real controller were not used. VirusTotal: hash lookups only (made before the analysis,
    23 Nov 2026), nothing uploaded.
