tool: MaXHUD
version: 2.2.7
summary: >-
  An MX Bikes plugin that draws HUD widgets (timing, track map, standings, radar, inputs, a helmet view and more) through the
  game's plugin interface, with a menu on Caps Lock. It has no network code and no updater; it was examined from its files
  only, not run.
header:
  What it is: >-
    A closed-source plugin (`MaxHUD_MXB64.dlo` and a `MaxHUD_data` folder of fonts and images) that goes into the game's
    `plugins` folder. The zip also holds the same plugin for GP Bikes, Kart Racing Pro and World Racing Series, a PDF manual and
    `MaxStopRumble.exe`, a small console program that stops controller vibration.
  In one line: Plugin that draws HUD widgets such as timing, track map, standings and radar
  Category: HUD
  Author: HornetMaX (PiBoSo forum)
  Game: MX Bikes
  mxb-mods.com: >-
    [MaxHUD](https://mxb-mods.com/maxhud/), uploaded there in 2021 by someone else (its text says it posts someone else's mod),
    with no download tied to 2.2.7; the author publishes on the PiBoSo forum
  Homepage: '[PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0)'
  GitHub: None found
  Version analysed: >-
    MaXHUD v2.2.7 (2023/08/18), the file `MaXHUD - v2.2.7.zip` in the
    [MEGA folder](https://mega.nz/folder/dRsyARjI#ceFbX0UW01KgB93KY83hZA/file/QYlnVZwS) the forum topic links as "DOWNLOAD v2.2.7"
    (no tags: the tool isn't on GitHub)
  Analysed on: 23 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and neither the release, its PDF nor the forum topic carries a licence or a clause against analysis, so the
    release files were examined: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`), the
    call sites of the functions that matter (`objdump -d`) and the PDF's text (`pdftotext`); every command is in
    `lab/evidence/maxhud-2.2.7/run.sh`. The MX Bikes plugin was read most closely; the other three plugins were compared by
    their imports. The release was not rebuilt (no public source). Nothing was run: the job that prepares the Windows run could
    not download the release (its downloader read MEGA file links, not a file inside a MEGA folder), so the throwaway Windows
    machine ran neither the real game nor the test host, and the workflow doesn't run the tool where this analysis runs. This
    analysis added MEGA folder links to `tools/fetch_release.py` and downloaded the zip with it (SHA-256 as the plan job
    recorded it). VirusTotal: no lookup was made (the lookup before this job had no files to look up), nothing uploaded.
