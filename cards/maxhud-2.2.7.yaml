    evidence: '`lab/evidence/maxhud-2.2.7/pdf-text.txt`; [PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0).'
  T6:
    verdict: Not checked
    text: No source or build files are public, so its dependencies can't be read.
    evidence: '-'
  T7:
    verdict: 'No'
    mark: concern
    text: Neither the release, its manual nor its forum topic has a licence.
    evidence: '`unzip -l` of the zip (`lab/evidence/maxhud-2.2.7/file.txt`), `lab/evidence/maxhud-2.2.7/readme-claims.txt`; [PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0).'
  M1:
