files_note: >-
  No program file in the zip is code-signed (`lab/evidence/maxhud-2.2.7/signature.txt`). The zip's hash matches the one the
  Windows machine ran (`lab/results/maxhud-2.2.7/ride-windows/machine.txt`), and the plugins' the ones the game loaded
  (`lab/results/maxhud-2.2.7/ride-windows/plugins.sha256`).
key:
  K1: 'No malware found. One engine of 67 flags the zip; none flags any file in it.'
  K2: 'No. It has no updater.'
  K3: 'No. It deletes and renames only its own log and settings.'
  K4: 'No. It makes no internet connection.'
  K5: 'No. It uses only the plugin interface and changes nothing in the game''s code or memory.'
  K6: 'No. It reads only the data the game passes to plugins.'
  K7: 'No. Only the compiled plugins and program are published.'
  K8: 'Yes, as far as checked; nothing its manual says on these questions differs from what was found.'
  K9: 'No. Not code-signed, and there is no public source to trace it to.'
  K10: 'No. It has no network code, and the runs tried no connection.'
areas:
  Your PC and files: >-
    No updater and no installer; it writes only its settings and log in the game's save folder, and they stay when you remove
    the plugin; not code-signed.
  Your data: No internet connection and no network code; its log holds one short line per start.
  Your game: >-
    A plugin that uses only the plugin interface, XInput and the joystick functions of Windows; while its menu is open it reads
    the mouse and Left Shift through Windows without checking which window is in front.
  Creators' content: Doesn't touch other people's content; it reads only the data the game passes to plugins.
  Transparency: Closed source with no licence, published as a zip on MEGA from a PiBoSo forum topic.
  Money: Free; its forum topic asks for donations through PayPal.
sections:
  - title: Your PC and files
    blocks:
      - text: >-
          Also found: the plugin needs Microsoft's Visual C++ runtime (`MSVCP140.dll`, `VCRUNTIME140.dll`), which the release
          doesn't ship; its manual links Microsoft's installer (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.iat.txt`,
          `lab/evidence/maxhud-2.2.7/readme-claims.txt`).
        mark: note
  - title: Your data
    blocks: []
  - title: Your game
    blocks:
      - text: >-
          Also found: for its Inputs and Joypad widgets it reads joysticks through DirectInput, which it loads itself, and the
          older Windows joystick functions, and it reads and sets XInput controllers for its Rumble widget, on the controller chosen in its settings
          (`xinput_device`) (`lab/evidence/maxhud-2.2.7/xinput-callsites.txt`, `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.18002ebf0-18002ec4b.txt`).
        mark: note
      - text: >-
          Also found: `MaxStopRumble.exe` imports only XInput and the C runtime; run, it printed "MaxStopRumble running ..." and
          "MaxStopRumble done !", exited, wrote no file and tried no connection (`lab/evidence/maxhud-2.2.7/MaxStopRumble.exe.iat.txt`,
          `lab/evidence/maxhud-2.2.7/stoprumble-strings.txt`, `lab/results/maxhud-2.2.7/maxstoprumble-windows/host.log`,
          `lab/results/maxhud-2.2.7/maxstoprumble-windows/files.diff`, `lab/results/maxhud-2.2.7/maxstoprumble-windows/network.txt`).
        mark: note
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks: []
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: '"MaxHUD_MXB64.dlo : plugin for MX Bikes" (MaxHUD.pdf)'
            Verdict: Matches
            Evidence: 'The MX Bikes demo (beta21e) loaded it and it drew its widgets on track (`lab/results/maxhud-2.2.7/ride-windows/loaded.txt`, `lab/results/maxhud-2.2.7/ride-windows/shot_ride.png`).'
          - Claim: '"Unzipping the archive you will find: MaxHUD.pdf, MaxHUD_data, MaxHUD_GPB64.dlo, MaxHUD_MXB64.dlo, MaxHUD_WRS64.dlo, MaxHUD_KRP64.dlo" (MaxHUD.pdf)'
            Verdict: Partly
            Evidence: 'The zip also holds `MaxStopRumble.exe`, which the manual doesn''t name (`lab/evidence/maxhud-2.2.7/file.txt`, `lab/evidence/maxhud-2.2.7/readme-claims.txt`).'
          - Claim: '"The plugin creates a MaxHUD.ini file in the data directory corresponding to the game: `C:\Users\<Your Windows Username>\Documents\PiBoSo\MX Bikes\`" (MaxHUD.pdf)'
            Verdict: Matches
            Evidence: 'The ride created `Documents\PiBoSo\MX Bikes\MaxHUD.ini` (`lab/results/maxhud-2.2.7/ride-windows/outside.txt`).'
          - Claim: '"Logging to MaxHUD.log is always now on (tiny file, no impact)." "Now it''s erased at startup." (MaxHUD.pdf, changelog)'
            Verdict: Matches
            Evidence: 'At start it deletes `MaxHUD.log` (the only `remove` call), then wrote it once, 40 bytes, in the 90 s ride (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.180029e1e-180029ea0.txt`, `lab/evidence/maxhud-2.2.7/file-names.txt`, `lab/results/maxhud-2.2.7/ride-windows/raw/procmon.csv.gz`).'
          - Claim: '"your old MaxHUD.ini file will be renamed to MaxHUD.ini.YYYYMMDD-hhmmss" (MaxHUD.pdf)'
            Verdict: Matches
            Evidence: 'Its only `rename` call moves the `MaxHUD.ini` path to the same path with a date in the format `%Y%m%d-%H%M%S` (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.1800118d7-1800119c7.txt`, `lab/evidence/maxhud-2.2.7/file-names.txt`). The runs started without a `MaxHUD.ini`, so none renamed one.'
          - Claim: '"When on the track, pressing CAPS-LOCK will show a menu" (MaxHUD.pdf)'
            Verdict: Not checked
            Evidence: 'The code shows the menu while Caps Lock is on and hides it when it is off (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.1800139a0-180013bca.txt`), but no run shows the menu (see Limits).'
          - Claim: '"I credit random for his great work and his willingness to share his code." (MaxHUD.pdf)'
            Verdict: Matches
            Evidence: 'The manual''s first line (`lab/evidence/maxhud-2.2.7/readme-claims.txt`); see C4 for the code it doesn''t credit.'
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX Bikes
              demo, offline. Frame times say nothing about real performance.
            questions: []
          - text: >-
              In the real-game runs, all four MaXHUD plugins and `MaxStopRumble.exe` were in `plugins` (the manual says to copy only the
              game's own plugin), and the game loaded all four, so those runs' file, registry and network lines cover the four together.
              The test-host runs loaded only `MaxHUD_MXB64.dlo`.
            questions: []
          - text: >-
              No XInput controller or joystick was connected in any run, so rumble and the Inputs and Joypad widgets' device reads
              weren't seen; what the plugin does with a controller was read from its calls to XInput, DirectInput and the Windows
              joystick functions.
            questions: []
          - text: >-
              The menu was never seen: in the real game the screenshot was taken after the fourth Caps Lock press, which turns Caps Lock
              off and closes it, and in the test host the plugin's draw list didn't change after the presses. That it reads the mouse
              and Left Shift while the menu is open, without checking which window is in front, rests on its code.
            questions: [G7]
          - text: >-
              The content of `MaxHUD.log` wasn't collected; what it holds rests on its size (one 40-byte write per ride, from Process
              Monitor).
            questions: [D10]
          - text: >-
              Every run started without a `MaxHUD.ini`, so the reset that renames an old one wasn't run; that it renames only that file
              rests on its code.
            questions: [P4]
          - text: >-
              The real game on an online server can't be reached here (the demo has no online play). That it changes nothing there rests
              on its code: it has no hooks, patches or writes into the game, so it has nothing to change on a server either.
            questions: [G3]
          - text: >-
              Closed source: the plugin was read from its imports, text and the call sites named on the lines, not decompiled in full. A
              read of the game's memory through an address the plugin works out at run time would not show in these.
            questions: [G4]
          - text: >-
              The plugins for GP Bikes, Kart Racing Pro and World Racing Series were not read or run beyond their type, hashes, code
              signature and VirusTotal; this card covers the MX Bikes plugin.
            questions: []
answers:
  P1:
    verdict: Partly
    mark: note
    text: >-
      One engine of 67 (MaxSecure) flags `MaXHUD - v2.2.7.zip` (last scanned 28 Jul 2025). No engine flags any of the 28 files
      inside it, the four plugins and `MaxStopRumble.exe` included. Every file is on VirusTotal. Hash lookups on 23 Nov 2026;
      nothing uploaded.
    evidence: >-
      [MaXHUD - v2.2.7.zip](https://www.virustotal.com/gui/file/7bad0de4e79f07d555b00f487dc9849a3220fcd475d547235e357b5a46fe2d58), [MaxHUD_GPB64.dlo](https://www.virustotal.com/gui/file/1d8a0809582b494813e0bc13a539cc100db9a91717739c9949e89d78e52e75e0), [MaxHUD_KRP64.dlo](https://www.virustotal.com/gui/file/5ac21e129fc5090dc55882757d6ad6255f99809e5967c5f6542a6c1bd3df7924), [MaxHUD_MXB64.dlo](https://www.virustotal.com/gui/file/d6216e38d3b8100ce34dbf83b18e075d320c7c05c497147dfb8f626da0118295), [MaxHUD_WRS64.dlo](https://www.virustotal.com/gui/file/538c9338bbff7b43b395b14405697ae6667ce7af3f1c228a94a696debe7913a7), [MaxStopRumble.exe](https://www.virustotal.com/gui/file/ad745843f5dd2e92c6acc470c614a998ffea6f59d03ca8c3bbaf3eda8efb9042), [MaxHUD.pdf](https://www.virustotal.com/gui/file/dc0d95cf122330646b2ed0ff9b81ac9af63ce1d29557b0b6d3b2e52916cb5a93), [FontFix_CqMono.fnt](https://www.virustotal.com/gui/file/4ef1d7746a4fe7c4f52e7cec944b9e336e46644d5057a847ec03553a1ec5ec6c), [FontFix_SourceCodeProBold.fnt](https://www.virustotal.com/gui/file/8e6fcc47232b13240582d731807495c491621f5a735c8e04d5258dc367fd9000), [FontVar_Audiowide.fnt](https://www.virustotal.com/gui/file/795f64a940b6ee19bc5b55c7f9dbc476d2f186768c56ee4346380ac471d453b1), [FontVar_FallingSkyBold.fnt](https://www.virustotal.com/gui/file/80815e7b53c5ff80b3b415758dea22bf41d90bdff6903a563f0ba3edba71d514), [FontVar_PiBoSo.fnt](https://www.virustotal.com/gui/file/310463b695ab0bd6cf4d28597c7c0a6b7f88421181d6a1054ed7c1781cd89270), [dot.tga](https://www.virustotal.com/gui/file/6605add8a020a0987284c6051b66515ec639896d21b20cc45adeda4c01a4c277), [helmet-bot.tga](https://www.virustotal.com/gui/file/f0bfd92d4ac5a538bbf36a56b2fb23a5b91fcc9e718efcc8179dcbbf5df6adce), [helmet-mxb-bot.tga](https://www.virustotal.com/gui/file/06b6a7ad722005698d1b294ba4489f2b92c6a85145c3c45c5827bd0dc51c0e1d), [helmet-mxb-top.tga](https://www.virustotal.com/gui/file/8165b6f6ea2097f0d10ca73c39038e3f89e0c351bc45938ad73d4bd6e5f9d784), [helmet-top.tga](ht