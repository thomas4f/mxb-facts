  P4:
    verdict: 'No'
    mark: good
    text: >-
      Its only file delete is of its own `MaxHUD.log`, at start, and its only rename moves its own `MaxHUD.ini` to a dated copy when
      it resets its settings. The rides wrote only `MaxHUD.ini` and `MaxHUD.log` beyond what the bare demo wrote.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/file-ops.txt`, `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.180029e1e-180029ea0.txt`,
      `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.1800118d7-1800119c7.txt`, `lab/evidence/maxhud-2.2.7/file-names.txt`;
      `lab/results/maxhud-2.2.7/ride-windows/outside.txt` against `lab/results/maxhud-2.2.7/baseline-windows/outside.txt`.
  P5:
    verdict: 'No'
    mark: concern
    text: No program file in the release carries a code signature, and none can be traced to public source.
    evidence: Empty Security Directory in all five (`lab/evidence/maxhud-2.2.7/signature.txt`).
  P6:
    verdict: 'No'
    mark: good
    text: >-
      The rides wrote no registry value the bare demo didn't, and the plugin imports no function that writes the registry; it only
      reads Windows' joystick settings to name joysticks.
    evidence: >-
      `lab/results/maxhud-2.2.7/ride-windows/registry.txt` and `lab/results/maxhud-2.2.7/menu-windows/registry.txt` against
      `lab/results/maxhud-2.2.7/baseline-windows/registry.txt`; `lab/evidence/maxhud-2.2.7/imports-absent.txt`,
      `lab/evidence/maxhud-2.2.7/registry-callsites.txt`.
  P7:
    verdict: 'No'
    mark: good
    text: >-
      It writes only its settings (`MaxHUD.ini`) and log (`MaxHUD.log`), in the game's save folder `Documents\PiBoSo\MX Bikes`;
      nothing in the game's install folder.
    evidence: '`lab/results/maxhud-2.2.7/ride-windows/outside.txt`, `lab/results/maxhud-2.2.7/ride-windows/files.diff`.'
  P8:
    verdict: 'Yes'
    mark: note
    text: >-
      It has no uninstaller. Removing `MaxHUD_MXB64.dlo` and `MaxHUD_data` leaves its own `MaxHUD.ini` and `MaxHUD.log` in
      `Documents\PiBoSo\MX Bikes`; it changes nothing in Windows.
    evidence: >-
      `lab/results/maxhud-2.2.7/ride-windows/outside.txt`, `lab/results/maxhud-2.2.7/ride-windows/registry.txt` (the same as the
      baseline's).
  P9:
    verdict: 'No'
    mark: good
    text: >-
      No malware found. Its imports and text match what it shows: the plugin functions, its widgets and menu, its settings and log,
      joysticks and XInput controllers. It imports no function that changes memory protection, opens another process, starts a
      program or connects to the internet.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.iat.txt`, `lab/evidence/maxhud-2.2.7/imports-absent.txt`,
      `lab/evidence/maxhud-2.2.7/strings-files.txt`, `lab/evidence/maxhud-2.2.7/MaxStopRumble.exe.iat.txt`.
  D1:
    verdict: 'No'
    mark: good
    text: >-
      It imports no network library and holds no web address, and no run tried a connection. The only DLL it loads by name is
      `dinput8.dll`, Windows' DirectInput.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/evidence/maxhud-2.2.7/strings-urls.txt`,
      `lab/evidence/maxhud-2.2.7/dinput-names.txt`; `lab/results/maxhud-2.2.7/ride-windows/network.txt`,
      `lab/results/maxhud-2.2.7/menu-windows/network.txt`, `lab/results/maxhud-2.2.7/menu-crash-windows/network.txt`.
  D2:
    verdict: 'No'
    mark: good
    text: Nothing is sent; it has no way to connect.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/results/maxhud-2.2.7/ride-windows/network.txt`.'
  D3:
    verdict: 'No'
    mark: good
    text: Nothing is sent, so no identifier is.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/results/maxhud-2.2.7/ride-windows/network.txt`.'
  D4:
    verdict: 'No'
    mark: good
    text: >-
      Nothing is sent. It takes the other riders' standings and positions from the plugin functions only to draw them.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.objdump-p.txt`.'
  D5:
    verdict: 'No'
    mark: good
    text: It imports no socket library, so it runs no server.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  D6:
    verdict: 'No'
    mark: good
    text: >-
      The only files it names are its own (its data folder, settings and log). It reads Windows' joystick settings in the registry,
      to name joysticks.
    evidence: '`lab/evidence/maxhud-2.2.7/strings-files.txt`, `lab/evidence/maxhud-2.2.7/registry-callsites.txt`, `lab/evidence/maxhud-2.2.7/strings-thirdparty.txt`.'
  D7:
    verdict: 'No'
    mark: good
    text: It publishes nothing; it has no network code.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  D8:
    verdict: 'Yes'
    mark: good
    text: It makes no connection, so there is nothing to switch off.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/results/maxhud-2.2.7/ride-windows/network.txt`.'
  D9:
    verdict: 'No'
    mark: good
    text: No account; the forum topic and the MEGA folder open without one.
    evidence: '[PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0); `lab/evidence/maxhud-2.2.7/strings-urls.txt`.'
  D10:
    verdict: 'No'
    mark: good
    text: >-
      No shared memory, socket or exported data function. Its log got one 40-byte write per ride.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.objdump-p.txt`,
      `lab/results/maxhud-2.2.7/ride-windows/raw/procmon.csv.gz`.
  G1:
    verdict: 'No'
    mark: good
    text: It runs only as a plugin the game loads; it imports nothing that writes into or starts another process.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  G2:
    verdict: 'No'
    mark: good
    text: >-
      The test host found the game's import table and the bystander plugin's tables untouched before, during and after it ran, a
      crash included. It imports no function that changes memory protection.
    evidence: >-
      `lab/results/maxhud-2.2.7/menu-crash-windows/host.log`, `lab/results/maxhud-2.2.7/helmet-windows/host.log`;
      `lab/evidence/maxhud-2.2.7/imports-absent.txt`.
  G3:
    verdict: 'No'
    mark: good
    text: It changes nothing in the game's code or memory (G2), so it changes nothing online either. Not seen on a server (see Limits).
    evidence: '`lab/results/maxhud-2.2.7/menu-crash-windows/host.log`, `lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  G4:
    verdict: 'No'
    mark: good
    text: >-
      None found. Its code holds no address in the game's program, and it imports nothing that reads another process. The only
      handle to the game it takes is passed to DirectInput, as SFML's joystick code does; it finds the "MX Bikes" window only for
      its size and the mouse position.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/fixed-addresses.txt`, `lab/evidence/maxhud-2.2.7/imports-absent.txt`,
      `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.18002ebf0-18002ec4b.txt`, `lab/evidence/maxhud-2.2.7/keys-callsites.txt`,
      `lab/evidence/maxhud-2.2.7/window-name.txt`.
  G5:
    verdict: 'No'
    mark: good
    text: >-
      It reads Caps Lock, and while its menu is open the mouse, its buttons and Left Shift, for its own menu; reading them doesn't
      take them from the game, and it imports nothing that presses keys or clicks.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/keys-callsites.txt`, `lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.1800139a0-180013bca.txt`,
      `lab/evidence/maxhud-2.2.7/imports-absent.txt`.
  G6:
    verdict: 'No'
    mark: good
    text: The bystander plugin's import and pointer tables stayed untouched in the test host, and it names no other plugin's files.
    evidence: '`lab/results/maxhud-2.2.7/menu-crash-windows/host.log`, `lab/evidence/maxhud-2.2.7/strings-files.txt`.'
  G7:
    verdict: Yes, not by default
    mark: note
    text: >-
      While its menu is open (Caps Lock on, on track), each time the game draws a frame it reads the left and right mouse buttons
      and Left Shift with GetAsyncKeyState without checking which window is in front. Caps Lock itself is read with GetKeyState,
      which follows the game window's own input. These are its only key reads.
    evidence: >-
      Draw calls the menu function (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.18002b0e2-18002b0f3.txt`); the reads of 0x14
      (Caps Lock), 0x01, 0x02 and 0xa0 (Left Shift) (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.1800139a0-180013bca.txt`); every
      call site (`lab/evidence/maxhud-2.2.7/keys-callsites.txt`).
  G8:
    verdict: 'No'
    mark: good
    text: >-
      Both its SetUnhandledExceptionFilter calls pass 0, right before the C runtime ends the process on a fatal error; it sets no
      handler of its own.
    evidence: '`lab/evidence/maxhud-2.2.7/crash-filter.txt`; `lab/evidence/maxhud-2.2.7/imports-absent.txt` (no AddVectoredExceptionHandler).'
  G9:
    verdict: 'No'
    mark: good
    text: Nothing is added to Windows start-up; it writes no registry value.
    evidence: '`lab/results/maxhud-2.2.7/ride-windows/registry.txt`, `lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  G10:
    verdict: Yes, on request
    mark: note
    text: >-
      The release holds `MaxStopRumble.exe`, a console program you start yourself, which stops rumble on XInput controllers and
      exits. The plugin starts no program.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/file.txt`, `lab/evidence/maxhud-2.2.7/stoprumble-strings.txt`,
      `lab/results/maxhud-2.2.7/maxstoprumble-windows/host.log`; `lab/evidence/maxhud-2.2.7/imports-absent.txt` (no CreateProcess).
  G11:
    verdict: 'Yes'
    mark: note
    text: '`MaxHUD_MXB64.dlo` is a game plugin, loaded by the game from `plugins`.'
    evidence: >-
      Exports Startup, RunTelemetry, Draw and the other plugin functions (`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.objdump-p.txt`);
      loaded in `lab/results/maxhud-2.2.7/ride-windows/loaded.txt`.
  G12:
    verdict: 'No'
    mark: good
    text: >-
      No integrity, version, licence or anti-cheat check is got around; it changes nothing in the game, and the rides ran like the
      baseline.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`, `lab/results/maxhud-2.2.7/ride-windows/host.log`.'
  C1:
    verdict: 'No'
    mark: good
    text: It opens no game content and has no decryption code; it imports no cryptography function.
    evidence: '`lab/evidence/maxhud-2.2.7/MaxHUD_MXB64.dlo.iat.txt`, `lab/evidence/maxhud-2.2.7/strings-files.txt`.'
  C2:
    verdict: 'No'
    mark: good
    text: It saves only its settings and log.
    evidence: '`lab/results/maxhud-2.2.7/ride-windows/outside.txt`, `lab/evidence/maxhud-2.2.7/strings-files.txt`.'
  C3:
    verdict: 'No'
    mark: good
    text: It shares nothing; it has no network code.
    evidence: '`lab/evidence/maxhud-2.2.7/imports-absent.txt`.'
  C4:
    verdict: Partly
    mark: note
    text: >-
      Its manual credits random's AdvancedHUD, whose code inspired it, and the makers of the helmet images. Its joystick code,
      whose messages match those in SFML's Windows joystick code (zlib licence), isn't named; nor is Microsoft's C/C++ runtime it
      uses.
    evidence: >-
      `lab/evidence/maxhud-2.2.7/readme-claims.txt`, `lab/evidence/maxhud-2.2.7/strings-thirdparty.txt`; SFML 2.5.1
      [JoystickImpl.cpp](https://github.com/SFML/SFML/blob/2f11710abc5aa478503a7ff3f9e654bd2078ebab/src/SFML/Window/Win32/JoystickImpl.cpp#L380-L401).
  C5:
    verdict: 'No'
    mark: good
    text: It opens no mod, paint, track or model file; its data, the track map included, comes from the plugin functions.
    evidence: '`lab/evidence/maxhud-2.2.7/strings-files.txt`, `lab/results/maxhud-2.2.7/ride-windows/outside.txt`.'
  T1:
    verdict: 'No'
    mark: concern
    text: >-
      The source isn't public. Prebuilt program files, none with public source: `MaxHUD_MXB64.dlo`, `MaxHUD_GPB64.dlo`,
      `MaxHUD_KRP64.dlo` and `MaxHUD_WRS64.dlo` (PE32+ DLLs, x86-64) and `MaxStopRumble.exe` (PE32 console program, i386). The
      other files are fonts, images and the manual.
    evidence: '`file` on each (`lab/evidence/maxhud-2.2.7/file.txt`); [PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0) (a MEGA download only).'
  T2:
    verdict: 'No'
    mark: good
    text: >-
      Nothing its manual says on these questions differs from what was found; the file list and the menu are in "What it says vs
      what it does".
    evidence: '`lab/evidence/maxhud-2.2.7/readme-claims.txt`, `lab/results/maxhud-2.2.7/ride-windows/outside.txt`.'
  T3:
    verdict: 'No'
    mark: concern
    text: The release is a zip on MEGA; there is no public source or build.
    evidence: '[PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0).'
  T4:
    verdict: 'No'
    mark: concern
    text: There is no public source to rebuild from.
    evidence: '[PiBoSo forum topic](https://forum.piboso.com/index.php?topic=79.0).'
  T5:
    verdict: 'No'
    mark: note
    text: >-
