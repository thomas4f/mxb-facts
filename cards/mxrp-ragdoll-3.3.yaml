tool: MXRP Ragdoll
version: '3.3'
summary: >-
  An MX Bikes plugin that turns your crash into a physics ragdoll and lets you walk back to the bike, place cones, bales, furniture
  and FMX ramps, and play this on RAGDOLL servers with other users of the plugin, by patching the game's code and its network calls.
  By default it checks GitHub for updates at every start, asks before installing one and checks it against the author's signature,
  and on a RAGDOLL server it sends your walking and crashes to other plugin users.
header:
  What it is: >-
    A closed-source plugin (`MXRP_Ragdoll.dlo`, with its settings `MXRP_Ragdoll.ini`) for the game's `plugins` folder, released on
    GitHub as a manual zip, an installer (`MXRP Beta 3.3.exe`, which carries the same plugin, settings and guide) and the plugin and
    installer as single files with their signatures for its own updates; the source of the installer and of the update code is
    published in the repository. In the game it throws your rider off as a ragdoll when you crash, lets you get up, walk, crouch, sit
    and jump, lift the bike and ride again, place cones, hay bales, a table and chairs and FMX ramps, and shares all of it with other
    riders who have the plugin on servers named RAGDOLL; it has a settings menu on P.
  In one line: Plugin that adds a crash ragdoll, walking and track objects by patching the game
  Category: Gameplay and visuals
  Author: GitHub user [avare795](https://github.com/avare795)
  Game: MX Bikes
  mxb-mods.com: >-
    None found (no post for it on 26 Nov 2026; the one ragdoll post there is MXB Ragdoll, another tool)
  Homepage: None found
  GitHub: '[avare795/MXRP-ragdoll](https://github.com/avare795/MXRP-ragdoll)'
  Version analysed: >-
    MXRP Beta 3.3 (plugin version 1.8.203), tag [v3.3](https://github.com/avare795/MXRP-ragdoll/releases/tag/v3.3), published
    28 Nov 2026: the tool's latest GitHub release when this analysis started.
  Source commit: >-
    [abafb8cd42af04b2c79460fecd5f757305e55166](https://github.com/avare795/MXRP-ragdoll/tree/abafb8cd42af04b2c79460fecd5f757305e55166)
    (the commit tag v3.3 points at; it holds the README, the roadmap and, in `source`, the installer and the update code, not the rest
    of the plugin)
  Analysed on: 28 Nov 2026
  Earlier reports: '[3.2](https://thomas4f.github.io/mxb-facts/mxrp-ragdoll/3.2/) (26 Nov 2026)'
  Tested in: 'MX Bikes beta21f (demo), installer SHA-256 `76feb83746e785310e8858938dd50b5e0685d1b0004480d5d1c2d4fc21f11949`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    The plugin is closed source; the installer and update source at the commit carries a read-only licence that allows reading it and
    building it to compare, and nothing forbids analysis. So the published source was read, the installer was rebuilt from it with
    MinGW-w64 GCC 13 and compared (it didn't match byte for byte), the author's signatures were checked with the key in the source,
    and the release files were examined: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`),
    the plugin's settings tables and the code that sets its defaults, and chosen call sites (`objdump -d`); every command is in
    `lab/evidence/mxrp-ragdoll-3.3/run.sh`. A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not
    Windows on a real GPU) and no keys ran the plugin in the MX Bikes demo (beta21f), offline behind a firewall block, under Process
    Monitor: the bare demo as baseline, a 180 s ride, a 120 s ride pressing F, E, W, Ctrl, V, Shift, Space, B and Escape, a 120 s ride
    pressing F, B, Enter, W, Shift twice, Escape and E (the furniture), and a 60 s ride pressing P, Enter, Backspace, Escape, F7 and
    F8; then the plugin test host (a crash case, a crash case with the on-foot keys, a menu-keys case and a helmet-camera case, with
    the bystander plugin's checks) and the installer started alone for 90 s with no clicks. The real game online, a server, another
    rider with the plugin and an update were not run. VirusTotal: hash lookups made before the analysis (28 Nov 2026); that run
    uploaded the three files listed on P1.
