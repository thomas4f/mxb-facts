tool: MXB Discord RPC
version: '2024-10-06'
summary: >-
  An MX Bikes plugin that shows your track, bike, session and lap as your Discord status, through Discord's own Game SDK
  library. Its source is public, it has no settings, and in the runs here it didn't load, because the zip's layout leaves
  Discord's library out of the folder the game looks in.
header:
  What it is: >-
    An open-source plugin (`discord-rpc.dlo`) for the game's `plugins` folder, with Discord's Game SDK library
    (`discord_game_sdk.dll`), which its readme says goes beside `mxbikes.exe`. While the Discord app runs, it shows in your Discord
    status what you are doing in the game: the track and bike, testing or racing with the lap, paused, spectating, watching a
    replay or in the menus.
  In one line: Plugin that shows your track, bike and lap as your Discord status
  Category: Social
  Author: stars (GitHub [starsssy](https://github.com/starsssy))
  Game: MX Bikes
  mxb-mods.com: '[Improved MX Bikes Status in Discord](https://mxb-mods.com/improved-discord-rich-presence-discord-rpc/)'
  Homepage: None found
  GitHub: '[starsssy/mxb-discord-rpc](https://github.com/starsssy/mxb-discord-rpc)'
  Version analysed: >-
    The download of 6 Oct 2024 (no version number; the mxb-mods.com page calls it "Update 2"): `MXB Discord RPC.zip`, the
    [MediaFire download](https://www.mediafire.com/file/303b4vaofhtvt3y/MXB_Discord_RPC.zip/file) linked from the mxb-mods.com
    page; its [MEGA download](https://mega.nz/file/dBQyVZwQ#03Ulu8DFr9K4OLXU3jWlD9_oFeviupIKLOGlEmv7V-0) gives the same file
    (`lab/evidence/mxb-discord-rpc-2024-10-06/mirror.txt`). The repository has no tags or releases.
  Source commit: >-
    [92fbd333129d47e96d0aaed10d11e89931824b8a](https://github.com/starsssy/mxb-discord-rpc/tree/92fbd333129d47e96d0aaed10d11e89931824b8a) ("Paused state, Cleanup", the newest commit, 6 Oct 2024 17:24 UTC). The
    plugin was built 20 minutes before it (build time stamp 6 Oct 2024 17:03:58 UTC, `lab/evidence/mxb-discord-rpc-2024-10-06/discord-rpc.dlo.objdump-p.txt`) and
    holds the "Paused" text that commit added (`lab/evidence/mxb-discord-rpc-2024-10-06/strings-status.txt`).
  Analysed on: 23 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Open source with no licence, so nothing forbids analysis: the source was read at the commit, and the plugin's imports,
    exports, code-signing entry and text were compared with it (`objdump -p`, `strings`, `objdump -d` for the crash-handler
    call); Discord's library was only identified, by SHA-256 against Discord's own SDK 3.2.1 download and by its code signature,
    and nothing inside it was examined. Every command is in `lab/evidence/mxb-discord-rpc-2024-10-06/run.sh`. The release was not
    rebuilt (Visual Studio project, see T4). A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL,
    not Windows on a real GPU), no Discord app and no keys ran the zip's files in the MX Bikes demo (beta21e), offline behind a
    firewall block, under Process Monitor: the bare demo as baseline and a 120 s ride, with the plugin and Discord's library
    both in `plugins`, as the zip lays them out; then the plugin test host with the bystander plugin. In both runs the plugin
    didn't load, because Discord's library wasn't beside `mxbikes.exe`, so none of its code ran (see Limits). VirusTotal: hash
    lookups only (made before the analysis, 23 Nov 2026), nothing uploaded.
