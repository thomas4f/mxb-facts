tool: Graphics Overhaul
version: 2.4.0
summary: >-
  An MX Bikes plugin that redraws the game with its own lighting, weather and camera effects, by swapping the game's OpenGL
  function pointers for its own, also inside other loaded plugins. It makes no internet connection; its effects run the same on
  online servers, and its menu links to a paid "Advanced" version.
header:
  What it is: >-
    A closed-source plugin (`overhaul64.dlo`) for the game's `plugins` folder, with its shader pack, a rider rig file and two rain
    sounds in `plugins\overhaul\`, and one preset in `plugins\presets\`, in a zip from its mxb-mods.com page. In the game it replaces
    the game's material shaders and adds lighting, shadows, sky, rain, puddles, fog and camera effects, with a settings menu on F5
    and an on/off key on F9.
  In one line: Plugin that redraws the game's lighting and weather by redirecting its OpenGL calls
  Category: Gameplay and visuals
  Author: Finner24 (the name in its menu and on its mxb-mods.com page)
  Game: MX Bikes
  mxb-mods.com: '[Graphics Overhaul](https://mxb-mods.com/graphics-overhaul-2/), published 3 Nov 2026, updated 16 Nov 2026'
  Homepage: '[graphicsoverhaul.com](https://graphicsoverhaul.com/), the author''s site for its paid Advanced version, linked from the menu'
  GitHub: None found
  Version analysed: >-
    Graphics Overhaul 2.4.0 (the version in its README and its log): `1794860747-graphics-overhaul.zip`, the file on its mxb-mods.com
    page; the newest release in the inventory (`registry/releases.json`, from that page, dated 16 Nov 2026). There are no tags or
    commits: the source isn't public.
  Analysed on: 27 Nov 2026
  Tested in: 'MX Bikes beta21f (demo), installer SHA-256 `76feb83746e785310e8858938dd50b5e0685d1b0004480d5d1c2d4fc21f11949`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Closed source, and the release carries no licence or clause against analysis, so the release files were examined without running
    them here: imports, exports and code-signing entries (`objdump -p`), text (`strings`, `strings -el`), the plugin's own function
    names (it ships with them) and chosen call sites (`objdump -d`), and its shader pack decoded entry by entry
    (`lab/evidence/ovpak.py`); every command is in `lab/evidence/graphics-overhaul-2.4.0/run.sh`. The release was not rebuilt (no
    public source). A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and
    no keys ran the plugin in the MX Bikes demo (beta21f), offline behind a firewall block, under Process Monitor: the bare demo as
    baseline, a 90 s run with the default settings and a 120 s run pressing F5, Escape, F5, F9, F9 and Ctrl+F9; then the plugin test
    host (a hotkey case pressing F5 and F9, and a crash and helmet-camera case, both with the bystander plugin's checks). In the real
    game the runs with the plugin stayed in the main menu and never reached the track. The real game online and the Steam build were
    not run. The rig file it ships was compared vertex by vertex (`lab/evidence/rigcmp.py`) with the game's own default rider model, from the `rider.pkz` of the public MX Bikes demo installer (beta21f, pinned in `lab/real-game/games.json`); no game file is in the repository. VirusTotal: hash lookups made before the analysis (27 Nov 2026), nothing uploaded (no licence was found,
    so the run uploads nothing).
