tool: Pitbox
version: 3.0.4
summary: >-
  A GP Bikes launcher (online rooms, mod installs, a world lap ranking) with an in-game HUD and Setup Assistant plugin.
  To use it you must sign in with Steam, link Discord and share your lap times and lap telemetry publicly; updates are
  signed and install when you click.
header:
  What it is: >-
    A Windows and Linux app in Python, shown in a WebView2 window, that lists GP Bikes' online rooms, installs missing
    tracks and bikes from gpb-mods.com, runs your own room and uploads your best laps to its own world ranking. Its
    "Instalar" button copies two closed-source plugins into the game's `plugins` folder: a HUD and a Setup Assistant
    (F8) that records your laps and telemetry.
  In one line: GP Bikes launcher, mod installer and lap ranking, with a HUD and setup assistant plugin
  Category: Mod managers
  Author: cristianboni22 (GitHub user [cristianboni22](https://github.com/cristianboni22))
  Game: GP Bikes
  gpb-mods.com: '[Pitbox – Launcher, Setup Assistant & HUD for GP Bikes](https://gpb-mods.com/pitbox-launcher-setup-assistant-hud-for-gp-bikes/)'
  Homepage: None found
  GitHub: '[cristianboni22/pitbox](https://github.com/cristianboni22/pitbox)'
  Version analysed: >-
    3.0.4, GitHub release [v3.0.4](https://github.com/cristianboni22/pitbox/releases/tag/v3.0.4) (20 Nov 2026), the
    tool's latest GitHub release when the analysis started. The repository holds only a README: the app's Python code is
    read as it ships in the release, and the plugins have no public source.
  Source commit: >-
    [dc05ea0caf9d89b36ea6b23bb50c9ae2b33f5ac3](https://github.com/cristianboni22/pitbox/tree/dc05ea0caf9d89b36ea6b23bb50c9ae2b33f5ac3)
    (tag v3.0.4; its only file is README.md)
  Analysed on: 24 Nov 2026
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    No licence was found (the repository and the release hold none), so the release was examined: the app's Python code,
    which ships as source, was searched and read for every network call, file deletion, registry, process and server
    call; the two plugins (no public source) by their imports, sections, code-signing entry, text and the call sites of
    their memory-protection, file and key imports (`objdump`, `strings`); the update notice and file list were checked
    against the Ed25519 key in the app. Every command is in `lab/evidence/pitbox-3.0.4/run.sh`. Nothing could be rebuilt.
    A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL, not Windows on a real GPU) and no
    keys ran, under Process Monitor with every program in the run folder blocked by the firewall: the GP Bikes demo
    (beta22b) bare as baseline, then with the HUD plugin on track pressing its keys (twice, the second pressing the
    Setup Assistant's keys too); the plugin test host with the HUD, the Setup Assistant, both with a crash and helmet
    view, and the bystander plugin's checks; and the app for 120 seconds, without signing in (it needs a Steam and a
    Discord account). The Linux package wasn't run. VirusTotal: hash lookups made before the analysis (24 Nov 2026);
    nothing uploaded, because no licence was found.
