files_note: >-
  Neither plugin is code-signed (`lab/evidence/mx-dirt-mod-1.7.1/signature.txt`). Every file but the two plugins is the same file
  as in the source at the commit (`lab/evidence/mx-dirt-mod-1.7.1/same-as-source.txt`). The hashes match the zip the Windows
  machine ran (`lab/results/mx-dirt-mod-1.7.1/ride-windows/machine.txt`, `lab/results/mx-dirt-mod-1.7.1/ride-windows/plugins.sha256`).
key:
  K1: No malware found. No engine flagged the files VirusTotal knows, but the zip and both plugins aren't on VirusTotal.
  K2: No. It has no updater; you install a new release by hand.
  K3: 'Partly; the installer moves another dirt plugin out of `plugins`, and the settings window moves a track''s saved wear when you reset it; both are kept in a backup folder.'
  K4: No. Nothing is sent; it makes no connection.
  K5: 'Yes; it hooks and patches the game''s code in memory and turns off the game''s own tyre digging, in Testing; online only if you turn on its experimental online wear.'
  K6: 'No; it reads tracks'' terrain from the game''s memory, and saves a copy only with a debug setting that is off.'
  K7: Yes. The full source is public under GPL-3.0.
  K8: 'Yes, as far as checked; one troubleshooting line doesn''t match the code (see "What it says vs what it does").'
  K9: 'Partly; a rebuild gives the release''s code byte for byte, with two runtime constants and the build ID different; nothing is signed.'
  K10: No. Neither the plugins nor the scripts make a connection.
areas:
  Your PC and files: >-
    No updater and no connection; the installer moves files it replaces, and other dirt plugins, into a backup folder, and the
    plugins aren't signed. After uninstalling, your recorded laps and the game's saved track wear stay.
  Your data: Sends nothing and needs no account; its scripts read Steam's library list to find the game.
  Your game: >-
    Two plugins that hook and patch the game's code in memory, replace the game's tyre digging and read its terrain, only in
    Testing unless you turn on online wear; F10 starts its settings window.
  Creators' content: Reads each track's terrain from the game's memory; a debug setting, off by default, saves it to a file.
  Transparency: Full source public under GPL-3.0; the release matches a rebuild except two runtime constants, but isn't built by CI and its compiler isn't pinned.
  Money: Free; no shop and no donation request.
sections:
  - title: Your PC and files
    blocks:
      - text: >-
          Also found: both plugins hash `mxbikes.exe` at start and stay off unless it is the one Steam build named in
          `SUPPORTED_EXE.txt`; in every Windows run (the MX Bikes demo, and the test host) both stayed off, and the game and
          the host ran on
          ([mx_dirt.c lines 979-982](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mx_dirt.c#L979-L982),
          [mxdirt_render_host.c lines 351-360](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/render/mxdirt_render_host.c#L351-L360);
          `lab/evidence/mx-dirt-mod-1.7.1/supported-exe.txt`, `lab/evidence/mx-dirt-mod-1.7.1/runs.txt`).
        mark: note
      - text: >-
          Also found: the installer removes Windows' "downloaded from the internet" mark from every file of the extracted zip,
          and puts an "MX Dirt Mod" shortcut on your desktop that runs the settings window with PowerShell's execution policy
          set to Bypass
          ([Install.ps1 lines 20-21](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/install/Install.ps1#L20-L21),
          [Install.ps1 lines 44-48](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/install/Install.ps1#L44-L48);
          `lab/evidence/mx-dirt-mod-1.7.1/scripts-actions.txt`).
        mark: note
  - title: Your data
    blocks: []
  - title: Your game
    blocks:
      - table: [What, Where in the game, When]
        rows:
          - What: >-
              Two changed instruction sites in the game's terrain code: the deformation add can also raise the ground (berms),
              and raised ground still finds its surface material (through a small relay page it allocates)
            Where in the game: '`mxbikes.exe` + 0x1f61e6 and + 0x1f1f65 (simulation plugin)'
            When: At each Testing track load; put back when you leave the track or the game closes
          - What: >-
              Calls redirected to the plugin: the per-physics-step wheel-force call, the outer scheduler step, two track-close
              calls, and, while a track starts, the network-receive call and the game's tyre digging (excavation), which it
              suppresses so its own simulation alone shapes the ruts
            Where in the game: '`mxbikes.exe` (simulation plugin)'
            When: From session start on a Testing track; removed at track close
          - What: >-
              The call to the terrain draw, and the game's stored pointers to glDrawRangeElementsBaseVertex, glDrawRangeElementsEXT
              and glDrawElements, redirected to read the camera and draw the dirt pass after the ground; an optional fix
              (`raised_dirt_surface=1`, on by default) so raised ground shows the dirt surface
            Where in the game: '`mxbikes.exe` + 0x24f613 and its GL pointer slots (look plugin)'
            When: At each Testing track load; put back at track close
      - text: >-
          Also found: F10 (`launcher_key` in `mx_dirt_render.ini`) is MX Bikes' own screenshot key too: in the run that pressed
          it, the game saved two screenshots, as it does without the plugin
          (`lab/evidence/mx-dirt-mod-1.7.1/outside.txt`).
        mark: note
  - title: Creators' content
    blocks: []
  - title: Transparency
    blocks: []
  - title: Money
    blocks: []
  - title: What it says vs what it does
    blocks:
      - table: [Claim, Verdict, Evidence]
        rows:
          - Claim: >-
              "With any other game version it switches itself off and the game runs normally, until a release for that version is
              out. Nothing breaks." (README)
            Verdict: Matches
            Evidence: >-
              Both plugins return from Startup when the hash differs; in the demo and the test host both stayed off and the game
              ran ([mx_dirt.c line 982](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mx_dirt.c#L982),
              [mxdirt_render_host.c line 391](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/render/mxdirt_render_host.c#L391);
              `lab/evidence/mx-dirt-mod-1.7.1/runs.txt`).
          - Claim: '"By default the mod does nothing in online races." (README)'
            Verdict: Matches
            Evidence: >-
              Both plugins accept only a Testing event (type 1), or a race (type 2) with `online_wear=1`, which is 0 by default
              ([mx_dirt.c lines 1022-1025](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mx_dirt.c#L1022-L1025),
              [mxdirt_render_host.c lines 107-117](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/render/mxdirt_render_host.c#L107-L117)).
              Not seen on a server.
          - Claim: >-
              "never deletes anything. Every file it replaces is moved to `Documents\PiBoSo\MX Bikes\mx_dirt_mod_backups\install-<date>`"
              (README, the installer)
            Verdict: Matches
            Evidence: >-
              The installer only copies and moves; the uninstaller moves
              ([Install.ps1 lines 29-43](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/install/Install.ps1#L29-L43),
              [Uninstall.ps1 lines 24-27](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/install/Uninstall.ps1#L24-L27);
              `lab/evidence/mx-dirt-mod-1.7.1/scripts-actions.txt`). Not run.
          - Claim: >-
              "The mod never changes mxbikes.exe or any game file on disk. Its engine fixes live only in memory while a track is
              loaded." (README)
            Verdict: Partly
            Evidence: >-
              The plugins write only their own files, and the patches are in memory and removed at track close
              ([mxdirt_patches.c lines 109-118](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mxdirt_patches.c#L109-L118)).
              But the settings window's "Reset this track's wear" moves the game's saved track file `testing.dfm` (the README says
              so in other sections), and the game saves the mod's ruts into that file
              ([MXDirtLauncher.ps1 lines 215-222](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/launcher/MXDirtLauncher.ps1#L215-L222)).
          - Claim: >-
              "Open MX Bikes\plugins\mx_dirt.jsonl in Notepad. The first line shows exe_sha256. If it doesn't match
              SUPPORTED_EXE.txt, your MX Bikes version isn't supported yet" (README, Troubleshooting)
            Verdict: Doesn't match
            Evidence: >-
              The simulation plugin returns before it opens `mx_dirt.jsonl` when the hash differs, so with another game version
              there is no such file; none was written in any run
              ([mx_dirt.c lines 982-995](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mx_dirt.c#L982-L995);
              `lab/evidence/mx-dirt-mod-1.7.1/runs.txt`). The look plugin's `mx_dirt_render.log` does log `exe_hash_mismatch`.
  - title: Limits of this analysis
    blocks:
      - limits:
          - text: >-
              The runs were on a Windows Server machine with software OpenGL (Mesa llvmpipe), not Windows on a real GPU, in the MX
              Bikes demo, offline.
            questions: []
          - text: >-
              None of the plugins' game code ran: the demo's `mxbikes.exe` (and the test host) isn't the Steam build the plugins
              accept, so both switched off at start. The hooks, patches, files written, the F10 key and the launcher start rest on
              the source, read at the commit, and on a rebuild that matches the release's code. A run with the supported Steam
              build needs a purchase.
            questions: [P7, D6, G2, G4, G5, G6, G7, G10, C5]
          - text: >-
              The installer, uninstaller and settings window (PowerShell scripts) weren't run; what they do rests on reading them,
              and they are the same files as in the source.
            questions: [P4, P6, P8, D6, G6]
          - text: >-
              Online wear (`online_wear=1`) was neither run nor seen on a server; it is off by default.
            questions: [G3]
          - text: >-
              The rebuild was made on Linux; the release differs from it in two 10-byte constants of the compiler's runtime code and in
              the build ID, which hashes the file. A rebuild on Windows with Zig 0.16.0 wasn't possible here: Zig's Windows build
              fails under Wine.
            questions: [T4, P5]
answers:
  P1:
    verdict: 'No'
    mark: note
    text: >-
      No engine flagged the files VirusTotal knows: `Install.cmd` 0 of 61, `Uninstall.cmd` 0 of 61, `Install.ps1` 0 of 61,
      `LICENSE` 0 of 61, `SUPPORTED_EXE.txt` 0 of 60 engines. Not on VirusTotal (hash lookup on 23 Nov 2026): the zip,
      `MX-Dirt-Mod-1.7.1.sha256.txt`, `mx_dirt.dlo`, `mx_dirt_render.dlo`, both `.ini` files, `Uninstall.ps1`,
      `MXDirtLauncher.ps1`, `MX Dirt Mod.cmd` and `README.txt`. Nothing uploaded.
    evidence: >-
      [MX-Dirt-Mod-1.7.1.zip](https://www.virustotal.com/gui/file/2b496d6fa60d0e1b81c3d67c15b83f0718aad2300638bc8bce970f837cff6c38),
