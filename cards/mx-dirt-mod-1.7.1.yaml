tool: MX Dirt Mod
version: 1.7.1
summary: >-
  Two MX Bikes plugins that simulate track wear (ruts, bumps, berms, a loose top layer) and write it into the game's own
  terrain by hooking and patching the game's code in memory, plus PowerShell scripts that install it and change its settings.
  Its full source is public under GPL-3.0, and a rebuild with Zig 0.16.0 gives the release's code byte for byte.
header:
  What it is: >-
    Two open-source plugins for the game's `plugins` folder: `mx_dirt.dlo` simulates the soil under your tyres in Testing and
    writes ruts and bumps into the game's terrain, which the bike then rides; `mx_dirt_render.dlo` shades the worn ground and
    draws a loose top layer with tyre marks. Both work only with one Steam build of `mxbikes.exe`. The zip also holds PowerShell
    scripts: an installer and uninstaller, and a settings window (the "launcher") that F10 brings up from the game.
  In one line: Plugins that wear the track's terrain as you ride, with a settings window
  Category: Gameplay and visuals
  Author: kadenball (GitHub [kadenball](https://github.com/kadenball))
  Game: MX Bikes
  mxb-mods.com: '[Dirt/Erode Overhall](https://mxb-mods.com/dirt-erode-overhall/)'
  Homepage: None found
  GitHub: '[kadenball/mx-dirt-mod](https://github.com/kadenball/mx-dirt-mod)'
  Version analysed: >-
    [1.7.1](https://github.com/kadenball/mx-dirt-mod/releases/tag/v1.7.1) (tag `v1.7.1`, published 17 Nov 2026), the newest
    GitHub release in `registry/releases.json`; the mxb-mods.com page links a zip of the same size.
  Source commit: >-
    [5c300cccd92f533e415b7258ee084feb2d35fc97](https://github.com/kadenball/mx-dirt-mod/tree/5c300cccd92f533e415b7258ee084feb2d35fc97)
    ("MX Dirt Mod 1.7.1: stutter fix, no box around the bike", 16 Nov 2026), the commit tag `v1.7.1` points to.
  Analysed on: 23 Nov 2026
  Tested in: 'MX Bikes beta21e (demo), installer SHA-256 `a4c688dab24ab5499171d1416649b109a39b8cd6e82892055db382ea852c0ab0`'
  Method: >-
    100% AI-assisted: Claude Code with `claude-opus-5-5`, medium effort, from the published prompt (prompts/analyse-tool.md).
    Open source under GPL-3.0, which allows analysis. The source was read at the commit; every file in the zip except the two
    plugins was compared with it (identical), and the two plugins were rebuilt with Zig 0.16.0 for Linux and compared byte for
    byte (see T4); their imports, exports, code-signing entries and text were read with `objdump` and `strings`. Every command is in
    `lab/evidence/mx-dirt-mod-1.7.1/run.sh`. A throwaway Windows Server 2025 machine with no GPU (Mesa llvmpipe software OpenGL,
    not Windows on a real GPU) and no keys ran the plugins in the MX Bikes demo (beta21e), offline behind a firewall block, under
    Process Monitor: the bare demo as baseline, a 120 s ride, and a 90 s ride pressing F10 twice; then the plugin test host
    (default, F10 pressed, and a crash) with the bystander plugin. The demo's `mxbikes.exe` isn't the Steam build the plugins
    accept, so both plugins switched themselves off at start and none of their game code ran (see Limits). The installer,
    uninstaller and launcher scripts weren't run. VirusTotal: hash lookups only (made before the analysis, 23 Nov 2026), nothing
    uploaded.
