  P2:
    verdict: 'No'
    mark: good
    text: It has no updater; the plugins and scripts hold no web address and make no web request, and the README has you install a new release by hand.
    evidence: '`lab/evidence/mx-dirt-mod-1.7.1/strings-urls.txt`, `lab/evidence/mx-dirt-mod-1.7.1/imports-absent.txt`.'
  P3:
    verdict: Doesn't apply
    text: There is no updater.
    evidence: '`lab/evidence/mx-dirt-mod-1.7.1/strings-urls.txt`.'
  P4:
    verdict: Partly
    mark: note
    text: >-
      It only moves such files and keeps them: the installer moves `living_dirt.dlo` (the separate Living Dirt plugin) and
      pre-release builds of this mod out of `plugins` into `Documents\PiBoSo\MX Bikes\mx_dirt_mod_backups`; on request, the
      settings window's "Reset this track's wear" moves the game's saved track file `testing.dfm` to the same backup folder. The
      plugins delete only their own temporary files.
    evidence: >-
      [Install.ps1 lines 29-35](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/install/Install.ps1#L29-L35),
      [MXDirtLauncher.ps1 lines 215-222](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/launcher/MXDirtLauncher.ps1#L215-L222),
      [mxdirt_laps.inc line 44](https://github.com/kadenball/mx-dirt-mod/blob/5c300cccd92f533e415b7258ee084feb2d35fc97/src/core/mxdirt_laps.inc#L44);
      `lab/evidence/mx-dirt-mod-1.7.1/scripts-actions.txt`.
  P5:
    verdict: 'No'
    mark: concern
    text: >-
      Neither plugin is code-signed, and the scripts carry no signature. A rebuild matches the code but not every byte (T4), and
      there is no CI build (T3).
    evidence: Empty Security Directory (`lab/evidence/mx-dirt-mod-1.7.1/signature.txt`); `lab/evidence/mx-dirt-mod-1.7.1/rebuild.txt`.
  P6:
    verdict: 'No'
    mark: good
    text: >-
      Nothing in the registry or Windows settings is changed: the scripts only read Steam's registry key, the plugins import no
      registry function, and the runs show no registry write beyond the bare demo's. The installer adds a desktop shortcut (P8).
    evidence: >-
      `lab/evidence/mx-dirt-mod-1.7.1/scripts-actions.txt`, `lab/evidence/mx-dirt-mod-1.7.1/imports-absent.txt`;
      `lab/results/mx-dirt-mod-1.7.1/ride-windows/registry.txt`, `lab/results/mx-dirt-mod-1.7.1/baseline-windows/registry.txt`.
  P7:
    verdict: 'Yes'
    mark: note
    text: >-
      Beyond its plugins and settings it writes its own files: logs (`mx_dirt.jsonl`, `mx_dirt_render.log`), your recorded laps
      (`plugins\mx_dirt_laps`), each track's soil state and marks (`plugins\mx_dirt_soft`), the settings window
