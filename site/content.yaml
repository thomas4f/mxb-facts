# The site's own words, in Markdown, in one place: the build puts them in the feed (api/v1/site.json and index.json) and the
# pages draw them from there. Links are absolute https addresses, as the feed requires. Rule 8's AI note is ai_note.
# The home page's heading, also on the site's link preview and in every page's description; heading_accent is its word drawn
# in the accent colour.
heading: Check before you install.
heading_accent: Check
lede: >-
  Plugins, apps and mods for MX Bikes and GP Bikes run on your PC with your access: they can change your files and game,
  and send your data. Each gets a score out of 100: the lower it is, the more it does that you might not want.
# The home page's description for search results and link previews (meta description, og:description): at most 160
# characters, so Google shows it whole.
description: >-
  Check before you install. Plugins, apps and mods for MX Bikes and GP Bikes can change your files and game, and send your
  data. See what each one does.
ai_note: >-
  Claude, an AI, does the analysis from [a public prompt](https://thomas4f.github.io/mxb-facts/how/#prompt), and no person
  checks each answer, so one can be wrong. A score sums up the findings and what could be checked: a high score doesn't prove
  a tool does no harm, and a low one doesn't prove it does. Authors can [run the same check](https://thomas4f.github.io/mxb-facts/authors/)
  on their own tool before a release, and correct anything a card gets wrong.
# The AI note in one line, where the full one would push the content down (the tools list); it links to the full note.
ai_short: >-
  An AI analyses each tool from a public prompt, and no person checks each answer, so one can be wrong.
  [How it works](https://thomas4f.github.io/mxb-facts/how/)
maintainer_notice: >-
  **Made by the maintainer of MXB Facts.** thomas4f, who runs this project, makes this tool. It is analysed from the same
  prompt, answers the same questions and is scored by the same fixed costs as every other tool, and every line links its
  evidence, so you can check it yourself. The maintainer directs and publishes every card, this one included. Like any author, the
  maintainer can run the For authors check on a release before it is out ([conflict of interest](https://github.com/thomas4f/mxb-facts#conflict-of-interest)).
# What a mark is, and what a tag is, in the Reading a card legend: one line each, above its list.
marks: >-
  Every answer has one mark, the same word, colour and icon on every card: what it means for you and, where the tool has a
  score, what it costs
tags: >-
  A tag on the tools list and a card sums up one answer, in its mark's colour: orange for a Concern, red for a Major, grey
  and dashed when it happens only after a choice you make, green when it is in the tool's favour. Hover a tag for what it
  means, as listed here; select it for the answer and its evidence. A question that can be a Note gets a tag only where it
  is a Concern
# What "Under review" means, in the Reading a card legend and on the mark's hover.
under_review: >-
  Someone has sent a correction about this answer, or something it misses. It costs nothing, and no answer, mark or score
  changes until it is decided. The author's context is listed under Comments and corrections and puts no answer under review
# What the "newer release" chip and notice mean, in the Reading a card legend and on the chip's hover.
newer_release: >-
  The weekly check has seen a newer release, or a newer download on a mods site, that has no card yet. The card and its
  score stay those of the release analysed, until the new release's card is published
how_a_card_is_made:
  - >-
    **A tool is picked:** requested ones first, in the order asked, then the maintainer's pick from the mods sites. Its files are pinned by hash.
  - >-
    **The licence is read first.** If it forbids analysis, only public facts are covered and the tool isn't scored.
  - >-
    **The AI analyses it** from the published prompt: source or binaries, an offline run on a throwaway Windows machine, and a VirusTotal lookup (a publicly released file VirusTotal has never seen may be uploaded for a scan). Every answer links its evidence; what couldn't be proven goes under "Limits of this analysis".
  - >-
    **The build sets the marks, tags and scores** from the answers, by fixed rules; nobody picks one by hand.
  - >-
    **Anyone can comment** on GitHub, the author included. A fix gets a dated line in the card's history; a new release gets a new card. A security problem is first told to the author privately (rule 9).
